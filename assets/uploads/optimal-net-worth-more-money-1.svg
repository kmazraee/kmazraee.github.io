<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" direction="rtl" font-family="Vazirmatn, Tahoma, Arial, sans-serif">
  <rect width="800" height="420" fill="#faf8f3"/>
  <text x="400" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2a37">پولدار یا ثروتمند؟</text>
  <rect x="527" y="80" width="213" height="230" rx="14" fill="#eaf4ef" stroke="#d9d3c4"/>
  <text x="633" y="118" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2a37">پولدار</text>
  <text x="633" y="160" text-anchor="middle" font-size="15" fill="#4b5563">مقدار زیاد پول</text>
  <text x="633" y="190" text-anchor="middle" font-size="15" fill="#4b5563">عدد حساب بانکی</text>
  <text x="633" y="220" text-anchor="middle" font-size="15" fill="#4b5563">سقف ندارد</text>
  <rect x="293" y="80" width="213" height="230" rx="14" fill="#eef2f9" stroke="#d9d3c4"/>
  <text x="400" y="118" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2a37">حد مطلوب</text>
  <text x="400" y="160" text-anchor="middle" font-size="15" fill="#4b5563">نیازها تأمین</text>
  <text x="400" y="190" text-anchor="middle" font-size="15" fill="#4b5563">هزینه‌ی زندگی مطلوب</text>
  <text x="400" y="220" text-anchor="middle" font-size="15" fill="#4b5563">سرمایه‌ی هدف مشخص</text>
  <rect x="60" y="80" width="213" height="230" rx="14" fill="#fbf1e3" stroke="#d9d3c4"/>
  <text x="167" y="118" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2a37">ثروتمند</text>
  <text x="167" y="160" text-anchor="middle" font-size="15" fill="#4b5563">اختیار بر زمان</text>
  <text x="167" y="190" text-anchor="middle" font-size="15" fill="#4b5563">روابط سالم</text>
  <text x="167" y="220" text-anchor="middle" font-size="15" fill="#4b5563">رضایت پایدار</text>
  <rect x="60" y="334" width="680" height="54" rx="12" fill="#ffffff" stroke="#b8d9cb"/>
  <text x="400" y="368" text-anchor="middle" font-size="17" fill="#1f2a37">مقدار مهم است: بپرسید این عدد چه آزادی‌ای می‌خرد</text>
</svg>
