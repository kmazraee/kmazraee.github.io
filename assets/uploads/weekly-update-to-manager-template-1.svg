<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="ایمیل گزارش هفتگی (دو بخش)">
<rect width="800" height="400" fill="#ffffff"/>
<text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">ایمیل گزارش هفتگی (دو بخش)</text>
<rect x="80" y="70" width="640" height="63" rx="10" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400.0" y="107.5" text-anchor="middle" font-size="18" fill="#1f2937">موضوع: گزارش هفتگی + تاریخ</text>
<rect x="80" y="147" width="640" height="63" rx="10" fill="#e6f6ec" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400.0" y="184.5" text-anchor="middle" font-size="18" fill="#1f2937">بخش اول: دستاوردها و همکاری‌های هفته‌ی گذشته</text>
<rect x="80" y="224" width="640" height="63" rx="10" fill="#fff4e0" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400.0" y="261.5" text-anchor="middle" font-size="18" fill="#1f2937">بخش دوم: اولویت‌ها و برنامه‌ی هفته‌ی آینده</text>
<rect x="80" y="301" width="640" height="63" rx="10" fill="#f3e8fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400.0" y="338.5" text-anchor="middle" font-size="18" fill="#1f2937">یادآوری: نیازی به پاسخ نیست</text>
</svg>
