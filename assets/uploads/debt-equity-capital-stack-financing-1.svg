<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" font-family="sans-serif">
<rect width="800" height="470" fill="#ffffff"/>
<text x="400" y="38" font-size="22" font-weight="bold" fill="#1f2937" text-anchor="middle" direction="rtl">پشته‌ی ساختار سرمایه</text>
<rect x="200" y="70" width="560" height="68" rx="8" fill="#1e3a8a"/>
<text x="740" y="100" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="start" direction="rtl">سهام عادی</text>
<text x="740" y="124" font-size="14" fill="#ffffff" text-anchor="start" direction="rtl">آخرین صف پرداخت، بیشترین سهم از رشد</text>
<rect x="200" y="146" width="560" height="68" rx="8" fill="#1d4ed8"/>
<text x="740" y="176" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="start" direction="rtl">سهام ممتاز</text>
<text x="740" y="200" font-size="14" fill="#ffffff" text-anchor="start" direction="rtl">سود ترجیحی، حق تبدیل یا بازخرید</text>
<rect x="200" y="222" width="560" height="68" rx="8" fill="#3b82f6"/>
<text x="740" y="252" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="start" direction="rtl">بدهی فرعی و مزانین</text>
<text x="740" y="276" font-size="14" fill="#ffffff" text-anchor="start" direction="rtl">پس از بدهی ارشد، گاه با حق تبدیل</text>
<rect x="200" y="298" width="560" height="68" rx="8" fill="#60a5fa"/>
<text x="740" y="328" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start" direction="rtl">بدهی ارشد بدون وثیقه</text>
<text x="740" y="352" font-size="14" fill="#1f2937" text-anchor="start" direction="rtl">اوراق قرضه، اوراق تجاری</text>
<rect x="200" y="374" width="560" height="68" rx="8" fill="#93c5fd"/>
<text x="740" y="404" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start" direction="rtl">بدهی ارشد وثیقه‌دار</text>
<text x="740" y="428" font-size="14" fill="#1f2937" text-anchor="start" direction="rtl">وام مدت‌دار، خط اعتباری، وام رهنی</text>
<defs><marker id="ah" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" refX="8" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#dc2626"/></marker><marker id="ag" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" refX="8" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#16a34a"/></marker></defs>
<line x1="130" y1="440" x2="130" y2="78" stroke="#dc2626" stroke-width="4" marker-end="url(#ah)"/>
<text x="108" y="260" font-size="15" fill="#dc2626" text-anchor="middle" transform="rotate(-90 108 260)" direction="rtl">ریسک و بازده مورد انتظار بیشتر</text>
<line x1="165" y1="80" x2="165" y2="434" stroke="#16a34a" stroke-width="4" marker-end="url(#ag)"/>
<text x="185" y="260" font-size="15" fill="#16a34a" text-anchor="middle" transform="rotate(-90 185 260)" direction="rtl">اولویت بازپرداخت بیشتر</text>
</svg>