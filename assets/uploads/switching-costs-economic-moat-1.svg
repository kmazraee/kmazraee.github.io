<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="مقایسه‌ی هزینه‌ی جابه‌جایی پایین (جوراب) و بالا (حساب بانکی و پایگاه داده)">
<rect width="800" height="310" fill="#faf7f0"/>
<text x="400" y="34" text-anchor="middle" font-size="22" fill="#2b2b2b" font-weight="bold">هر چه جابه‌جایی سخت‌تر، سد رقابتی قوی‌تر</text>
<text x="715" y="100" text-anchor="middle" font-size="16" fill="#2b2b2b">جوراب ساده</text>
<rect x="470" y="78" width="60" height="32" rx="6" fill="#5a9a6b"/><text x="500" y="100" text-anchor="middle" font-size="13" fill="#fff">پایین</text>
<text x="715" y="166" text-anchor="middle" font-size="16" fill="#2b2b2b">حساب جاری بانکی</text>
<rect x="320" y="144" width="210" height="32" rx="6" fill="#c98a3d"/><text x="425" y="166" text-anchor="middle" font-size="13" fill="#fff">زیاد (کاغذبازی، قبض‌ها)</text>
<text x="715" y="232" text-anchor="middle" font-size="16" fill="#2b2b2b">پایگاه داده‌ی سازمانی</text>
<rect x="120" y="210" width="410" height="32" rx="6" fill="#b5524a"/><text x="325" y="232" text-anchor="middle" font-size="13" fill="#fff">بسیار زیاد (هزاران نفرساعت و ریسک)</text>
<text x="400" y="284" text-anchor="middle" font-size="13" fill="#666">طول میله = سختی جابه‌جایی (مقایسه‌ی تقریبی)</text>
</svg>
