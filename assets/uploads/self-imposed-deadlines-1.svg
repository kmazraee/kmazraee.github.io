<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="پنج گام رعایت ددلاین شخصی: دلیل شخصی، هدف هوشمند، پرداخت پیشاپیش، تقسیم کار و زمان‌بندی در تقویم و سیستم پاسخ‌گویی">
<rect width="800" height="400" fill="#ffffff"/>
<text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">پنج گام رعایت ددلاین شخصی</text>
<rect x="80" y="70" width="640" height="48" rx="10" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="100" text-anchor="middle" font-size="18" fill="#1f2937">۱. دلیل شخصی</text>
<rect x="80" y="132" width="640" height="48" rx="10" fill="#e6f6ec" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="162" text-anchor="middle" font-size="18" fill="#1f2937">۲. هدف هوشمند</text>
<rect x="80" y="194" width="640" height="48" rx="10" fill="#fff4e0" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="224" text-anchor="middle" font-size="18" fill="#1f2937">۳. پرداخت پیشاپیش</text>
<rect x="80" y="256" width="640" height="48" rx="10" fill="#f3e8fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="286" text-anchor="middle" font-size="18" fill="#1f2937">۴. تکه‌تکه کردن و تقویم</text>
<rect x="80" y="318" width="640" height="48" rx="10" fill="#fde8e8" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="348" text-anchor="middle" font-size="18" fill="#1f2937">۵. سیستم پاسخ‌گویی</text>
</svg>
