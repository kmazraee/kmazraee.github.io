<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 232" font-family="Vazirmatn, Tahoma, Arial, sans-serif">
<rect width="800" height="232" rx="14" fill="#f7f5ef"/>
<text direction="rtl" x="400.0" y="48" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2a37">چهار قاعده‌ی مهلت مهربانانه</text>
<line x1="300" y1="64" x2="500" y2="64" stroke="#b08d57" stroke-width="3"/>
<rect x="603" y="84" width="177" height="124" rx="10" fill="#ffffff" stroke="#d9d2c0"/>
<circle cx="756" cy="108" r="14" fill="#1f4e5f"/>
<text direction="rtl" x="756" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
<text direction="rtl" x="732" y="114" text-anchor="start" font-size="15" font-weight="700" fill="#1f2a37">مهلت = کمک</text>
<text direction="rtl" x="766" y="146" text-anchor="start" font-size="13" fill="#4b5563">اولویت را روشن می‌کند</text>
<rect x="408" y="84" width="177" height="124" rx="10" fill="#ffffff" stroke="#d9d2c0"/>
<circle cx="562" cy="108" r="14" fill="#1f4e5f"/>
<text direction="rtl" x="562" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>
<text direction="rtl" x="538" y="114" text-anchor="start" font-size="15" font-weight="700" fill="#1f2a37">دلیل</text>
<text direction="rtl" x="572" y="146" text-anchor="start" font-size="13" fill="#4b5563">چرا مهم و فوری است؟</text>
<rect x="214" y="84" width="177" height="124" rx="10" fill="#ffffff" stroke="#d9d2c0"/>
<circle cx="368" cy="108" r="14" fill="#1f4e5f"/>
<text direction="rtl" x="368" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3</text>
<text direction="rtl" x="344" y="114" text-anchor="start" font-size="15" font-weight="700" fill="#1f2a37">حاشیه</text>
<text direction="rtl" x="378" y="146" text-anchor="start" font-size="13" fill="#4b5563">زمان برای طرح ب</text>
<rect x="20" y="84" width="177" height="124" rx="10" fill="#ffffff" stroke="#d9d2c0"/>
<circle cx="173" cy="108" r="14" fill="#1f4e5f"/>
<text direction="rtl" x="173" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">4</text>
<text direction="rtl" x="149" y="114" text-anchor="start" font-size="15" font-weight="700" fill="#1f2a37">شفافیت</text>
<text direction="rtl" x="183" y="146" text-anchor="start" font-size="13" fill="#4b5563">درباره‌ی حاشیه بگویید</text>
</svg>
