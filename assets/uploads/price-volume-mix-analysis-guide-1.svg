<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" font-family="Vazirmatn, Tahoma, sans-serif">
  <rect width="800" height="460" fill="#ffffff"/>
  <text x="400" y="38" text-anchor="middle" direction="rtl" font-size="22" font-weight="bold" fill="#1f2937">پل درآمد: از ۸۰ هزار تا ۸۷٫۵ هزار</text>
  <text x="400" y="64" text-anchor="middle" direction="rtl" font-size="14" fill="#6b7280">مثال فرضی؛ اعداد به هزار واحد پول</text>
  <!-- baseline at y=380 ; scale: 1 unit(thousand) = 2.8px ; values: 80 -> 224px -->
  <line x1="60" y1="380" x2="740" y2="380" stroke="#9ca3af" stroke-width="1"/>
  <!-- Bars laid out right-to-left for RTL reading -->
  <!-- Last year: 80 -> top 156 -->
  <rect x="630" y="156" width="90" height="224" fill="#64748b"/>
  <text x="675" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">۸۰</text>
  <text x="675" y="404" text-anchor="middle" direction="rtl" font-size="15" fill="#1f2937">درآمد سال قبل</text>
  <!-- Price +2.5 : from 80 to 82.5 -> y 156 to 149 -->
  <rect x="505" y="149" width="90" height="7" fill="#16a34a"/>
  <text x="550" y="139" text-anchor="middle" font-size="16" font-weight="bold" fill="#16a34a">+۲٫۵</text>
  <text x="550" y="404" text-anchor="middle" direction="rtl" font-size="15" fill="#1f2937">اثر قیمت</text>
  <!-- Volume +16 : 82.5 -> 98.5 ; y 149 -> 104.2 -->
  <rect x="380" y="104" width="90" height="45" fill="#16a34a"/>
  <text x="425" y="94" text-anchor="middle" font-size="16" font-weight="bold" fill="#16a34a">+۱۶</text>
  <text x="425" y="404" text-anchor="middle" direction="rtl" font-size="15" fill="#1f2937">اثر حجم</text>
  <!-- Mix -11 : 98.5 -> 87.5 ; y 104 -> 135 -->
  <rect x="255" y="104" width="90" height="31" fill="#dc2626"/>
  <text x="300" y="155" text-anchor="middle" font-size="16" font-weight="bold" fill="#dc2626">−۱۱</text>
  <text x="300" y="404" text-anchor="middle" direction="rtl" font-size="15" fill="#1f2937">اثر ترکیب</text>
  <!-- This year 87.5 -> top 135 -->
  <rect x="130" y="135" width="90" height="245" fill="#2563eb"/>
  <text x="175" y="125" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">۸۷٫۵</text>
  <text x="175" y="404" text-anchor="middle" direction="rtl" font-size="15" fill="#1f2937">درآمد امسال</text>
  <!-- connectors -->
  <line x1="595" y1="156" x2="630" y2="156" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <line x1="470" y1="149" x2="505" y2="149" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <line x1="345" y1="104" x2="380" y2="104" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <line x1="220" y1="135" x2="255" y2="135" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <text x="400" y="440" text-anchor="middle" direction="rtl" font-size="14" fill="#374151">رشد حجم بیشتر از کل رشد درآمد بود، اما جابه‌جایی فروش به محصول ارزان‌تر بخشی از آن را خورد.</text>
</svg>
