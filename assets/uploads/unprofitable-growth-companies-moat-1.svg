<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 365" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="چهار حالت شرکت‌های زیان‌ده بر اساس رشد و خندق">
<rect width="800" height="365" fill="#faf7f0"/>
<text x="400" y="36" text-anchor="middle" font-size="22" fill="#2b2b2b" font-weight="bold">شرکت زیان‌ده؛ فقط یک ترکیب ارزش ریسک را دارد</text><rect x="410" y="70" width="350" height="115" rx="12" fill="#e3f0e6" stroke="#5a9a6b" stroke-width="2"/><text x="585" y="118" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold">رشد سریع + خندق در حال ساخت</text><text x="585" y="150" text-anchor="middle" font-size="14" fill="#555">فرصت جدی؛ تحلیل عمیق لازم است</text><rect x="40" y="70" width="350" height="115" rx="12" fill="#fbeedd" stroke="#c98a3d" stroke-width="2"/><text x="215" y="118" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold">رشد کند + خندق در حال ساخت</text><text x="215" y="150" text-anchor="middle" font-size="14" fill="#555">احتمالاً پول تمام می‌شود پیش از ثمر</text><rect x="410" y="205" width="350" height="115" rx="12" fill="#fbeedd" stroke="#c98a3d" stroke-width="2"/><text x="585" y="253" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold">رشد سریع + بدون خندق</text><text x="585" y="285" text-anchor="middle" font-size="14" fill="#555">رشد خریده‌شده؛ رقبا شرکت را می‌بلعند</text><rect x="40" y="205" width="350" height="115" rx="12" fill="#f6dcd5" stroke="#c0583d" stroke-width="2"/><text x="215" y="253" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold">رشد کند + بدون خندق</text><text x="215" y="285" text-anchor="middle" font-size="14" fill="#555">بیشتر شکست‌ها اینجاست</text><text x="400" y="345" text-anchor="middle" font-size="13" fill="#6b6b6b">محور افقی: سرعت رشد (راست = سریع)  |  محور عمودی: خندق (بالا = در حال ساخت)</text>
</svg>
