<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 224" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="دو معیار برای تصمیم درباره‌ی تخصیص هزینه‌های عمومی">
<rect width="800" height="224" fill="#faf7f0"/>
<text x="400" y="38" text-anchor="middle" font-size="21" fill="#2b2b2b" font-weight="bold">هزینه‌های عمومی را تخصیص دهیم؟</text>
<rect x="533.3" y="62" width="242.7" height="138" rx="12" fill="#e3eaf7" stroke="#4a6fb5" stroke-width="2"/>
<text x="654.7" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">پرسش‌هایی که</text>
<text x="654.7" y="124" text-anchor="middle" font-size="13" fill="#3d3d3d">می‌خواهید جواب</text>
<text x="654.7" y="150" text-anchor="middle" font-size="13" fill="#3d3d3d">بدهید</text>
<rect x="278.7" y="62" width="242.7" height="138" rx="12" fill="#e3f0e6" stroke="#5a9a6b" stroke-width="2"/>
<text x="400.0" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">امکان‌پذیری</text>
<text x="400.0" y="124" text-anchor="middle" font-size="13" fill="#3d3d3d">زمان تیم مالی</text>
<text x="400.0" y="150" text-anchor="middle" font-size="13" fill="#3d3d3d">در برابر ارزش</text>
<text x="400.0" y="176" text-anchor="middle" font-size="13" fill="#3d3d3d">تخصیص</text>
<rect x="24.0" y="62" width="242.7" height="138" rx="12" fill="#fbeee0" stroke="#c98a3a" stroke-width="2"/>
<text x="145.3" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">نتیجه</text>
<text x="145.3" y="124" text-anchor="middle" font-size="13" fill="#3d3d3d">اگر پاسخ را</text>
<text x="145.3" y="150" text-anchor="middle" font-size="13" fill="#3d3d3d">پنهان می‌کند،</text>
<text x="145.3" y="176" text-anchor="middle" font-size="13" fill="#3d3d3d">تخصیص ندهید</text>
</svg>
