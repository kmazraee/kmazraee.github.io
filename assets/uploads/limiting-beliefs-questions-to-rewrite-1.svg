<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 342" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="چهار پرسش بررسی باور: آیا درست است؟ آیا قطعاً می‌دانم؟ وقتی باورش دارم چه حالی می‌شوم؟ بدون آن فکر چه کسی می‌بودم؟">
<rect width="800" height="342" fill="#ffffff"/>
<text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">چهار پرسش برای بررسی یک باور</text>
<rect x="80" y="70" width="640" height="48" rx="10" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400.0" y="101" text-anchor="middle" font-size="18" fill="#1f2937">۱. آیا این درست است؟</text>
<rect x="80" y="132" width="640" height="48" rx="10" fill="#e6f6ec" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400.0" y="163" text-anchor="middle" font-size="18" fill="#1f2937">۲. آیا مطلقاً مطمئنم که درست است؟</text>
<rect x="80" y="194" width="640" height="48" rx="10" fill="#fff4e0" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400.0" y="225" text-anchor="middle" font-size="18" fill="#1f2937">۳. وقتی باورش دارم چه واکنشی نشان می‌دهم؟</text>
<rect x="80" y="256" width="640" height="48" rx="10" fill="#f3e8fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400.0" y="287" text-anchor="middle" font-size="18" fill="#1f2937">۴. بدون این فکر چه کسی می‌بودم؟</text>
</svg>
