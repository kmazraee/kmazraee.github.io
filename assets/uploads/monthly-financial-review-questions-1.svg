<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" direction="rtl" font-family="Tahoma, sans-serif"><rect width="640" height="430" fill="#ffffff"/><text x="620" y="36" text-anchor="start" font-size="20" font-weight="bold" fill="#1f2937">پنج پرسش مرور ماهانه مالی</text><rect x="20" y="60" width="600" height="56" rx="8" fill="#f3f4f6" stroke="#2563eb" stroke-width="1.5"/><circle cx="590" cy="88" r="16" fill="#2563eb"/><text x="590" y="94" text-anchor="middle" font-size="16" fill="#fff">1</text><text x="560" y="84" text-anchor="start" font-size="16" font-weight="bold" fill="#111827">در مقایسه با چه؟</text><text x="560" y="106" text-anchor="start" font-size="13" fill="#4b5563">ماه قبل، سال قبل، بودجه یا ظرفیت</text><rect x="20" y="130" width="600" height="56" rx="8" fill="#f3f4f6" stroke="#2563eb" stroke-width="1.5"/><circle cx="590" cy="158" r="16" fill="#2563eb"/><text x="590" y="164" text-anchor="middle" font-size="16" fill="#fff">2</text><text x="560" y="154" text-anchor="start" font-size="16" font-weight="bold" fill="#111827">چه چیزی جابه‌جا شده؟</text><text x="560" y="176" text-anchor="start" font-size="13" fill="#4b5563">سه تا پنج ردیف با بیشترین تغییر</text><rect x="20" y="200" width="600" height="56" rx="8" fill="#f3f4f6" stroke="#2563eb" stroke-width="1.5"/><circle cx="590" cy="228" r="16" fill="#2563eb"/><text x="590" y="234" text-anchor="middle" font-size="16" fill="#fff">3</text><text x="560" y="224" text-anchor="start" font-size="16" font-weight="bold" fill="#111827">چرا؟</text><text x="560" y="246" text-anchor="start" font-size="13" fill="#4b5563">تا رسیدن به علت عملیاتی ادامه دهید</text><rect x="20" y="270" width="600" height="56" rx="8" fill="#f3f4f6" stroke="#2563eb" stroke-width="1.5"/><circle cx="590" cy="298" r="16" fill="#2563eb"/><text x="590" y="304" text-anchor="middle" font-size="16" fill="#fff">4</text><text x="560" y="294" text-anchor="start" font-size="16" font-weight="bold" fill="#111827">اگر چه شود؟</text><text x="560" y="316" text-anchor="start" font-size="13" fill="#4b5563">سناریوهای دردناک اما محتمل</text><rect x="20" y="340" width="600" height="56" rx="8" fill="#f3f4f6" stroke="#2563eb" stroke-width="1.5"/><circle cx="590" cy="368" r="16" fill="#2563eb"/><text x="590" y="374" text-anchor="middle" font-size="16" fill="#fff">5</text><text x="560" y="364" text-anchor="start" font-size="16" font-weight="bold" fill="#111827">حالا چه کنیم؟</text><text x="560" y="386" text-anchor="start" font-size="13" fill="#4b5563">فقط یک تصمیم ثبت‌شده با مسئول و مهلت</text></svg>