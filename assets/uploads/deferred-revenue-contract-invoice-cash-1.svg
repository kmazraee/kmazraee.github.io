<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" font-family="sans-serif">
<rect width="800" height="380" fill="#ffffff"/>
<text x="400" y="38" direction="rtl" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">چهار رویداد، یک درآمد معوق</text>
<line x1="70" y1="130" x2="730" y2="130" stroke="#9ca3af" stroke-width="4"/>
<g font-size="15" fill="#1f2937">
<circle cx="700" cy="130" r="14" fill="#9ca3af"/>
<text x="700" y="95" direction="rtl" text-anchor="middle" font-weight="bold">۱. امضای قرارداد</text>
<text x="700" y="175" direction="rtl" text-anchor="middle">۱ شهریور</text>
<text x="700" y="210" direction="rtl" text-anchor="middle">بدون ثبت</text>
<text x="700" y="235" direction="rtl" text-anchor="middle">درآمد معوق: ۰</text>
<circle cx="490" cy="130" r="14" fill="#f59e0b"/>
<text x="490" y="95" direction="rtl" text-anchor="middle" font-weight="bold">۲. سررسید پرداخت</text>
<text x="490" y="175" direction="rtl" text-anchor="middle">۱۵ شهریور</text>
<text x="490" y="210" direction="rtl" text-anchor="middle">دریافتنی: ۱۲۰</text>
<text x="490" y="235" direction="rtl" text-anchor="middle">درآمد معوق: ۱۲۰</text>
<circle cx="290" cy="130" r="14" fill="#10b981"/>
<text x="290" y="95" direction="rtl" text-anchor="middle" font-weight="bold">۳. وصول نقد</text>
<text x="290" y="175" direction="rtl" text-anchor="middle">۳۰ شهریور</text>
<text x="290" y="210" direction="rtl" text-anchor="middle">نقد: ۱۲۰، دریافتنی: ۰</text>
<text x="290" y="235" direction="rtl" text-anchor="middle">درآمد معوق: ۱۲۰</text>
<circle cx="100" cy="130" r="14" fill="#3b82f6"/>
<text x="100" y="95" direction="rtl" text-anchor="middle" font-weight="bold">۴. تحویل خدمت</text>
<text x="100" y="175" direction="rtl" text-anchor="middle">مهر تا آذر</text>
<text x="100" y="210" direction="rtl" text-anchor="middle">درآمد: تا ۱۲۰</text>
<text x="100" y="235" direction="rtl" text-anchor="middle">درآمد معوق: تا ۰</text>
</g>
<rect x="60" y="275" width="680" height="72" rx="10" fill="#f3f4f6"/>
<text x="400" y="303" direction="rtl" text-anchor="middle" font-size="15" fill="#374151">درآمد معوق با سررسید بی‌قیدوشرط یا وصول ساخته می‌شود و با تحویل از بین می‌رود.</text>
<text x="400" y="330" direction="rtl" text-anchor="middle" font-size="14" fill="#6b7280">ارقام به میلیون تومان</text>
</svg>
