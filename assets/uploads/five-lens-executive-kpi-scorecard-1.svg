<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" font-family="sans-serif"><rect width="800" height="430" fill="#fff"/><text x="400" y="36" font-size="22" font-weight="bold" text-anchor="middle" direction="rtl" fill="#222">پنج عدسی کارت امتیازی مدیریتی</text><rect x="40" y="60" width="720" height="58" rx="8" fill="#2e7d32"/><text x="740" y="85" font-size="18" font-weight="bold" text-anchor="start" direction="rtl" fill="#fff">کیفیت رشد</text><text x="740" y="107" font-size="14" text-anchor="start" direction="rtl" fill="#fff">ماندگاری در برابر جذب دوباره، ترکیب قیمت و حجم</text><rect x="40" y="130" width="720" height="58" rx="8" fill="#1565c0"/><text x="740" y="155" font-size="18" font-weight="bold" text-anchor="start" direction="rtl" fill="#fff">سودآوری</text><text x="740" y="177" font-size="14" text-anchor="start" direction="rtl" fill="#fff">حاشیه در همه‌ی سطوح و به تفکیک محصول</text><rect x="40" y="200" width="720" height="58" rx="8" fill="#00838f"/><text x="740" y="225" font-size="18" font-weight="bold" text-anchor="start" direction="rtl" fill="#fff">تاب‌آوری نقد</text><text x="740" y="247" font-size="14" text-anchor="start" direction="rtl" fill="#fff">تبدیل سود به نقد، چرخه نقد، سن مطالبات</text><rect x="40" y="270" width="720" height="58" rx="8" fill="#6a1b9a"/><text x="740" y="295" font-size="18" font-weight="bold" text-anchor="start" direction="rtl" fill="#fff">دسترسی به سرمایه</text><text x="740" y="317" font-size="14" text-anchor="start" direction="rtl" fill="#fff">جریان نقد آزاد، فاصله تا پیمان وام، ظرفیت اهرم</text><rect x="40" y="340" width="720" height="58" rx="8" fill="#c62828"/><text x="740" y="365" font-size="18" font-weight="bold" text-anchor="start" direction="rtl" fill="#fff">نمایه‌ی ریسک</text><text x="740" y="387" font-size="14" text-anchor="start" direction="rtl" fill="#fff">تمرکز مشتری و تأمین‌کننده، کنترل داخلی، حقوقی</text></svg>