<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="مقایسه‌ی چرخه‌ی بازخورد: در بازار سال‌ها طول می‌کشد، در حوزه‌های دیگر هفته‌ها و ماه‌ها">
<rect width="800" height="300" fill="#faf7f0"/>
<text x="400" y="36" text-anchor="middle" font-size="22" fill="#2b2b2b" font-weight="bold">چرخه‌ی بازخورد: کجا سریع‌تر یاد می‌گیریم؟</text>
<text x="715" y="95" text-anchor="middle" font-size="16" fill="#2b2b2b">بازار سهام</text>
<rect x="60" y="72" width="560" height="32" rx="6" fill="#b5524a"/><text x="340" y="94" text-anchor="middle" font-size="14" fill="#fff">سال‌ها تا دهه‌ها</text>
<text x="715" y="155" text-anchor="middle" font-size="16" fill="#2b2b2b">زیست‌شناسی و تکامل</text>
<rect x="400" y="132" width="220" height="32" rx="6" fill="#c98a3d"/><text x="510" y="154" text-anchor="middle" font-size="14" fill="#fff">ماه‌ها تا سال‌ها</text>
<text x="715" y="215" text-anchor="middle" font-size="16" fill="#2b2b2b">ورزش و مهارت</text>
<rect x="520" y="192" width="100" height="32" rx="6" fill="#5a9a6b"/><text x="570" y="214" text-anchor="middle" font-size="14" fill="#fff">هفته‌ها</text>
<text x="400" y="272" text-anchor="middle" font-size="13" fill="#666">هرچه بازخورد سریع‌تر، تشخیص الگو آسان‌تر (مقایسه‌ی تقریبی)</text>
</svg>
