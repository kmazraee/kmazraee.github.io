<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 338" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="سه عنصر سیستم خلاقیت">
<rect width="800" height="338" fill="#ffffff"/>
<text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">سه عنصر سیستم خلاقیت</text>
<rect x="80" y="70" width="640" height="50" rx="10" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="102" text-anchor="middle" font-size="18" fill="#1f2937">ذهنیت: قانون ۷۰-۲۰-۱۰ و حجم تولید</text>
<rect x="80" y="132" width="640" height="50" rx="10" fill="#e6f6ec" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="164" text-anchor="middle" font-size="18" fill="#1f2937">محیط: گوشه‌ی کار عمیق بدون حواس‌پرتی</text>
<rect x="80" y="194" width="640" height="50" rx="10" fill="#fff4e0" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="226" text-anchor="middle" font-size="18" fill="#1f2937">روتین: حاضر شدن هر روز، حتی بی‌الهام</text>
<rect x="80" y="256" width="640" height="50" rx="10" fill="#f3e8fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="288" text-anchor="middle" font-size="18" fill="#1f2937">نگهداری: قرار با خلاقیت و زیبایی</text>
</svg>
