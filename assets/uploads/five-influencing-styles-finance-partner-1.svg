<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-label="پنج سبک نفوذ" direction="rtl" font-family="Vazirmatn, Tahoma, 'Noto Naskh Arabic', sans-serif">
<rect width="820" height="300" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="410.0" y="40" font-size="22" fill="#1e293b" font-weight="700" text-anchor="middle" direction="rtl">پنج سبک نفوذ</text>
<rect x="652" y="80" width="148" height="170" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="726.0" y="125" font-size="20" fill="#1e293b" font-weight="700" text-anchor="middle" direction="rtl">منطقی</text>
<text x="726.0" y="170" font-size="14" fill="#334155" font-weight="400" text-anchor="middle" direction="rtl">دلیل، داده</text>
<text x="726.0" y="196" font-size="14" fill="#334155" font-weight="400" text-anchor="middle" direction="rtl">و استدلال</text>
<rect x="490" y="80" width="148" height="170" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
<text x="564.0" y="125" font-size="20" fill="#1e293b" font-weight="700" text-anchor="middle" direction="rtl">قاطع</text>
<text x="564.0" y="170" font-size="14" fill="#334155" font-weight="400" text-anchor="middle" direction="rtl">اعتمادبه‌نفس، قاعده</text>
<text x="564.0" y="196" font-size="14" fill="#334155" font-weight="400" text-anchor="middle" direction="rtl">و جایگاه</text>
<rect x="328" y="80" width="148" height="170" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="402.0" y="125" font-size="20" fill="#1e293b" font-weight="700" text-anchor="middle" direction="rtl">چانه‌زن</text>
<text x="402.0" y="170" font-size="14" fill="#334155" font-weight="400" text-anchor="middle" direction="rtl">مصالحه و</text>
<text x="402.0" y="196" font-size="14" fill="#334155" font-weight="400" text-anchor="middle" direction="rtl">مبادله</text>
<rect x="166" y="80" width="148" height="170" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
<text x="240.0" y="125" font-size="20" fill="#1e293b" font-weight="700" text-anchor="middle" direction="rtl">الهام‌بخش</text>
<text x="240.0" y="170" font-size="14" fill="#334155" font-weight="400" text-anchor="middle" direction="rtl">مأموریت مشترک</text>
<text x="240.0" y="196" font-size="14" fill="#334155" font-weight="400" text-anchor="middle" direction="rtl">و داستان</text>
<rect x="4" y="80" width="148" height="170" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="78.0" y="125" font-size="20" fill="#1e293b" font-weight="700" text-anchor="middle" direction="rtl">پل‌ساز</text>
<text x="78.0" y="170" font-size="14" fill="#334155" font-weight="400" text-anchor="middle" direction="rtl">ائتلاف و</text>
<text x="78.0" y="196" font-size="14" fill="#334155" font-weight="400" text-anchor="middle" direction="rtl">رابطه‌ی متقابل</text>
<text x="410.0" y="282" font-size="14" fill="#475569" font-weight="400" text-anchor="middle" direction="rtl">موفق‌ترین رهبران هر پنج سبک را به‌کار می‌گیرند</text>
</svg>
