<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360" role="img" aria-label="دوازده گام ساخت کسب‌وکار قابل فروش و اجرای فرایند فروش" direction="rtl" font-family="Vazirmatn, Tahoma, 'Noto Naskh Arabic', sans-serif">
<rect width="820" height="360" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="410" y="36" font-size="22" fill="#1e293b" font-weight="700" text-anchor="middle" direction="rtl">دو بخش آماده‌سازی برای فروش</text>
<rect x="430" y="62" width="360" height="40" rx="8" fill="#dbeafe" stroke="#64748b" stroke-width="1.5"/>
<text x="770" y="88" font-size="17" fill="#1e293b" font-weight="700" text-anchor="start" direction="rtl">ساخت کسب‌وکار قابل فروش (گام ۱ تا ۷)</text>
<rect x="30" y="62" width="360" height="40" rx="8" fill="#dcfce7" stroke="#64748b" stroke-width="1.5"/>
<text x="370" y="88" font-size="17" fill="#1e293b" font-weight="700" text-anchor="start" direction="rtl">اجرای فرایند فروش (گام ۸ تا ۱۲)</text>
<g font-size="15" fill="#334155" text-anchor="start" direction="rtl">
<text x="770" y="132">هدف و عدد ارزش را بدانید</text>
<text x="770" y="167">همه‌چیز را مستند کنید</text>
<text x="770" y="202">مشتری و محصول را متنوع کنید</text>
<text x="770" y="237">درآمد تکرارشونده بسازید</text>
<text x="770" y="272">فروش تکرارپذیر داشته باشید</text>
<text x="770" y="307">جریان نقد را مثبت کنید</text>
<text x="770" y="342">وابستگی به فرد کلیدی را کم کنید</text>
<text x="370" y="132">خریدار را بشناسید</text>
<text x="370" y="167">کارگزار یا مشاور انتخاب کنید</text>
<text x="370" y="202">داستان فروش را بسازید</text>
<text x="370" y="237">تیم را آماده کنید</text>
<text x="370" y="272">بررسی دقیق: ۶۰ روز یا بیشتر</text>
</g>
</svg>
