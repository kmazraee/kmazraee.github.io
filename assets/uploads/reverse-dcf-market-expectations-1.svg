<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="DCF معکوس: از قیمت فعلی سهم شروع می‌کنیم و نرخ رشد ضمنی را پیدا می‌کنیم">
<rect width="800" height="320" fill="#faf7f0"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/></marker></defs><text x="400" y="36" text-anchor="middle" font-size="22" fill="#2b2b2b" font-weight="bold">DCF معکوس: از قیمت به رشد</text><rect x="610" y="110" width="160" height="100" rx="12" fill="#fff" stroke="#4a6fb5" stroke-width="2"/><text x="690" y="150" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold">قیمت فعلی بازار</text><text x="690" y="178" text-anchor="middle" font-size="11" fill="#2b2b2b">نقطه‌ی شروع</text><line x1="606" y1="160" x2="592" y2="160" stroke="#2b2b2b" stroke-width="2.5" marker-end="url(#a)"/><rect x="430" y="110" width="160" height="100" rx="12" fill="#fff" stroke="#4a6fb5" stroke-width="2"/><text x="510" y="150" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold">مدل DCF</text><text x="510" y="178" text-anchor="middle" font-size="11" fill="#2b2b2b">با نرخ تنزیل ثابت</text><line x1="426" y1="160" x2="412" y2="160" stroke="#2b2b2b" stroke-width="2.5" marker-end="url(#a)"/><rect x="250" y="110" width="160" height="100" rx="12" fill="#fff" stroke="#4a6fb5" stroke-width="2"/><text x="330" y="150" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold">رشد ضمنی</text><text x="330" y="178" text-anchor="middle" font-size="11" fill="#2b2b2b">رشدی که قیمت را توجیه می‌کند</text><line x1="246" y1="160" x2="232" y2="160" stroke="#2b2b2b" stroke-width="2.5" marker-end="url(#a)"/><rect x="70" y="110" width="160" height="100" rx="12" fill="#fff" stroke="#5a9a6b" stroke-width="2"/><text x="150" y="150" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold">مقایسه</text><text x="150" y="178" text-anchor="middle" font-size="11" fill="#2b2b2b">با رشد تاریخی شرکت</text><rect x="150" y="240" width="500" height="50" rx="12" fill="#fff" stroke="#c98a3d" stroke-width="2"/><text x="400" y="272" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">رشد ضمنی بیشتر از واقعیت؟ پس قیمت خوش‌بینانه است</text>
</svg>
