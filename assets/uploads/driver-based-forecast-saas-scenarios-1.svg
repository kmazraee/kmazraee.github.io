<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" direction="rtl" font-family="sans-serif">
<rect width="800" height="450" fill="#f8fafc"/>
<text x="760" y="45" font-size="24" font-weight="bold" fill="#0f172a" text-anchor="start">از محرک تا درآمد: مثال شرکت SaaS</text>
<g font-size="17" fill="#0f172a" text-anchor="middle">
<rect x="570" y="80" width="190" height="60" rx="8" fill="#dbeafe"/><text x="665" y="116">بازدیدکننده‌ی ماهانه</text>
<rect x="340" y="80" width="190" height="60" rx="8" fill="#dbeafe"/><text x="435" y="116">شروع دوره‌ی آزمایشی</text>
<rect x="110" y="80" width="190" height="60" rx="8" fill="#dbeafe"/><text x="205" y="116">تبدیل به پولی</text>
<rect x="340" y="180" width="190" height="60" rx="8" fill="#fef3c7"/><text x="435" y="216">قیمت اشتراک</text>
<rect x="110" y="180" width="190" height="60" rx="8" fill="#fef3c7"/><text x="205" y="216">مشتری جدید</text>
<rect x="110" y="270" width="190" height="60" rx="8" fill="#dcfce7"/><text x="205" y="306">درآمد ماهانه</text>
</g>
<g stroke="#64748b" stroke-width="2"><path d="M570 110 L530 110"/><path d="M340 110 L300 110"/><path d="M205 140 L205 180"/><path d="M340 210 L300 210"/><path d="M205 240 L205 270"/></g>
<g font-size="16" fill="#1e293b" text-anchor="start">
<text x="760" y="215">سناریو محافظه‌کارانه: ۸٬۱۰۰</text>
<text x="760" y="250">سناریو متعادل: ۱۲٬۰۰۰</text>
<text x="760" y="285">سناریو جسورانه: ۱۶٬۵۰۰</text>
<text x="760" y="400" fill="#475569">با تغییر محرک‌ها، سناریوها شفاف و کمّی می‌شوند</text>
</g>
</svg>
