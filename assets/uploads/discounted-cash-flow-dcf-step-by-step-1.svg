<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="شش گام مدل جریان نقد تنزیل‌شده: جریان نقد آزاد، رشد، ضریب خروج، نرخ تنزیل، سناریوها و مقایسه با قیمت">
