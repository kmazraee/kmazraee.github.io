<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-label="چرخه تبدیل وجه نقد و موجودی مازاد" direction="rtl" font-family="Vazirmatn, Tahoma, 'Noto Naskh Arabic', sans-serif">
<rect width="820" height="330" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="410" y="38" font-size="22" fill="#1e293b" font-weight="700" text-anchor="middle" direction="rtl">چرخه تبدیل وجه نقد و موجودی مازاد</text>
<rect x="640" y="60" width="160" height="70" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="720" y="92" font-size="22" fill="#1e293b" font-weight="700" text-anchor="middle" direction="rtl">DSO</text>
<text x="720" y="116" font-size="13" fill="#475569" font-weight="400" text-anchor="middle" direction="rtl">روز وصول مطالبات</text>
<text x="620" y="102" font-size="26" fill="#1e293b" font-weight="700" text-anchor="middle" direction="rtl">+</text>
<rect x="440" y="60" width="160" height="70" rx="10" fill="#fef3c7" stroke="#64748b"/>
<text x="520" y="92" font-size="22" fill="#1e293b" font-weight="700" text-anchor="middle" direction="rtl">DIO</text>
<text x="520" y="116" font-size="13" fill="#475569" font-weight="400" text-anchor="middle" direction="rtl">روز نگهداری موجودی</text>
<text x="420" y="102" font-size="26" fill="#1e293b" font-weight="700" text-anchor="middle" direction="rtl">−</text>
<rect x="240" y="60" width="160" height="70" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="320" y="92" font-size="22" fill="#1e293b" font-weight="700" text-anchor="middle" direction="rtl">DPO</text>
<text x="320" y="116" font-size="13" fill="#475569" font-weight="400" text-anchor="middle" direction="rtl">روز پرداخت بدهی</text>
<text x="220" y="102" font-size="26" fill="#1e293b" font-weight="700" text-anchor="middle" direction="rtl">=</text>
<rect x="40" y="60" width="160" height="70" rx="10" fill="#ede9fe" stroke="#64748b"/>
<text x="120" y="92" font-size="22" fill="#1e293b" font-weight="700" text-anchor="middle" direction="rtl">CCC</text>
<text x="120" y="116" font-size="13" fill="#475569" font-weight="400" text-anchor="middle" direction="rtl">چرخه تبدیل نقد</text>
<text x="760" y="175" font-size="15" fill="#1e293b" font-weight="700" text-anchor="start" direction="rtl">موجودی انبار: وضع فعلی در برابر هدف (روز)</text>
<rect x="160" y="195" width="600" height="28" rx="6" fill="#fca5a5" stroke="#dc2626"/>
<text x="752" y="215" font-size="14" fill="#1e293b" font-weight="700" text-anchor="start" direction="rtl">فعلی: ۲۰۰ روز</text>
<rect x="610" y="240" width="150" height="28" rx="6" fill="#86efac" stroke="#16a34a"/>
<text x="752" y="260" font-size="14" fill="#1e293b" font-weight="700" text-anchor="start" direction="rtl">هدف: ۵۰ روز</text>
<text x="410" y="305" font-size="14" fill="#475569" font-weight="400" text-anchor="middle" direction="rtl">۱۵۰ روز مازاد موجودی؛ حدود ۱۳ میلیون دلار نقد آزادشدنی</text>
</svg>
