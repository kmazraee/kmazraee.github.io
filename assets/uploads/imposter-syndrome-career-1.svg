<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="پنج گام غلبه بر سندروم ایمپاستر: شناخت واقعیت‌ها، گفت‌وگو با دیگران، ثبت موفقیت‌ها، رها کردن کمال‌گرایی و ذهنیت رشد">
<rect width="800" height="400" fill="#ffffff"/>
<text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">پنج گام غلبه بر حس شیادی</text>
<rect x="80" y="70" width="640" height="48" rx="10" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="100" text-anchor="middle" font-size="18" fill="#1f2937">۱. واقعیت‌ها را بشناسید</text>
<rect x="80" y="132" width="640" height="48" rx="10" fill="#e6f6ec" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="162" text-anchor="middle" font-size="18" fill="#1f2937">۲. صحبت کنید</text>
<rect x="80" y="194" width="640" height="48" rx="10" fill="#fff4e0" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="224" text-anchor="middle" font-size="18" fill="#1f2937">۳. موفقیت‌ها را بنویسید</text>
<rect x="80" y="256" width="640" height="48" rx="10" fill="#f3e8fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="286" text-anchor="middle" font-size="18" fill="#1f2937">۴. کمال‌گرایی را رها کنید</text>
<rect x="80" y="318" width="640" height="48" rx="10" fill="#fde8e8" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="348" text-anchor="middle" font-size="18" fill="#1f2937">۵. ذهنیت رشد</text>
</svg>
