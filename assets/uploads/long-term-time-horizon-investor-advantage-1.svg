<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 246" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="مقایسه‌ی افق زمانی مؤسسه‌های مالی با سرمایه‌گذار فردی">
<rect width="880" height="246" fill="#faf7f0"/>
<text x="440.0" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b2b2b">نود روز یا نود سال؟</text>
<rect x="448" y="70" width="408" height="150" rx="12" fill="#fff" stroke="#b5524a" stroke-width="2"/>
<rect x="448" y="70" width="408" height="38" rx="12" fill="#b5524a"/><rect x="448" y="96" width="408" height="12" fill="#b5524a"/>
<text x="652" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">مؤسسه‌ی مالی</text>
<text x="652" y="138" text-anchor="middle" font-size="14" fill="#2b2b2b">افق: حدود نود روز</text>
<text x="652" y="164" text-anchor="middle" font-size="14" fill="#2b2b2b">مشتری می‌تواند هر لحظه پول را بیرون ببرد</text>
<text x="652" y="190" text-anchor="middle" font-size="14" fill="#2b2b2b">گزارش فصلی ضعیف یعنی فشار فروش</text>
<rect x="24" y="70" width="408" height="150" rx="12" fill="#fff" stroke="#5a9a6b" stroke-width="2"/>
<rect x="24" y="70" width="408" height="38" rx="12" fill="#5a9a6b"/><rect x="24" y="96" width="408" height="12" fill="#5a9a6b"/>
<text x="228" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">سرمایه‌گذار فردی</text>
<text x="228" y="138" text-anchor="middle" font-size="14" fill="#2b2b2b">افق: می‌تواند نود سال باشد</text>
<text x="228" y="164" text-anchor="middle" font-size="14" fill="#2b2b2b">فقط یک مشتری دارد: خودتان</text>
<text x="228" y="190" text-anchor="middle" font-size="14" fill="#2b2b2b">می‌تواند افت کوتاه‌مدت را تحمل کند</text>
</svg>