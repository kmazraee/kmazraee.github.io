<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" direction="rtl" font-family="Tahoma, sans-serif"><rect width="640" height="360" fill="#ffffff"/><text x="620" y="34" text-anchor="start" font-size="17" font-weight="bold" fill="#222">از موجودی بانک تا نقد قابل استفاده (میلیون تومان)</text><text x="620" y="80" text-anchor="start" font-size="14" fill="#222">موجودی بانک</text><rect x="70.0" y="60" width="400.0" height="30" fill="#4a6fa5"/><text x="62.0" y="80" text-anchor="end" font-size="14" fill="#222">۵۰۰</text><text x="620" y="126" text-anchor="start" font-size="14" fill="#222">چک‌های در راه</text><rect x="70.0" y="106" width="48.0" height="30" fill="#c0504d"/><text x="62.0" y="126" text-anchor="end" font-size="14" fill="#222">−۶۰</text><text x="620" y="172" text-anchor="start" font-size="14" fill="#222">پرداخت تأییدشده</text><rect x="118.0" y="152" width="36.0" height="30" fill="#c0504d"/><text x="110.0" y="172" text-anchor="end" font-size="14" fill="#222">−۴۵</text><text x="620" y="218" text-anchor="start" font-size="14" fill="#222">حقوق هفته‌ی آینده</text><rect x="154.0" y="198" width="96.0" height="30" fill="#c0504d"/><text x="146.0" y="218" text-anchor="end" font-size="14" fill="#222">−۱۲۰</text><text x="620" y="264" text-anchor="start" font-size="14" fill="#222">مالیات و بیمه</text><rect x="250.0" y="244" width="28.0" height="30" fill="#c0504d"/><text x="242.0" y="264" text-anchor="end" font-size="14" fill="#222">−۳۵</text><text x="620" y="310" text-anchor="start" font-size="14" fill="#222">نقد قابل استفاده</text><rect x="278.0" y="290" width="192.0" height="30" fill="#2e8b57"/><text x="270.0" y="310" text-anchor="end" font-size="14" fill="#222">۲۴۰</text><line x1="470" y1="52" x2="470" y2="330" stroke="#999"/></svg>