<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="چهار شرط بازخرید سهام خوب و دو مثال متضاد">
<rect width="880" height="372" fill="#faf7f0"/>
<text x="440.0" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b2b2b">بازخرید سهام: چهار شرط و دو مثال</text>
<rect x="589" y="70" width="267" height="130" rx="12" fill="#fff" stroke="#5a9a6b" stroke-width="2"/>
<rect x="589" y="70" width="267" height="38" rx="12" fill="#5a9a6b"/><rect x="589" y="96" width="267" height="12" fill="#5a9a6b"/>
<text x="723" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">۱. غیرچرخه‌ای</text>
<text x="723" y="138" text-anchor="middle" font-size="14" fill="#2b2b2b">درآمد قابل پیش‌بینی</text>
<text x="723" y="164" text-anchor="middle" font-size="14" fill="#2b2b2b">و قیمت کم‌نوسان</text>
<rect x="307" y="70" width="267" height="130" rx="12" fill="#fff" stroke="#5a9a6b" stroke-width="2"/>
<rect x="307" y="70" width="267" height="38" rx="12" fill="#5a9a6b"/><rect x="307" y="96" width="267" height="12" fill="#5a9a6b"/>
<text x="440" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">۲. تملک گزینه نیست</text>
<text x="440" y="138" text-anchor="middle" font-size="14" fill="#2b2b2b">مثلاً ضدانحصار</text>
<text x="440" y="164" text-anchor="middle" font-size="14" fill="#2b2b2b">یا رقبای گران</text>
<rect x="24" y="70" width="267" height="130" rx="12" fill="#fff" stroke="#5a9a6b" stroke-width="2"/>
<rect x="24" y="70" width="267" height="38" rx="12" fill="#5a9a6b"/><rect x="24" y="96" width="267" height="12" fill="#5a9a6b"/>
<text x="157" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">۳. سهم ارزان است</text>
<text x="157" y="138" text-anchor="middle" font-size="14" fill="#2b2b2b">بازخرید گران</text>
<text x="157" y="164" text-anchor="middle" font-size="14" fill="#2b2b2b">ارزش را می‌سوزاند</text>
<rect x="589" y="216" width="267" height="130" rx="12" fill="#fff" stroke="#5a9a6b" stroke-width="2"/>
<rect x="589" y="216" width="267" height="38" rx="12" fill="#5a9a6b"/><rect x="589" y="242" width="267" height="12" fill="#5a9a6b"/>
<text x="723" y="241" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">۴. بقا تهدید نیست</text>
<text x="723" y="284" text-anchor="middle" font-size="14" fill="#2b2b2b">صنعت در حال دگرگونی</text>
<text x="723" y="310" text-anchor="middle" font-size="14" fill="#2b2b2b">به سرمایه‌گذاری نیاز دارد</text>
<rect x="307" y="216" width="267" height="130" rx="12" fill="#fff" stroke="#3d7a8c" stroke-width="2"/>
<rect x="307" y="216" width="267" height="38" rx="12" fill="#3d7a8c"/><rect x="307" y="242" width="267" height="12" fill="#3d7a8c"/>
<text x="440" y="241" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">مثال موفق</text>
<text x="440" y="284" text-anchor="middle" font-size="14" fill="#2b2b2b">قطعات خودرو: سود هر سهم</text>
<text x="440" y="310" text-anchor="middle" font-size="14" fill="#2b2b2b">سالی ۱۷٫۵ درصد رشد</text>
<rect x="24" y="216" width="267" height="130" rx="12" fill="#fff" stroke="#b5524a" stroke-width="2"/>
<rect x="24" y="216" width="267" height="38" rx="12" fill="#b5524a"/><rect x="24" y="242" width="267" height="12" fill="#b5524a"/>
<text x="157" y="241" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">مثال ناموفق</text>
<text x="157" y="284" text-anchor="middle" font-size="14" fill="#2b2b2b">لوازم خانگی: بازخرید با بدهی</text>
<text x="157" y="310" text-anchor="middle" font-size="14" fill="#2b2b2b">و ورشکستگی</text>
</svg>