<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 224" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="پنج مهارت حسابدار برای ورود به برنامه‌ریزی و تحلیل مالی">
<rect width="800" height="224" fill="#faf7f0"/>
<text x="400" y="38" text-anchor="middle" font-size="21" fill="#2b2b2b" font-weight="bold">پنج مهارت حسابدار برای ورود به FP&amp;A</text>
<rect x="635.2" y="62" width="140.8" height="138" rx="12" fill="#e3eaf7" stroke="#4a6fb5" stroke-width="2"/>
<text x="705.6" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">۱. نگاه به آینده</text>
<text x="705.6" y="124" text-anchor="middle" font-size="13" fill="#3d3d3d">از گزارش گذشته</text>
<text x="705.6" y="150" text-anchor="middle" font-size="13" fill="#3d3d3d">به بازه‌ی نتایج</text>
<text x="705.6" y="176" text-anchor="middle" font-size="13" fill="#3d3d3d">ممکن آینده</text>
<rect x="482.4" y="62" width="140.8" height="138" rx="12" fill="#e3f0e6" stroke="#5a9a6b" stroke-width="2"/>
<text x="552.8" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">۲. بهینه‌سازی</text>
<text x="552.8" y="124" text-anchor="middle" font-size="13" fill="#3d3d3d">جمع‌آوری داده از</text>
<text x="552.8" y="150" text-anchor="middle" font-size="13" fill="#3d3d3d">منابع مختلف</text>
<text x="552.8" y="176" text-anchor="middle" font-size="13" fill="#3d3d3d">و روان‌کردن جریان آن</text>
<rect x="329.6" y="62" width="140.8" height="138" rx="12" fill="#fbeee0" stroke="#c98a3a" stroke-width="2"/>
<text x="400.0" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">۳. اثرگذاری</text>
<text x="400.0" y="124" text-anchor="middle" font-size="13" fill="#3d3d3d">به چالش کشیدن</text>
<text x="400.0" y="150" text-anchor="middle" font-size="13" fill="#3d3d3d">و متقاعدکردن</text>
<text x="400.0" y="176" text-anchor="middle" font-size="13" fill="#3d3d3d">واحدهای دیگر</text>
<rect x="176.8" y="62" width="140.8" height="138" rx="12" fill="#f1e4f2" stroke="#9a5aa8" stroke-width="2"/>
<text x="247.2" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">۴. سیگنال از نویز</text>
<text x="247.2" y="124" text-anchor="middle" font-size="13" fill="#3d3d3d">فقط شاخص‌هایی که</text>
<text x="247.2" y="150" text-anchor="middle" font-size="13" fill="#3d3d3d">برای تصمیم</text>
<text x="247.2" y="176" text-anchor="middle" font-size="13" fill="#3d3d3d">مهم‌اند</text>
<rect x="24.0" y="62" width="140.8" height="138" rx="12" fill="#e6eef0" stroke="#4b8a99" stroke-width="2"/>
<text x="94.4" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">۵. مدل مناسب</text>
<text x="94.4" y="124" text-anchor="middle" font-size="13" fill="#3d3d3d">DCF، سربه‌سر،</text>
<text x="94.4" y="150" text-anchor="middle" font-size="13" fill="#3d3d3d">ارزش طول عمر</text>
<text x="94.4" y="176" text-anchor="middle" font-size="13" fill="#3d3d3d">مشتری</text>
</svg>
