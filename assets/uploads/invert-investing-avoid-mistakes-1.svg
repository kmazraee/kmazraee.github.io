<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="اصل معکوس‌سازی: فهرست رفتارهایی که نمی‌خواهیم داشته باشیم و ویژگی‌های سرمایه‌گذار مقابل آن‌ها">
<rect width="800" height="320" fill="#faf7f0"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/></marker></defs><text x="400" y="38" text-anchor="middle" font-size="21" fill="#2b2b2b" font-weight="bold">معکوس‌سازی: از آنچه نمی‌خواهیم شروع کنید</text><rect x="450" y="60" width="310" height="230" rx="12" fill="#fff" stroke="#b5524a" stroke-width="2"/><text x="605" y="88" text-anchor="middle" font-size="16" fill="#b5524a" font-weight="bold">سرمایه‌گذاری که نمی‌خواهم باشم</text><text x="605" y="125" text-anchor="middle" font-size="14" fill="#2b2b2b">• مدام معامله می‌کند</text><text x="605" y="159" text-anchor="middle" font-size="14" fill="#2b2b2b">• دنبال جمعیت می‌رود</text><text x="605" y="193" text-anchor="middle" font-size="14" fill="#2b2b2b">• با احساسات می‌خرد و می‌فروشد</text><text x="605" y="227" text-anchor="middle" font-size="14" fill="#2b2b2b">• وسواس‌گونه موجودی را چک می‌کند</text><text x="605" y="261" text-anchor="middle" font-size="14" fill="#2b2b2b">• روابط مهم را فدای پول می‌کند</text><line x1="440" y1="175" x2="370" y2="175" stroke="#2b2b2b" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="60" width="320" height="230" rx="12" fill="#fff" stroke="#5a9a6b" stroke-width="2"/><text x="200" y="88" text-anchor="middle" font-size="16" fill="#5a9a6b" font-weight="bold">سرمایه‌گذاری که می‌خواهم باشم</text><text x="200" y="125" text-anchor="middle" font-size="14" fill="#2b2b2b">• مستقل فکر می‌کند</text><text x="200" y="159" text-anchor="middle" font-size="14" fill="#2b2b2b">• بلندمدت می‌نگرد</text><text x="200" y="193" text-anchor="middle" font-size="14" fill="#2b2b2b">• دلیل مکتوب دارد</text><text x="200" y="227" text-anchor="middle" font-size="14" fill="#2b2b2b">• نوسان کوتاه‌مدت را نادیده می‌گیرد</text><text x="200" y="261" text-anchor="middle" font-size="14" fill="#2b2b2b">• پول را خدمتگزار زندگی می‌داند</text>
</svg>
