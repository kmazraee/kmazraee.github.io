<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 286" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="سه گام چرت ظهرگاهی">
<rect width="800" height="286" fill="#ffffff"/>
<text x="400.0" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">چرت ظهرگاهی در سه گام</text>
<rect x="534" y="75" width="236" height="130" rx="12" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="652" y="117" text-anchor="middle" font-size="26" font-weight="700" fill="#2b6cb0">۱</text>
<text x="652" y="153" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">وقت بگذارید</text>
<text x="652" y="181" text-anchor="middle" font-size="13" fill="#374151">۴۰ تا ۶۰ دقیقه</text>
<rect x="282" y="75" width="236" height="130" rx="12" fill="#e6f6ec" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="117" text-anchor="middle" font-size="26" font-weight="700" fill="#2b6cb0">۲</text>
<text x="400" y="153" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">نزدیک ظهر</text>
<text x="400" y="181" text-anchor="middle" font-size="13" fill="#374151">نه بعد از ساعت ۳</text>
<rect x="30" y="75" width="236" height="130" rx="12" fill="#fff4e0" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="148" y="117" text-anchor="middle" font-size="26" font-weight="700" fill="#2b6cb0">۳</text>
<text x="148" y="153" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">تایمر ۳۰ دقیقه</text>
<text x="148" y="181" text-anchor="middle" font-size="13" fill="#374151">از خواب عمیق دور بمانید</text>
<text x="400.0" y="268" text-anchor="middle" font-size="15" fill="#374151">ثبات از مدت مهم‌تر است</text>
</svg>
