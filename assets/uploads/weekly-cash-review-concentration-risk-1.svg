<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" direction="rtl" font-family="Tahoma, sans-serif"><rect width="640" height="360" fill="#ffffff"/><text x="620" y="36" text-anchor="start" font-size="20" font-weight="bold" fill="#1f2937">مرور هفتگی نقدینگی در چهار گام</text><rect x="20" y="60" width="600" height="56" rx="8" fill="#f3f4f6" stroke="#059669" stroke-width="1.5"/><circle cx="590" cy="88" r="16" fill="#059669"/><text x="590" y="94" text-anchor="middle" font-size="16" fill="#fff">1</text><text x="560" y="84" text-anchor="start" font-size="16" font-weight="bold" fill="#111827">نقد</text><text x="560" y="106" text-anchor="start" font-size="13" fill="#4b5563">موجودی و ورودی و خروجی ۴ تا ۱۲ هفته آینده</text><rect x="20" y="130" width="600" height="56" rx="8" fill="#f3f4f6" stroke="#059669" stroke-width="1.5"/><circle cx="590" cy="158" r="16" fill="#059669"/><text x="590" y="164" text-anchor="middle" font-size="16" fill="#fff">2</text><text x="560" y="154" text-anchor="start" font-size="16" font-weight="bold" fill="#111827">نقاط شکست واحد</text><text x="560" y="176" text-anchor="start" font-size="13" fill="#4b5563">مشتری، تأمین‌کننده، فرد کلیدی، بدهی</text><rect x="20" y="200" width="600" height="56" rx="8" fill="#f3f4f6" stroke="#059669" stroke-width="1.5"/><circle cx="590" cy="228" r="16" fill="#059669"/><text x="590" y="234" text-anchor="middle" font-size="16" fill="#fff">3</text><text x="560" y="224" text-anchor="start" font-size="16" font-weight="bold" fill="#111827">انتخاب یک مورد</text><text x="560" y="246" text-anchor="start" font-size="13" fill="#4b5563">کاهش واقعی آن در ۳۰ روز</text><rect x="20" y="270" width="600" height="56" rx="8" fill="#f3f4f6" stroke="#059669" stroke-width="1.5"/><circle cx="590" cy="298" r="16" fill="#059669"/><text x="590" y="304" text-anchor="middle" font-size="16" fill="#fff">4</text><text x="560" y="294" text-anchor="start" font-size="16" font-weight="bold" fill="#111827">ثبت و پیگیری</text><text x="560" y="316" text-anchor="start" font-size="13" fill="#4b5563">همان روز و ساعت هفته بعد</text></svg>