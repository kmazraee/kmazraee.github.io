<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 264" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="وارونه کردن فرمول شاخص‌ها برای پیش‌بینی مانده‌ی حساب‌ها">
<rect width="800" height="264" fill="#faf7f0"/>
<text x="400" y="38" text-anchor="middle" font-size="21" fill="#2b2b2b" font-weight="bold">از شاخص به مانده‌ی ترازنامه</text>
<rect x="536" y="70" width="240" height="118" rx="12" fill="#e3eaf7" stroke="#4a6fb5" stroke-width="2"/>
<text x="656" y="100" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold">حساب‌های دریافتنی</text>
<text x="656" y="128" text-anchor="middle" font-size="13" fill="#3d3d3d">(درآمد ÷ ۹۰) × DSO</text>
<text x="656" y="152" text-anchor="middle" font-size="13" fill="#3d3d3d">مثال: ۶٫۴ میلیون</text>
<rect x="280" y="70" width="240" height="118" rx="12" fill="#e3f0e6" stroke="#5a9a6b" stroke-width="2"/>
<text x="400" y="100" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold">موجودی کالا</text>
<text x="400" y="128" text-anchor="middle" font-size="13" fill="#3d3d3d">(بهای تمام‌شده ÷ ۹۰) × DOH</text>
<text x="400" y="152" text-anchor="middle" font-size="13" fill="#3d3d3d">مثال: ۱۰ میلیون</text>
<rect x="24" y="70" width="240" height="118" rx="12" fill="#fbeee0" stroke="#c98a3a" stroke-width="2"/>
<text x="144" y="100" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold">حساب‌های پرداختنی</text>
<text x="144" y="128" text-anchor="middle" font-size="13" fill="#3d3d3d">(بهای تمام‌شده ÷ ۹۰) × DPO</text>
<text x="144" y="152" text-anchor="middle" font-size="13" fill="#3d3d3d">مثال: ۷٫۵ میلیون</text>
<rect x="100" y="204" width="600" height="44" rx="12" fill="#fff" stroke="#2b2b2b" stroke-width="2"/>
<text x="400" y="232" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">شاخص آخرین دوره را جلو ببرید، فرمول را وارونه کنید، به ترازنامه وصل کنید</text>
</svg>