<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 264" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="سه عادت مدیریت مدل مالی بزرگ">
<rect width="800" height="264" fill="#faf7f0"/>
<text x="400" y="38" text-anchor="middle" font-size="21" fill="#2b2b2b" font-weight="bold">سه عادت برای مدل مالی بزرگ</text>
<rect x="536" y="70" width="240" height="118" rx="12" fill="#e3eaf7" stroke="#4a6fb5" stroke-width="2"/>
<text x="656" y="100" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold">حساسیت آماده</text>
<text x="656" y="128" text-anchor="middle" font-size="13" fill="#3d3d3d">برای ۳ تا ۵ فرض اصلی</text>
<text x="656" y="152" text-anchor="middle" font-size="13" fill="#3d3d3d">قاعده‌ی سرانگشتی بسازید</text>
<rect x="280" y="70" width="240" height="118" rx="12" fill="#e3f0e6" stroke="#5a9a6b" stroke-width="2"/>
<text x="400" y="100" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold">ورودی جدا</text>
<text x="400" y="128" text-anchor="middle" font-size="13" fill="#3d3d3d">ورودی‌ها در یک برگه</text>
<text x="400" y="152" text-anchor="middle" font-size="13" fill="#3d3d3d">محاسبه‌ها در برگه‌ی دیگر</text>
<rect x="24" y="70" width="240" height="118" rx="12" fill="#fbeee0" stroke="#c98a3a" stroke-width="2"/>
<text x="144" y="100" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold">مفروضات ثبت‌شده</text>
<text x="144" y="128" text-anchor="middle" font-size="13" fill="#3d3d3d">مقدار، تاریخ، منبع</text>
<text x="144" y="152" text-anchor="middle" font-size="13" fill="#3d3d3d">و دلیل هر فرض مهم</text>
<rect x="100" y="204" width="600" height="44" rx="12" fill="#fff" stroke="#2b2b2b" stroke-width="2"/>
<text x="400" y="232" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">سریع‌تر پاسخ بدهید، کمتر اشتباه کنید</text>
</svg>