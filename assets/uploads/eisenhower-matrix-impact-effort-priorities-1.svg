<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 252" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="ترکیب ماتریس آیزنهاور و ماتریس اثر–تلاش برای اولویت‌بندی کارها">
<rect width="800" height="252" fill="#faf7f0"/>
<text x="400" y="38" text-anchor="middle" font-size="21" fill="#2b2b2b" font-weight="bold">دو ماتریس برای اولویت‌بندی کارها</text>
<rect x="600" y="62" width="176" height="112" rx="12" fill="#e3eaf7" stroke="#4a6fb5" stroke-width="2"/>
<text x="688" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">مهم و فوری</text>
<text x="688" y="120" text-anchor="middle" font-size="13" fill="#3d3d3d">همین حالا انجام دهید</text>
<text x="688" y="146" text-anchor="middle" font-size="13" fill="#3d3d3d">اولویت اول</text>
<rect x="408" y="62" width="176" height="112" rx="12" fill="#e3f0e6" stroke="#5a9a6b" stroke-width="2"/>
<text x="496" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">مهم و غیرفوری</text>
<text x="496" y="120" text-anchor="middle" font-size="13" fill="#3d3d3d">در تقویم قفل کنید</text>
<text x="496" y="146" text-anchor="middle" font-size="13" fill="#3d3d3d">بیشترین ارزش بلندمدت</text>
<rect x="216" y="62" width="176" height="112" rx="12" fill="#fbeee0" stroke="#c98a3a" stroke-width="2"/>
<text x="304" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">فوری و کم‌اهمیت</text>
<text x="304" y="120" text-anchor="middle" font-size="13" fill="#3d3d3d">مهلت را بپرسید</text>
<text x="304" y="146" text-anchor="middle" font-size="13" fill="#3d3d3d">ساده یا واگذار کنید</text>
<rect x="24" y="62" width="176" height="112" rx="12" fill="#f3e6f3" stroke="#9a5a9a" stroke-width="2"/>
<text x="112" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">نه مهم نه فوری</text>
<text x="112" y="120" text-anchor="middle" font-size="13" fill="#3d3d3d">حذف یا خودکار کنید</text>
<text x="112" y="146" text-anchor="middle" font-size="13" fill="#3d3d3d">آخرین گزینه</text>
<rect x="100" y="190" width="600" height="42" rx="12" fill="#fff" stroke="#2b2b2b" stroke-width="2"/>
<text x="400" y="217" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">اگر همه مهم و فوری است: اول برد سریع، بعد شرط‌بندی بزرگ</text>
</svg>
