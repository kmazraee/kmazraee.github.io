<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="تله‌ی ارزشی: سود هر سهم کاهش می‌یابد، ضریب P/E ظاهراً ارزان بالا می‌رود و قیمت سهم هم می‌ریزد">
<rect width="800" height="320" fill="#faf7f0"/>
<text x="400" y="36" text-anchor="middle" font-size="22" fill="#2b2b2b" font-weight="bold">تله‌ی ارزشی: P/E پایین، سود در حال سقوط</text><rect x="540" y="70" width="230" height="200" rx="12" fill="#fff" stroke="#5a9a6b" stroke-width="2"/><text x="655" y="102" text-anchor="middle" font-size="17" fill="#5a9a6b" font-weight="bold">سال اول</text><text x="655" y="136" text-anchor="middle" font-size="14" fill="#2b2b2b">سود هر سهم ۴</text><text x="655" y="164" text-anchor="middle" font-size="13" fill="#2b2b2b">قیمت ۲۰</text><text x="655" y="196" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold">P/E = ۵</text><text x="655" y="238" text-anchor="middle" font-size="15" fill="#5a9a6b" font-weight="bold">به نظر ارزان</text><rect x="285" y="70" width="230" height="200" rx="12" fill="#fff" stroke="#c98a3d" stroke-width="2"/><text x="400" y="102" text-anchor="middle" font-size="17" fill="#c98a3d" font-weight="bold">سال دوم</text><text x="400" y="136" text-anchor="middle" font-size="14" fill="#2b2b2b">سود هر سهم ۲</text><text x="400" y="164" text-anchor="middle" font-size="13" fill="#2b2b2b">قیمت ۲۰ (اگر ثابت بماند)</text><text x="400" y="196" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold">P/E = ۱۰</text><text x="400" y="238" text-anchor="middle" font-size="15" fill="#c98a3d" font-weight="bold">گران‌تر شد</text><rect x="30" y="70" width="230" height="200" rx="12" fill="#fff" stroke="#b5524a" stroke-width="2"/><text x="145" y="102" text-anchor="middle" font-size="17" fill="#b5524a" font-weight="bold">بعد از آن</text><text x="145" y="136" text-anchor="middle" font-size="14" fill="#2b2b2b">سود باز هم کم می‌شود</text><text x="145" y="164" text-anchor="middle" font-size="13" fill="#2b2b2b">قیمت می‌ریزد</text><text x="145" y="196" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold">P/E دوباره پایین</text><text x="145" y="238" text-anchor="middle" font-size="15" fill="#b5524a" font-weight="bold">زیان واقعی</text>
</svg>
