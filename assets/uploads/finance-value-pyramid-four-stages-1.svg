<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 198" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="چهار مرحله‌ی رشد تیم مالی به‌عنوان شریک کسب‌وکار">
<rect width="800" height="198" fill="#faf7f0"/>
<text x="400" y="38" text-anchor="middle" font-size="21" fill="#2b2b2b" font-weight="bold">هرم چهارمرحله‌ای ارزش‌آفرینی مالی</text>
<rect x="597.0" y="62" width="179.0" height="112" rx="12" fill="#e3eaf7" stroke="#4a6fb5" stroke-width="2"/>
<text x="686.5" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">۴. ارزش‌آفرینی فعال</text>
<text x="686.5" y="124" text-anchor="middle" font-size="13" fill="#3d3d3d">توصیه درباره‌ی</text>
<text x="686.5" y="150" text-anchor="middle" font-size="13" fill="#3d3d3d">ریسک و فرصت</text>
<rect x="406.0" y="62" width="179.0" height="112" rx="12" fill="#e3f0e6" stroke="#5a9a6b" stroke-width="2"/>
<text x="495.5" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">۳. تمرکز بر راهبرد</text>
<text x="495.5" y="124" text-anchor="middle" font-size="13" fill="#3d3d3d">اتصال تحلیل به</text>
<text x="495.5" y="150" text-anchor="middle" font-size="13" fill="#3d3d3d">برنامه‌ی واحدها</text>
<rect x="215.0" y="62" width="179.0" height="112" rx="12" fill="#fbeee0" stroke="#c98a3a" stroke-width="2"/>
<text x="304.5" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">۲. تمرکز بر روایت</text>
<text x="304.5" y="124" text-anchor="middle" font-size="13" fill="#3d3d3d">جدا کردن بینش</text>
<text x="304.5" y="150" text-anchor="middle" font-size="13" fill="#3d3d3d">از داده‌ی خام</text>
<rect x="24.0" y="62" width="179.0" height="112" rx="12" fill="#f1e4f2" stroke="#9a5aa8" stroke-width="2"/>
<text x="113.5" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">۱. تمرکز بر داده</text>
<text x="113.5" y="124" text-anchor="middle" font-size="13" fill="#3d3d3d">دقت و</text>
<text x="113.5" y="150" text-anchor="middle" font-size="13" fill="#3d3d3d">به‌موقع‌بودن</text>
</svg>
