<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="شش تکنیک برای آرام ماندن زیر فشار: آهسته‌تر رفتن، نفس‌گیری، نوشتن، سلامت مغز، نگاه از بالا و بازچارچوب‌بندی">
<rect width="800" height="280" fill="#ffffff"/>
<text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">۶ تکنیک برای آرام ماندن زیر فشار</text>
<rect x="400" y="70" width="340" height="48" rx="10" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="570.0" y="101" text-anchor="middle" font-size="18" fill="#1f2937">۱. آهسته‌تر بروید (حدود ۸۵٪ سرعت)</text>
<rect x="50" y="70" width="340" height="48" rx="10" fill="#e6f6ec" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="220.0" y="101" text-anchor="middle" font-size="18" fill="#1f2937">۲. نفس‌گیری حساب‌شده</text>
<rect x="400" y="132" width="340" height="48" rx="10" fill="#fff4e0" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="570.0" y="163" text-anchor="middle" font-size="18" fill="#1f2937">۳. نوشتن آزاد روی کاغذ</text>
<rect x="50" y="132" width="340" height="48" rx="10" fill="#f3e8fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="220.0" y="163" text-anchor="middle" font-size="18" fill="#1f2937">۴. مراقبت از سلامت مغز</text>
<rect x="400" y="194" width="340" height="48" rx="10" fill="#fdecec" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="570.0" y="225" text-anchor="middle" font-size="18" fill="#1f2937">۵. نگاه از بالا: ۵ سال دیگر مهم است؟</text>
<rect x="50" y="194" width="340" height="48" rx="10" fill="#e6f7f7" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="220.0" y="225" text-anchor="middle" font-size="18" fill="#1f2937">۶. بازچارچوب‌بندی واژه‌های منفی</text>
</svg>
