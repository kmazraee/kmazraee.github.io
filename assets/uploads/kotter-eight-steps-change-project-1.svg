<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 398" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="هشت مرحله‌ی مدیریت تغییر">
<rect width="800" height="398" fill="#faf7f0"/>
<text x="400" y="38" text-anchor="middle" font-size="21" fill="#2b2b2b" font-weight="bold">هشت مرحله‌ی مدیریت تغییر</text>
<rect x="600" y="70" width="176" height="118" rx="12" fill="#e3eaf7" stroke="#4a6fb5" stroke-width="2"/>
<text x="688" y="100" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold">۱. فوریت</text>
<text x="688" y="128" text-anchor="middle" font-size="13" fill="#3d3d3d">چرا همین حالا؟</text>
<rect x="408" y="70" width="176" height="118" rx="12" fill="#e3f0e6" stroke="#5a9a6b" stroke-width="2"/>
<text x="496" y="100" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold">۲. ائتلاف</text>
<text x="496" y="128" text-anchor="middle" font-size="13" fill="#3d3d3d">حامیان را جمع کنید</text>
<rect x="216" y="70" width="176" height="118" rx="12" fill="#fbeee0" stroke="#c98a3a" stroke-width="2"/>
<text x="304" y="100" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold">۳. چشم‌انداز</text>
<text x="304" y="128" text-anchor="middle" font-size="13" fill="#3d3d3d">هدف در یک جمله</text>
<rect x="24" y="70" width="176" height="118" rx="12" fill="#f3e6f3" stroke="#9a5a9a" stroke-width="2"/>
<text x="112" y="100" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold">۴. ابلاغ</text>
<text x="112" y="128" text-anchor="middle" font-size="13" fill="#3d3d3d">تکرار در کانال‌ها</text>
<rect x="600" y="204" width="176" height="118" rx="12" fill="#e3eaf7" stroke="#4a6fb5" stroke-width="2"/>
<text x="688" y="234" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold">۵. توانمندسازی</text>
<text x="688" y="262" text-anchor="middle" font-size="13" fill="#3d3d3d">موانع را بردارید</text>
<rect x="408" y="204" width="176" height="118" rx="12" fill="#e3f0e6" stroke="#5a9a6b" stroke-width="2"/>
<text x="496" y="234" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold">۶. بردهای کوتاه</text>
<text x="496" y="262" text-anchor="middle" font-size="13" fill="#3d3d3d">نتیجه‌ی سریع</text>
<rect x="216" y="204" width="176" height="118" rx="12" fill="#fbeee0" stroke="#c98a3a" stroke-width="2"/>
<text x="304" y="234" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold">۷. تثبیت</text>
<text x="304" y="262" text-anchor="middle" font-size="13" fill="#3d3d3d">دستاورد را نشان دهید</text>
<rect x="24" y="204" width="176" height="118" rx="12" fill="#f3e6f3" stroke="#9a5a9a" stroke-width="2"/>
<text x="112" y="234" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold">۸. نهادینه‌سازی</text>
<text x="112" y="262" text-anchor="middle" font-size="13" fill="#3d3d3d">در ارزیابی بنشانید</text>
<rect x="100" y="338" width="600" height="44" rx="12" fill="#fff" stroke="#2b2b2b" stroke-width="2"/>
<text x="400" y="366" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">تغییر پروژه‌ی انسانی است، نه فقط فنی</text>
</svg>