<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 252" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="چهار گام گفتن نه محترمانه در محیط کار">
<rect width="800" height="252" fill="#faf7f0"/>
<text x="400" y="38" text-anchor="middle" font-size="21" fill="#2b2b2b" font-weight="bold">چهار گام برای «نه» محترمانه</text>
<rect x="600" y="62" width="176" height="112" rx="12" fill="#e3eaf7" stroke="#4a6fb5" stroke-width="2"/>
<text x="688" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">۱. مکث</text>
<text x="688" y="120" text-anchor="middle" font-size="13" fill="#3d3d3d">پیامدها را</text>
<text x="688" y="146" text-anchor="middle" font-size="13" fill="#3d3d3d">مقایسه کنید</text>
<rect x="408" y="62" width="176" height="112" rx="12" fill="#e3f0e6" stroke="#5a9a6b" stroke-width="2"/>
<text x="496" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">۲. سؤال</text>
<text x="496" y="120" text-anchor="middle" font-size="13" fill="#3d3d3d">اهمیت و مهلت</text>
<text x="496" y="146" text-anchor="middle" font-size="13" fill="#3d3d3d">واقعی را بپرسید</text>
<rect x="216" y="62" width="176" height="112" rx="12" fill="#fbeee0" stroke="#c98a3a" stroke-width="2"/>
<text x="304" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">۳. نه ملایم</text>
<text x="304" y="120" text-anchor="middle" font-size="13" fill="#3d3d3d">با زمینه و دلیل</text>
<text x="304" y="146" text-anchor="middle" font-size="13" fill="#3d3d3d">بگویید</text>
<rect x="24" y="62" width="176" height="112" rx="12" fill="#f3e6f3" stroke="#9a5a9a" stroke-width="2"/>
<text x="112" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">۴. جایگزین</text>
<text x="112" y="120" text-anchor="middle" font-size="13" fill="#3d3d3d">معرفی فرد دیگر</text>
<text x="112" y="146" text-anchor="middle" font-size="13" fill="#3d3d3d">یا زمان آینده</text>
<rect x="100" y="190" width="600" height="42" rx="12" fill="#fff" stroke="#2b2b2b" stroke-width="2"/>
<text x="400" y="217" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">رابطه حفظ شود، فرسودگی دور شود</text>
</svg>
