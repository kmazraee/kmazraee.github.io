<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" font-family="sans-serif">
<rect width="800" height="360" fill="#ffffff"/>
<text x="400.0" y="40" font-size="21" font-weight="bold" fill="#1f2937" text-anchor="middle" direction="rtl">پوشه‌ی کاری عامل هوش مصنوعی</text>
<rect x="300" y="70" width="200" height="60" rx="10" fill="#1f2937"/><text x="400.0" y="96.0" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle" direction="rtl">پوشه‌ی اصلی</text><text x="400.0" y="120.0" font-size="13" fill="#ffffff" text-anchor="middle" direction="rtl">workspace</text>
<line x1="400" y1="130" x2="660.0" y2="185" stroke="#9ca3af" stroke-width="2.5"/>
<rect x="560" y="185" width="200" height="80" rx="10" fill="#1e3a8a"/><text x="660.0" y="221.0" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle" direction="rtl">زمینه</text><text x="660.0" y="245.0" font-size="13" fill="#ffffff" text-anchor="middle" direction="rtl">صفحه‌ی کسب‌وکار، راهنمای داده</text>
<line x1="400" y1="130" x2="400.0" y2="185" stroke="#9ca3af" stroke-width="2.5"/>
<rect x="300" y="185" width="200" height="80" rx="10" fill="#0f766e"/><text x="400.0" y="221.0" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle" direction="rtl">پروژه</text><text x="400.0" y="245.0" font-size="13" fill="#ffffff" text-anchor="middle" direction="rtl">CSV و قراردادهای تبدیل‌شده</text>
<line x1="400" y1="130" x2="140.0" y2="185" stroke="#9ca3af" stroke-width="2.5"/>
<rect x="40" y="185" width="200" height="80" rx="10" fill="#b45309"/><text x="140.0" y="221.0" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle" direction="rtl">خروجی</text><text x="140.0" y="245.0" font-size="13" fill="#ffffff" text-anchor="middle" direction="rtl">تنها محل نوشتن عامل</text>
<text x="400.0" y="310" font-size="15" fill="#374151" text-anchor="middle" direction="rtl">قاعده‌ها: اول راهنمای داده، فقط فایل‌های پروژه، فقط نوشتن در خروجی، فایل جدیدتر معتبر است</text>
</svg>