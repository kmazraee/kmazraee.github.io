<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="820" height="290" role="img" aria-label="چهار روش رایج صدور صورتحساب الکترونیکی" direction="rtl" font-family="Vazirmatn, Tahoma, 'Noto Naskh Arabic', sans-serif">
<rect width="820" height="290" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="410.0" y="38" font-size="22" fill="#1e293b" font-weight="700" text-anchor="middle" direction="rtl">چهار روش رایج صدور صورتحساب الکترونیکی</text>
<rect x="40" y="65" width="740" height="42" rx="8" fill="#dbeafe" stroke="#64748b" stroke-width="1.5"/>
<text x="760" y="92" font-size="17" fill="#1e293b" font-weight="700" text-anchor="start" direction="rtl">ایمیل PDF</text>
<text x="560" y="92" font-size="14" fill="#475569" text-anchor="start" direction="rtl">ساده و ارزان، بدون ساختار داده</text>
<rect x="40" y="115" width="740" height="42" rx="8" fill="#dcfce7" stroke="#64748b" stroke-width="1.5"/>
<text x="760" y="142" font-size="17" fill="#1e293b" font-weight="700" text-anchor="start" direction="rtl">تبادل داده (EDI)</text>
<text x="560" y="142" font-size="14" fill="#475569" text-anchor="start" direction="rtl">دقیق، مناسب زنجیره‌ی بزرگ</text>
<rect x="40" y="165" width="740" height="42" rx="8" fill="#fef3c7" stroke="#64748b" stroke-width="1.5"/>
<text x="760" y="192" font-size="17" fill="#1e293b" font-weight="700" text-anchor="start" direction="rtl">قالب ساختاریافته</text>
<text x="560" y="192" font-size="14" fill="#475569" text-anchor="start" direction="rtl">ورود خودکار به حسابداری گیرنده</text>
<rect x="40" y="215" width="740" height="42" rx="8" fill="#fee2e2" stroke="#64748b" stroke-width="1.5"/>
<text x="760" y="242" font-size="17" fill="#1e293b" font-weight="700" text-anchor="start" direction="rtl">سامانه‌ی دولتی</text>
<text x="560" y="242" font-size="14" fill="#475569" text-anchor="start" direction="rtl">ثبت و تأیید در سامانه‌ی مالیاتی</text>
</svg>