<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 278" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="سه باید و سه نبایدِ چالش‌گری محترمانه برای تحلیلگر مالی">
<rect width="800" height="278" fill="#faf7f0"/>
<text x="400" y="38" text-anchor="middle" font-size="21" fill="#2b2b2b" font-weight="bold">چالش‌گری محترمانه</text>
<rect x="408" y="62" width="368" height="138" rx="12" fill="#e3eaf7" stroke="#4a6fb5" stroke-width="2"/>
<text x="592" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">بایدها</text>
<text x="592" y="120" text-anchor="middle" font-size="13" fill="#3d3d3d">وقتی دیدید بگویید</text>
<text x="592" y="146" text-anchor="middle" font-size="13" fill="#3d3d3d">چیزی پس بدهید</text>
<text x="592" y="172" text-anchor="middle" font-size="13" fill="#3d3d3d">به داده وفادار بمانید</text>
<rect x="24" y="62" width="368" height="138" rx="12" fill="#e3f0e6" stroke="#5a9a6b" stroke-width="2"/>
<text x="208" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">نبایدها</text>
<text x="208" y="120" text-anchor="middle" font-size="13" fill="#3d3d3d">نه در جلسه بزرگ</text>
<text x="208" y="146" text-anchor="middle" font-size="13" fill="#3d3d3d">نه جمله دفاعی‌ساز</text>
<text x="208" y="172" text-anchor="middle" font-size="13" fill="#3d3d3d">نه دستور؛ سؤال</text>
<rect x="100" y="216" width="600" height="42" rx="12" fill="#fff" stroke="#2b2b2b" stroke-width="2"/>
<text x="400" y="243" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">«من متفاوت می‌بینم» بهتر از «اشتباه می‌کنی»</text>
</svg>
