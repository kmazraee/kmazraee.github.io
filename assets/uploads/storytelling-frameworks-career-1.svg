<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="پنج چارچوب داستان‌گویی برای پیشرفت شغلی: برند، مصاحبه، موفقیت مشتری، بنیان‌گذار و شرکت">
<rect width="800" height="410" fill="#ffffff"/>
<text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">پنج چارچوب داستان‌گویی</text>
<rect x="80" y="70" width="640" height="50" rx="10" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="102" text-anchor="middle" font-size="18" fill="#1f2937">۱. داستان برند: مشتری، مانع، راهنما، برنامه</text>
<rect x="80" y="132" width="640" height="50" rx="10" fill="#e6f6ec" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="164" text-anchor="middle" font-size="18" fill="#1f2937">۲. داستان مصاحبه: روش وضعیت، وظیفه، اقدام، نتیجه</text>
<rect x="80" y="194" width="640" height="50" rx="10" fill="#fff4e0" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="226" text-anchor="middle" font-size="18" fill="#1f2937">۳. داستان موفقیت مشتری: مسئله و تحول</text>
<rect x="80" y="256" width="640" height="50" rx="10" fill="#f3e8fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="288" text-anchor="middle" font-size="18" fill="#1f2937">۴. داستان بنیان‌گذار: آغاز تا موفقیت</text>
<rect x="80" y="318" width="640" height="50" rx="10" fill="#fde8e8" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="350" text-anchor="middle" font-size="18" fill="#1f2937">۵. داستان شرکت: خط زمانی نقاط عطف</text>
</svg>
