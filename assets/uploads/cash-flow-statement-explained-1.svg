<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="ساختار صورت جریان وجوه نقد و جریان نقد آزاد">
<rect width="800" height="360" fill="#faf7f0"/>
<text x="400" y="38" text-anchor="middle" font-size="22" fill="#2b2b2b" font-weight="bold">از سه فعالیت تا نقد پایان دوره</text><rect x="560" y="70" width="220" height="170" rx="12" fill="#e3f0e6" stroke="#5a9a6b" stroke-width="2"/><text x="670" y="102" text-anchor="middle" font-size="20" fill="#2b2b2b" font-weight="bold">عملیاتی</text><text x="670" y="142" text-anchor="middle" font-size="14" fill="#3d3d3d">جریان نقد عملیاتی: ۲۰۰</text><text x="670" y="196" text-anchor="middle" font-size="13" fill="#555">سود خالص + هزینه‌های غیرنقدی</text><text x="670" y="216" text-anchor="middle" font-size="13" fill="#555">± سرمایه در گردش</text><rect x="300" y="70" width="220" height="170" rx="12" fill="#fbeedd" stroke="#c98a3d" stroke-width="2"/><text x="410" y="102" text-anchor="middle" font-size="20" fill="#2b2b2b" font-weight="bold">سرمایه‌گذاری</text><text x="410" y="142" text-anchor="middle" font-size="14" fill="#3d3d3d">مخارج سرمایه‌ای: ۷۰−</text><text x="410" y="196" text-anchor="middle" font-size="13" fill="#555">کارخانه، تجهیزات</text><text x="410" y="216" text-anchor="middle" font-size="13" fill="#555">خرید شرکت‌ها</text><rect x="40" y="70" width="220" height="170" rx="12" fill="#e3eaf7" stroke="#4a6fb5" stroke-width="2"/><text x="150" y="102" text-anchor="middle" font-size="20" fill="#2b2b2b" font-weight="bold">تأمین مالی</text><text x="150" y="142" text-anchor="middle" font-size="14" fill="#3d3d3d">وام و انتشار سهم</text><text x="150" y="164" text-anchor="middle" font-size="14" fill="#3d3d3d">سود تقسیمی و بازخرید</text><text x="150" y="196" text-anchor="middle" font-size="13" fill="#555">جریان‌های ورودی و خروجی مالی</text><rect x="150" y="265" width="500" height="70" rx="12" fill="#fff" stroke="#2b2b2b" stroke-width="2"/><text x="400" y="296" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold">جریان نقد آزاد = جریان نقد عملیاتی − مخارج سرمایه‌ای</text><text x="400" y="322" text-anchor="middle" font-size="15" fill="#3d3d3d">مثال: ۲۰۰ − ۷۰ = ۱۳۰</text>
</svg>
