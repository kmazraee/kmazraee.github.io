<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="نمودار گلوله‌ای ساخته‌شده با تابع SPARKLINE: یک نوار میله‌ای تک‌سلولی با یک نشانگر باریک قرمز در موقعیت چهل درصد و سه مرحله‌ی ساخت فرمول"><rect width="800" height="300" fill="#ffffff"/><text x="400" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">نمودار گلوله‌ای در یک سلول: ۳۹ + ۲ + ۵۹ = ۱۰۰</text><rect x="100" y="90" width="600" height="40" fill="#ade2e6"/><rect x="334" y="90" width="12" height="40" fill="#dc2626"/><text x="100" y="155" font-size="14" fill="#4b5563">۰</text><text x="700" y="155" text-anchor="end" font-size="14" fill="#4b5563">۱۰۰</text><text x="340" y="80" text-anchor="middle" font-size="14" fill="#dc2626">نشانگر پیشرفت (۴۰٪)</text><rect x="50" y="185" width="220" height="80" rx="12" fill="#2563eb" opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="160.0" y="221.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">آرایه‌ی ثابت</text><text x="160.0" y="247.0" text-anchor="middle" font-size="14" fill="#4b5563">{۳۹، ۲، ۵۹}</text><rect x="290" y="185" width="220" height="80" rx="12" fill="#059669" opacity="0.12" stroke="#059669" stroke-width="2"/><text x="400.0" y="221.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">آرایه‌ی متغیر</text><text x="400.0" y="247.0" text-anchor="middle" font-size="14" fill="#4b5563">{A1-1، ۲، ۱۰۰-A1-1}</text><rect x="530" y="185" width="220" height="80" rx="12" fill="#7c3aed" opacity="0.12" stroke="#7c3aed" stroke-width="2"/><text x="640.0" y="221.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">فرمول نهایی</text><text x="640.0" y="247.0" text-anchor="middle" font-size="14" fill="#4b5563">SPARKLINE + IF</text></svg>
