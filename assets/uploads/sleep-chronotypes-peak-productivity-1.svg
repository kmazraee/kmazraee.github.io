<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="چهار کرونوتایپ خواب">
<rect width="800" height="400" fill="#ffffff"/>
<text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">چهار کرونوتایپ خواب</text>
<rect x="595" y="80" width="165" height="270" rx="12" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="677" y="150" text-anchor="middle" font-size="28" font-weight="700" fill="#1f2937">شیر</text>
<text x="677" y="205" text-anchor="middle" font-size="16" fill="#374151">سحرخیز</text>
<text x="677" y="260" text-anchor="middle" font-size="16" fill="#374151">اوج: صبح زود</text>
<rect x="410" y="80" width="165" height="270" rx="12" fill="#e6f6ec" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="492" y="150" text-anchor="middle" font-size="28" font-weight="700" fill="#1f2937">خرس</text>
<text x="492" y="205" text-anchor="middle" font-size="16" fill="#374151">هم‌ساعت با خورشید</text>
<text x="492" y="260" text-anchor="middle" font-size="16" fill="#374151">اوج: اواسط صبح</text>
<rect x="225" y="80" width="165" height="270" rx="12" fill="#fff4e0" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="307" y="150" text-anchor="middle" font-size="28" font-weight="700" fill="#1f2937">گرگ</text>
<text x="307" y="205" text-anchor="middle" font-size="16" fill="#374151">شب‌زنده</text>
<text x="307" y="260" text-anchor="middle" font-size="16" fill="#374151">اوج: عصر</text>
<rect x="40" y="80" width="165" height="270" rx="12" fill="#f3e8fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="122" y="150" text-anchor="middle" font-size="28" font-weight="700" fill="#1f2937">دلفین</text>
<text x="122" y="205" text-anchor="middle" font-size="16" fill="#374151">خواب نامنظم</text>
<text x="122" y="260" text-anchor="middle" font-size="16" fill="#374151">اوج: اواخر صبح</text>
</svg>
