<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="اثر شبکه‌ای مستقیم (یک گروه کاربر) و غیرمستقیم (دو گروه کاربر)">
<rect width="800" height="320" fill="#faf7f0"/>
<text x="400" y="34" text-anchor="middle" font-size="22" fill="#2b2b2b" font-weight="bold">اثر شبکه‌ای مستقیم و غیرمستقیم</text>
<rect x="420" y="56" width="360" height="236" rx="12" fill="#fff" stroke="#3d7a8c" stroke-width="2"/>
<text x="600" y="86" text-anchor="middle" font-size="17" fill="#3d7a8c" font-weight="bold">مستقیم: یک گروه کاربر</text>
<g stroke="#3d7a8c" stroke-width="1.5"><line x1="540" y1="140" x2="660" y2="140"/><line x1="540" y1="140" x2="600" y2="230"/><line x1="660" y1="140" x2="600" y2="230"/><line x1="540" y1="140" x2="600" y2="170"/><line x1="660" y1="140" x2="600" y2="170"/><line x1="600" y1="170" x2="600" y2="230"/></g>
<g fill="#3d7a8c"><circle cx="540" cy="140" r="12"/><circle cx="660" cy="140" r="12"/><circle cx="600" cy="230" r="12"/><circle cx="600" cy="170" r="12"/></g>
<text x="600" y="274" text-anchor="middle" font-size="13" fill="#2b2b2b">هر کاربر جدید، ارزش برای همه را بالا می‌برد</text>
<rect x="20" y="56" width="360" height="236" rx="12" fill="#fff" stroke="#c98a3d" stroke-width="2"/>
<text x="200" y="86" text-anchor="middle" font-size="17" fill="#c98a3d" font-weight="bold">غیرمستقیم: دو گروه کاربر</text>
<g stroke="#c98a3d" stroke-width="1.5"><line x1="100" y1="140" x2="300" y2="140"/><line x1="100" y1="140" x2="300" y2="190"/><line x1="100" y1="190" x2="300" y2="140"/><line x1="100" y1="190" x2="300" y2="190"/></g>
<g fill="#c98a3d"><circle cx="100" cy="140" r="12"/><circle cx="100" cy="190" r="12"/><circle cx="300" cy="140" r="12"/><circle cx="300" cy="190" r="12"/></g>
<text x="100" y="228" text-anchor="middle" font-size="13" fill="#2b2b2b">دارندگان کارت</text><text x="300" y="228" text-anchor="middle" font-size="13" fill="#2b2b2b">فروشگاه‌ها</text>
<text x="200" y="274" text-anchor="middle" font-size="13" fill="#2b2b2b">هر گروه ارزش گروه دیگر را بالا می‌برد</text>
</svg>
