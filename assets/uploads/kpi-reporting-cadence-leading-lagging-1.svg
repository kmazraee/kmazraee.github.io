<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="جدول ریتم گزارش‌دهی KPI">
<rect width="800" height="450" fill="#faf7f0"/>
<text x="400" y="50" text-anchor="middle" font-size="24" fill="#2b2b2b" font-weight="bold">ریتم گزارش‌دهی KPI</text>
<text x="710" y="95" text-anchor="middle" font-size="15" fill="#3d3d3d" font-weight="bold">دوره</text>
<text x="430" y="95" text-anchor="middle" font-size="15" fill="#3d3d3d" font-weight="bold">نوع شاخص</text>
<text x="160" y="95" text-anchor="middle" font-size="15" fill="#3d3d3d" font-weight="bold">نمونه‌ی گزارش</text>
<rect x="40" y="110" width="720" height="68" rx="10" fill="#e3eaf7" stroke="#4a6fb5" stroke-width="2"/>
<text x="710" y="150" text-anchor="middle" font-size="18" fill="#3d3d3d" font-weight="bold">هفتگی</text>
<text x="470" y="150" text-anchor="middle" font-size="14" fill="#3d3d3d">چند شاخص پیشرو‌ی کلیدی</text>
<text x="170" y="150" text-anchor="middle" font-size="13" fill="#3d3d3d">خط لوله‌ی فروش، مطالبات، موجودی بانک</text>
<rect x="40" y="190" width="720" height="68" rx="10" fill="#e3f0e6" stroke="#5a9a6b" stroke-width="2"/>
<text x="710" y="230" text-anchor="middle" font-size="18" fill="#3d3d3d" font-weight="bold">ماهانه</text>
<text x="470" y="230" text-anchor="middle" font-size="14" fill="#3d3d3d">خلاصه و ریز، پیشرو و پسرو</text>
<text x="170" y="230" text-anchor="middle" font-size="13" fill="#3d3d3d">صورت‌های مالی و داده‌ی ریز</text>
<rect x="40" y="270" width="720" height="68" rx="10" fill="#fbeee0" stroke="#c98a3a" stroke-width="2"/>
<text x="710" y="310" text-anchor="middle" font-size="18" fill="#3d3d3d" font-weight="bold">فصلی</text>
<text x="470" y="310" text-anchor="middle" font-size="14" fill="#3d3d3d">خلاصه + بخشی از داده‌ی ریز</text>
<text x="170" y="310" text-anchor="middle" font-size="13" fill="#3d3d3d">صورت‌های مالی و حاشیه‌ی ناخالص</text>
<rect x="40" y="350" width="720" height="68" rx="10" fill="#f1e4f2" stroke="#9a5aa8" stroke-width="2"/>
<text x="710" y="390" text-anchor="middle" font-size="18" fill="#3d3d3d" font-weight="bold">سالانه</text>
<text x="470" y="390" text-anchor="middle" font-size="14" fill="#3d3d3d">پیش‌بینی و داده‌ی ریز کل کسب‌وکار</text>
<text x="170" y="390" text-anchor="middle" font-size="13" fill="#3d3d3d">صورت‌های مالی، پیش‌بینی، تحلیل هزینه</text>
<text x="400" y="435" text-anchor="middle" font-size="14" fill="#555">از شاخص پیشرو (ورودی) تا شاخص پسرو (نتیجه) را به هم وصل کنید</text>
</svg>
