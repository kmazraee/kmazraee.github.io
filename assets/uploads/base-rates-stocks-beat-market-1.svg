<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="نمودار میله‌ای احتمال داشتن دست‌کم یک سهم برنده در سبدهای ۳، ۵ و ۱۰ سهمی">
<rect width="800" height="340" fill="#faf7f0"/>
<text x="400" y="36" text-anchor="middle" font-size="22" fill="#2b2b2b" font-weight="bold">هرچه سهم بیشتر، شانس داشتن یک برنده بیشتر</text>
<line x1="90" y1="280" x2="730" y2="280" stroke="#888" stroke-width="2"/>
<rect x="580" y="169" width="110" height="111" rx="6" fill="#c98a3d"/><text x="635" y="159" text-anchor="middle" font-size="20" fill="#2b2b2b" font-weight="bold">≈ ۵۰٪</text><text x="635" y="306" text-anchor="middle" font-size="16" fill="#2b2b2b">۳ سهم</text>
<rect x="345" y="124" width="110" height="156" rx="6" fill="#5a9a6b"/><text x="400" y="114" text-anchor="middle" font-size="20" fill="#2b2b2b" font-weight="bold">≈ ۷۰٪</text><text x="400" y="306" text-anchor="middle" font-size="16" fill="#2b2b2b">۵ سهم</text>
<rect x="110" y="80" width="110" height="200" rx="6" fill="#3d7a8c"/><text x="165" y="70" text-anchor="middle" font-size="20" fill="#2b2b2b" font-weight="bold">≈ ۹۰٪</text><text x="165" y="306" text-anchor="middle" font-size="16" fill="#2b2b2b">۱۰ سهم</text>
<text x="400" y="330" text-anchor="middle" font-size="13" fill="#666">احتمال داشتن دست‌کم یک سهم برنده (برآورد ساده‌شده)</text>
</svg>
