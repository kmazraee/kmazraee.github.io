<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="روتین پایدار: کف حداقلی که همیشه اجرا می‌شود و بالای آن بخش انعطاف‌پذیر که در روزهای خوب اضافه می‌شود">
<rect width="800" height="280" fill="#ffffff"/>
<text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">روتین پایدار: کف و سقف</text>
<rect x="80" y="70" width="640" height="48" rx="10" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400.0" y="101" text-anchor="middle" font-size="18" fill="#1f2937">سقف (روز خوب): ۴۵ دقیقه تمرین، مطالعه‌ی یک ساعته</text>
<rect x="80" y="132" width="640" height="48" rx="10" fill="#e6f6ec" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400.0" y="163" text-anchor="middle" font-size="18" fill="#1f2937">انعطاف بالای کف: هر چه توان دارید اضافه کنید</text>
<rect x="80" y="194" width="640" height="48" rx="10" fill="#fff4e0" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400.0" y="225" text-anchor="middle" font-size="18" fill="#1f2937">کف (همیشه): ۲۰ حرکت، ۱۰ دقیقه پیاده‌روی، ۵ صفحه</text>
</svg>
