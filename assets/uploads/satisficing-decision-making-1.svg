<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 276" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="سه گام تصمیم‌گیری رضایت‌بخش: محدود کردن گزینه‌ها به کمتر از شش مورد، تعیین سقف زمان تحقیق و وزن‌دهی معیارها">
<rect width="800" height="276" fill="#ffffff"/>
<text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">سه گام تصمیم‌گیری رضایت‌بخش</text>
<rect x="80" y="70" width="640" height="48" rx="10" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="100" text-anchor="middle" font-size="18" fill="#1f2937">۱. گزینه‌ها را به کمتر از ۶ مورد برسانید</text>
<rect x="80" y="132" width="640" height="48" rx="10" fill="#e6f6ec" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="162" text-anchor="middle" font-size="18" fill="#1f2937">۲. برای تحقیق سقف زمانی بگذارید</text>
<rect x="80" y="194" width="640" height="48" rx="10" fill="#fff4e0" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="224" text-anchor="middle" font-size="18" fill="#1f2937">۳. معیارها را وزن‌دهی و انتخاب کنید</text>
</svg>
