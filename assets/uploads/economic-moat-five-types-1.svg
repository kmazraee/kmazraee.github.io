<rect x="20" y="206" width="190" height="62" rx="10" fill="#fff" stroke="#7a5aa0" stroke-width="2"/><text x="115" y="244" text-anchor="middle" font-size="16" fill="#2b2b2b">۴. دارایی ناملموس</text>
<rect x="20" y="62" width="190" height="62" rx="10" fill="#fff" stroke="#3d7a8c" stroke-width="2"/><text x="115" y="100" text-anchor="middle" font-size="16" fill="#2b2b2b">۵. خلاف‌آمدی</text>
