<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="پنج نوع سد رقابتی: اثر شبکه‌ای، هزینه‌ی جابه‌جایی، مزیت هزینه، دارایی ناملموس و خلاف‌آمدی">
<rect width="800" height="340" fill="#faf7f0"/>
<text x="400" y="36" text-anchor="middle" font-size="22" fill="#2b2b2b" font-weight="bold">پنج نوع سد رقابتی</text>
<rect x="320" y="130" width="160" height="70" rx="35" fill="#3d7a8c"/><text x="400" y="171" text-anchor="middle" font-size="17" fill="#fff" font-weight="bold">شرکت با سد</text>
<rect x="590" y="62" width="190" height="62" rx="10" fill="#fff" stroke="#5a9a6b" stroke-width="2"/><text x="685" y="100" text-anchor="middle" font-size="16" fill="#2b2b2b">۱. اثر شبکه‌ای</text>
