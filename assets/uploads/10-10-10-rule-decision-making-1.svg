<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 286" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="سه افق زمانی برای ارزیابی تصمیم">
<rect width="800" height="286" fill="#ffffff"/>
<text x="400.0" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">قانون ۱۰-۱۰-۱۰</text>
<rect x="534" y="75" width="236" height="130" rx="12" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="652" y="117" text-anchor="middle" font-size="26" font-weight="700" fill="#2b6cb0">۱</text>
<text x="652" y="153" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">۱۰ دقیقه بعد</text>
<text x="652" y="181" text-anchor="middle" font-size="13" fill="#374151">چه حسی دارم؟</text>
<rect x="282" y="75" width="236" height="130" rx="12" fill="#e6f6ec" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="117" text-anchor="middle" font-size="26" font-weight="700" fill="#2b6cb0">۲</text>
<text x="400" y="153" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">۱۰ ماه بعد</text>
<text x="400" y="181" text-anchor="middle" font-size="13" fill="#374151">چه حسی دارم؟</text>
<rect x="30" y="75" width="236" height="130" rx="12" fill="#fff4e0" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="148" y="117" text-anchor="middle" font-size="26" font-weight="700" fill="#2b6cb0">۳</text>
<text x="148" y="153" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">۱۰ سال بعد</text>
<text x="148" y="181" text-anchor="middle" font-size="13" fill="#374151">چه حسی دارم؟</text>
<text x="400.0" y="268" text-anchor="middle" font-size="15" fill="#374151">گزینه‌ی بهتر در بلندمدت را انتخاب کنید</text>
</svg>
