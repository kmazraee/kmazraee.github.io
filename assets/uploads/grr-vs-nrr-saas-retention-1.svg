<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="مقایسه GRR و NRR با مثال عددی">
<rect width="800" height="380" fill="#faf7f0"/>
<text x="400" y="34" text-anchor="middle" font-size="21" fill="#2b2b2b" font-weight="bold">GRR و NRR؛ دو نگاه به ماندگاری درآمد</text>
<rect x="420" y="60" width="360" height="230" rx="12" fill="#e3eaf7" stroke="#4a6fb5" stroke-width="2"/>
<text x="600" y="92" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold">GRR؛ ماندگاری ناخالص</text>
<text x="600" y="126" text-anchor="middle" font-size="14" fill="#555">بدون احتساب افزایش قرارداد</text>
<text x="600" y="162" text-anchor="middle" font-size="15" fill="#2b2b2b">(۱۲۳٬۰۰۰ − ۳٬۰۰۰ − ۱٬۰۰۰) ÷ ۱۲۳٬۰۰۰</text>
<text x="600" y="200" text-anchor="middle" font-size="30" fill="#1c4587" font-weight="bold">= ۹۶٫۷٪</text>
<text x="600" y="238" text-anchor="middle" font-size="14" fill="#555">هرگز بالاتر از ۱۰۰٪ نمی‌شود</text>
<text x="600" y="266" text-anchor="middle" font-size="14" fill="#555">سخت‌گیرانه‌تر</text>
<rect x="20" y="60" width="360" height="230" rx="12" fill="#e3f0e6" stroke="#5a9a6b" stroke-width="2"/>
<text x="200" y="92" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold">NRR؛ ماندگاری خالص</text>
<text x="200" y="126" text-anchor="middle" font-size="14" fill="#555">با احتساب افزایش قرارداد</text>
<text x="200" y="162" text-anchor="middle" font-size="15" fill="#2b2b2b">(۱۰۹٬۰۰۰ + ۵٬۰۰۰ − ۱٬۰۰۰) ÷ ۱۰۹٬۰۰۰</text>
<text x="200" y="200" text-anchor="middle" font-size="30" fill="#076239" font-weight="bold">= ۱۰۳٫۷٪</text>
<text x="200" y="238" text-anchor="middle" font-size="14" fill="#555">می‌تواند بالاتر از ۱۰۰٪ باشد</text>
<text x="200" y="266" text-anchor="middle" font-size="14" fill="#555">نشان‌دهنده‌ی رشد از مشتریان فعلی</text>
<rect x="150" y="312" width="500" height="48" rx="12" fill="#fff" stroke="#2b2b2b" stroke-width="2"/>
<text x="400" y="342" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">هر دو را کنار هم بخوانید؛ NRR خوب نباید ریزش را پنهان کند</text>
</svg>