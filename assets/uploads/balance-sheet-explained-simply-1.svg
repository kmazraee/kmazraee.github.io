<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="معادله ترازنامه دارایی برابر بدهی به علاوه حقوق صاحبان سهام">
<rect width="800" height="330" fill="#faf7f0"/>
<text x="400" y="38" text-anchor="middle" font-size="22" fill="#2b2b2b" font-weight="bold">معادله‌ی ترازنامه (مثال فرضی)</text><rect x="470" y="70" width="290" height="230" rx="12" fill="#e3f0e6" stroke="#5a9a6b" stroke-width="2"/><text x="615" y="102" text-anchor="middle" font-size="20" fill="#2b4a33" font-weight="bold">دارایی‌ها: ۵۰۰</text><text x="615" y="140" text-anchor="middle" font-size="16" fill="#3d3d3d">نقد: ۱۰۰</text><text x="615" y="170" text-anchor="middle" font-size="16" fill="#3d3d3d">موجودی و حساب‌های دریافتنی: ۱۵۰</text><text x="615" y="200" text-anchor="middle" font-size="16" fill="#3d3d3d">تجهیزات و دارایی بلندمدت: ۲۵۰</text><text x="615" y="250" text-anchor="middle" font-size="14" fill="#555">آنچه شرکت دارد</text><text x="400" y="190" text-anchor="middle" font-size="44" fill="#2b2b2b" font-weight="bold">=</text><rect x="40" y="70" width="300" height="105" rx="12" fill="#fbeedd" stroke="#c98a3d" stroke-width="2"/><text x="190" y="100" text-anchor="middle" font-size="20" fill="#5c3c10" font-weight="bold">بدهی‌ها: ۳۰۰</text><text x="190" y="130" text-anchor="middle" font-size="16" fill="#3d3d3d">جاری ۱۲۰ + بلندمدت ۱۸۰</text><text x="190" y="157" text-anchor="middle" font-size="14" fill="#555">آنچه شرکت بدهکار است</text><text x="190" y="196" text-anchor="middle" font-size="34" fill="#2b2b2b" font-weight="bold">+</text><rect x="40" y="205" width="300" height="95" rx="12" fill="#e3eaf7" stroke="#4a6fb5" stroke-width="2"/><text x="190" y="235" text-anchor="middle" font-size="20" fill="#1c3a73" font-weight="bold">حقوق صاحبان سهام: ۲۰۰</text><text x="190" y="262" text-anchor="middle" font-size="16" fill="#3d3d3d">سهم مالکان از دارایی‌ها</text><text x="190" y="284" text-anchor="middle" font-size="14" fill="#555">ارزش دفتری</text>
</svg>
