<text x="496" y="120" text-anchor="middle" font-size="13" fill="#3d3d3d">پرسش و پاسخ</text>
<text x="496" y="146" text-anchor="middle" font-size="13" fill="#3d3d3d">عمومی</text>
<text x="496" y="172" text-anchor="middle" font-size="13" fill="#3d3d3d">رایگان</text>
<rect x="216" y="62" width="176" height="138" rx="12" fill="#fbeee0" stroke="#c98a3a" stroke-width="2"/>
<text x="304" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">سرمایه‌گذاران خطرپذیر</text>
