<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 278" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="چهار منبع اطلاعات برای محک‌زنی مالی">
<rect width="800" height="278" fill="#faf7f0"/>
<text x="400" y="38" text-anchor="middle" font-size="21" fill="#2b2b2b" font-weight="bold">چهار منبع برای محک‌زنی مالی</text>
<rect x="600" y="62" width="176" height="138" rx="12" fill="#e3eaf7" stroke="#4a6fb5" stroke-width="2"/>
<text x="688" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">گزارش سود</text>
<text x="688" y="120" text-anchor="middle" font-size="13" fill="#3d3d3d">اسلایدهای</text>
<text x="688" y="146" text-anchor="middle" font-size="13" fill="#3d3d3d">سرمایه‌گذاران</text>
<text x="688" y="172" text-anchor="middle" font-size="13" fill="#3d3d3d">رایگان</text>
<rect x="408" y="62" width="176" height="138" rx="12" fill="#e3f0e6" stroke="#5a9a6b" stroke-width="2"/>
