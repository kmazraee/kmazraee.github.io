<text x="112" y="172" text-anchor="middle" font-size="13" fill="#3d3d3d">پولی</text>
<rect x="100" y="216" width="600" height="42" rx="12" fill="#fff" stroke="#2b2b2b" stroke-width="2"/>
<text x="400" y="243" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">گروه مقایسه و تعریف شاخص را یکسان کنید</text>
