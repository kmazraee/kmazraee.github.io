<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" direction="rtl" font-family="Vazirmatn, Tahoma, 'DejaVu Sans', sans-serif" role="img" aria-label="مقایسه دو روش پیش‌بینی هزینه میزبانی">
<rect width="800" height="400" rx="18" fill="#ffffff"/>
<rect x="8" y="8" width="784" height="384" rx="14" fill="none" stroke="#d5dee8" stroke-width="2"/>
<text x="400" y="58" text-anchor="middle" font-size="26" font-weight="700" fill="#16324f">دو راه برای پیش‌بینی هزینه میزبانی</text>
<line x1="250" y1="74" x2="550" y2="74" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round"/>
<rect x="420" y="100" width="360" height="250" rx="14" fill="#fdecef" stroke="#c53030" stroke-width="2"/>
<text x="600" y="136" text-anchor="middle" font-size="20" font-weight="700" fill="#16324f">بر پایه رشد درآمد</text>
<text x="600" y="172" text-anchor="middle" font-size="15" fill="#3d566e">یک نسبت واحد: ۲۲٪ از درآمد</text>
<text x="600" y="204" text-anchor="middle" font-size="15" fill="#3d566e">هزینه برآوردی: ۲۶٫۶ میلیون</text>
<text x="600" y="236" text-anchor="middle" font-size="15" fill="#3d566e">ترکیب محصول را نادیده می‌گیرد</text>
<text x="600" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#c53030">حاشیه ناخالص خوش‌بینانه</text>
<rect x="20" y="100" width="360" height="250" rx="14" fill="#e9f7ef" stroke="#2f855a" stroke-width="2"/>
<text x="200" y="136" text-anchor="middle" font-size="20" font-weight="700" fill="#16324f">بر پایه فعالیت و محصول</text>
<text x="200" y="172" text-anchor="middle" font-size="15" fill="#3d566e">محصول الف: ۱۰٪ ← ۶٫۵ میلیون</text>
<text x="200" y="204" text-anchor="middle" font-size="15" fill="#3d566e">محصول ب: ۴۰٪ ← ۲۲٫۴ میلیون</text>
<text x="200" y="236" text-anchor="middle" font-size="15" fill="#3d566e">جمع: ۲۸٫۹ میلیون</text>
<text x="200" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#2f855a">برآورد واقع‌بینانه‌تر</text>
</svg>
