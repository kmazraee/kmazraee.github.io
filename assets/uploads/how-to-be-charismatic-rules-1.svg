<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 432" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="شش قانون کاریزما">
<rect width="800" height="432" fill="#ffffff"/>
<text x="400.0" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">شش قانون کاریزما</text>
<rect x="534" y="75" width="236" height="130" rx="12" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="652" y="117" text-anchor="middle" font-size="26" font-weight="700" fill="#2b6cb0">۱</text>
<text x="652" y="153" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">دیدن و شنیدن</text>
<text x="652" y="181" text-anchor="middle" font-size="13" fill="#374151">دیگران را مهم کنید</text>
<rect x="282" y="75" width="236" height="130" rx="12" fill="#e6f6ec" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="117" text-anchor="middle" font-size="26" font-weight="700" fill="#2b6cb0">۲</text>
<text x="400" y="153" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">مکث</text>
<text x="400" y="181" text-anchor="middle" font-size="13" fill="#374151">دو ثانیه صبر</text>
<rect x="30" y="75" width="236" height="130" rx="12" fill="#fff4e0" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="148" y="117" text-anchor="middle" font-size="26" font-weight="700" fill="#2b6cb0">۳</text>
<text x="148" y="153" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">زبان بدن</text>
<text x="148" y="181" text-anchor="middle" font-size="13" fill="#374151">صاف و با تماس چشمی</text>
<rect x="534" y="221" width="236" height="130" rx="12" fill="#f3e8fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="652" y="263" text-anchor="middle" font-size="26" font-weight="700" fill="#2b6cb0">۴</text>
<text x="652" y="299" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">شوخ‌طبعی</text>
<text x="652" y="327" text-anchor="middle" font-size="13" fill="#374151">غیرمنتظره و دقیق</text>
<rect x="282" y="221" width="236" height="130" rx="12" fill="#fde8e8" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="263" text-anchor="middle" font-size="26" font-weight="700" fill="#2b6cb0">۵</text>
<text x="400" y="299" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">بدون غیبت</text>
<text x="400" y="327" text-anchor="middle" font-size="13" fill="#374151">شکایت نکنید</text>
<rect x="30" y="221" width="236" height="130" rx="12" fill="#e8f6f6" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="148" y="263" text-anchor="middle" font-size="26" font-weight="700" fill="#2b6cb0">۶</text>
<text x="148" y="299" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">پذیرش ضعف</text>
<text x="148" y="327" text-anchor="middle" font-size="13" fill="#374151">نقص انسانی است</text>
<text x="400.0" y="414" text-anchor="middle" font-size="15" fill="#374151">یک قانون انتخاب و تمرین کنید</text>
</svg>
