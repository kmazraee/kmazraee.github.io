<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="قیمت سهم مثل سگی روی بند: در کوتاه‌مدت تصادفی می‌چرخد ولی همراه مسیر کسب‌وکار پیش می‌رود">
<rect width="800" height="320" fill="#faf7f0"/>
<text x="400" y="36" text-anchor="middle" font-size="22" fill="#2b2b2b" font-weight="bold">قیمت سهم و کسب‌وکار؛ مثل سگ روی بند</text><path d="M700,160 L100,160" stroke="#4a6fb5" stroke-width="5" fill="none"/><path d="M700,160 C660,70 620,250 570,120 C520,40 480,260 430,170 C390,100 350,230 300,160 C260,110 220,200 180,165 C150,150 130,162 100,160" stroke="#c98a3d" stroke-width="3" fill="none"/><text x="600" y="92" text-anchor="middle" font-size="15" fill="#c98a3d" font-weight="bold">قیمت سهم: در کوتاه‌مدت تصادفی</text><text x="640" y="270" text-anchor="middle" font-size="15" fill="#4a6fb5" font-weight="bold">کسب‌وکار: مسیر پیش‌بینی‌پذیرتر</text><text x="130" y="210" text-anchor="middle" font-size="15" fill="#5a9a6b" font-weight="bold">در بلندمدت همگرا می‌شوند</text>
</svg>
