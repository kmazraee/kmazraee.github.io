<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="نمودار ایکیگای">
<rect width="800" height="400" fill="#ffffff"/>
<text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">ایکیگای: محل تلاقی چهار پرسش</text>
<circle cx="400" cy="150" r="95" fill="#e8f1fb" fill-opacity="0.75" stroke="#2b6cb0" stroke-width="1.5"/>
<circle cx="325" cy="215" r="95" fill="#e6f6ec" fill-opacity="0.75" stroke="#2b6cb0" stroke-width="1.5"/>
<circle cx="475" cy="215" r="95" fill="#fff4e0" fill-opacity="0.75" stroke="#2b6cb0" stroke-width="1.5"/>
<circle cx="400" cy="280" r="95" fill="#f3e8fb" fill-opacity="0.75" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="102" text-anchor="middle" font-size="15" fill="#1f2937">چه چیزی را دوست دارم؟</text>
<text x="272" y="222" text-anchor="middle" font-size="15" fill="#1f2937">در چه کاری خوب هستم؟</text>
<text x="528" y="222" text-anchor="middle" font-size="15" fill="#1f2937">دنیا به چه نیاز دارد؟</text>
<text x="400" y="338" text-anchor="middle" font-size="15" fill="#1f2937">چه کاری درآمد دارد؟</text>
<text x="400" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">ایکیگای</text>
</svg>
