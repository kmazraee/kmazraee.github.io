<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="سه دلیل شکست تملک‌ها و سه معیار تملک موفق">
<rect width="880" height="372" fill="#faf7f0"/>
<text x="440.0" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b2b2b">تملک: چرا شکست می‌خورد و چه وقت موفق می‌شود</text>
<rect x="589" y="70" width="267" height="130" rx="12" fill="#fff" stroke="#b5524a" stroke-width="2"/>
<rect x="589" y="70" width="267" height="38" rx="12" fill="#b5524a"/><rect x="589" y="96" width="267" height="12" fill="#b5524a"/>
<text x="723" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">فروشنده زمان را تعیین می‌کند</text>
<text x="723" y="138" text-anchor="middle" font-size="14" fill="#2b2b2b">منتظر بازار خوب</text>
<text x="723" y="164" text-anchor="middle" font-size="14" fill="#2b2b2b">و قیمت بالا می‌ماند</text>
<rect x="307" y="70" width="267" height="130" rx="12" fill="#fff" stroke="#b5524a" stroke-width="2"/>
<rect x="307" y="70" width="267" height="38" rx="12" fill="#b5524a"/><rect x="307" y="96" width="267" height="12" fill="#b5524a"/>
<text x="440" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">فروشنده بیشتر می‌داند</text>
<text x="440" y="138" text-anchor="middle" font-size="14" fill="#2b2b2b">اطلاعات داخلی</text>
<text x="440" y="164" text-anchor="middle" font-size="14" fill="#2b2b2b">به نفع فروشنده است</text>
<rect x="24" y="70" width="267" height="130" rx="12" fill="#fff" stroke="#b5524a" stroke-width="2"/>
<rect x="24" y="70" width="267" height="38" rx="12" fill="#b5524a"/><rect x="24" y="96" width="267" height="12" fill="#b5524a"/>
<text x="157" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">پریمیوم گران است</text>
<text x="157" y="138" text-anchor="middle" font-size="14" fill="#2b2b2b">خریدار بیش از قیمت روز</text>
<text x="157" y="164" text-anchor="middle" font-size="14" fill="#2b2b2b">سهم می‌پردازد</text>
<rect x="589" y="216" width="267" height="130" rx="12" fill="#fff" stroke="#5a9a6b" stroke-width="2"/>
<rect x="589" y="216" width="267" height="38" rx="12" fill="#5a9a6b"/><rect x="589" y="242" width="267" height="12" fill="#5a9a6b"/>
<text x="723" y="241" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">سد رقابتی</text>
<text x="723" y="284" text-anchor="middle" font-size="14" fill="#2b2b2b">شرکت هدف مزیتی دارد</text>
<text x="723" y="310" text-anchor="middle" font-size="14" fill="#2b2b2b">یا تهدید آینده است</text>
<rect x="307" y="216" width="267" height="130" rx="12" fill="#fff" stroke="#5a9a6b" stroke-width="2"/>
<rect x="307" y="216" width="267" height="38" rx="12" fill="#5a9a6b"/><rect x="307" y="242" width="267" height="12" fill="#5a9a6b"/>
<text x="440" y="241" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">قیمت منطقی</text>
<text x="440" y="284" text-anchor="middle" font-size="14" fill="#2b2b2b">مبلغ با ارزش بلندمدت</text>
<text x="440" y="310" text-anchor="middle" font-size="14" fill="#2b2b2b">هم‌خوان است</text>
<rect x="24" y="216" width="267" height="130" rx="12" fill="#fff" stroke="#5a9a6b" stroke-width="2"/>
<rect x="24" y="216" width="267" height="38" rx="12" fill="#5a9a6b"/><rect x="24" y="242" width="267" height="12" fill="#5a9a6b"/>
<text x="157" y="241" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">هم‌خوانی فرهنگی</text>
<text x="157" y="284" text-anchor="middle" font-size="14" fill="#2b2b2b">ازدواج بلندمدت</text>
<text x="157" y="310" text-anchor="middle" font-size="14" fill="#2b2b2b">نه معامله‌ی یک‌باره</text>
</svg>