<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 232" font-family="Vazirmatn, Tahoma, Arial, sans-serif">
<rect width="800" height="232" rx="14" fill="#f7f5ef"/>
<text direction="rtl" x="400.0" y="48" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2a37">سه گام تعیین نرخ حداقل بازده</text>
<line x1="300" y1="64" x2="500" y2="64" stroke="#b08d57" stroke-width="3"/>
<rect x="538" y="84" width="242" height="124" rx="10" fill="#ffffff" stroke="#d9d2c0"/>
<circle cx="756" cy="108" r="14" fill="#1f4e5f"/>
<text direction="rtl" x="756" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
<text direction="rtl" x="732" y="114" text-anchor="start" font-size="16" font-weight="700" fill="#1f2a37">نرخ پایه</text>
<text direction="rtl" x="766" y="146" text-anchor="start" font-size="13" fill="#4b5563">هزینه‌ی سرمایه یا</text>
<text direction="rtl" x="766" y="168" text-anchor="start" font-size="13" fill="#4b5563">بازده پروژه‌های موفق</text>
<rect x="279" y="84" width="242" height="124" rx="10" fill="#ffffff" stroke="#d9d2c0"/>
<circle cx="497" cy="108" r="14" fill="#1f4e5f"/>
<text direction="rtl" x="497" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>
<text direction="rtl" x="473" y="114" text-anchor="start" font-size="16" font-weight="700" fill="#1f2a37">صرف ریسک</text>
<text direction="rtl" x="507" y="146" text-anchor="start" font-size="13" fill="#4b5563">بر اساس ریسک خاص</text>
<text direction="rtl" x="507" y="168" text-anchor="start" font-size="13" fill="#4b5563">هر پروژه</text>
<rect x="20" y="84" width="242" height="124" rx="10" fill="#ffffff" stroke="#d9d2c0"/>
<circle cx="238" cy="108" r="14" fill="#1f4e5f"/>
<text direction="rtl" x="238" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3</text>
<text direction="rtl" x="214" y="114" text-anchor="start" font-size="16" font-weight="700" fill="#1f2a37">تعدیل راهبردی</text>
<text direction="rtl" x="248" y="146" text-anchor="start" font-size="13" fill="#4b5563">با اهمیت و هم‌افزایی</text>
<text direction="rtl" x="248" y="168" text-anchor="start" font-size="13" fill="#4b5563">هم‌راستا با مدیران ارشد</text>
</svg>
