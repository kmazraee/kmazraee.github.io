<rect x="315" y="110" width="170" height="90" rx="10" fill="#0f766e"/><text x="400.0" y="151.0" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle" direction="rtl">۲. کنترل</text><text x="400.0" y="175.0" font-size="13" fill="#ffffff" text-anchor="middle" direction="rtl">تطبیق با منبع</text>
