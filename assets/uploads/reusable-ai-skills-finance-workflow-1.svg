<text x="542.5" y="242" font-size="14" fill="#92400e" text-anchor="middle" direction="rtl">تأیید انسانی</text>
<line x1="310" y1="155.0" x2="208" y2="155.0" stroke="#6b7280" stroke-width="3"/>
<polygon points="200,155.0 212,148.0 212,162.0" fill="#6b7280"/>
<rect x="207.5" y="220" width="100" height="34" rx="17" fill="#fef3c7" stroke="#d97706"/>
<text x="257.5" y="242" font-size="14" fill="#92400e" text-anchor="middle" direction="rtl">تأیید انسانی</text>
<text x="400.0" y="275" font-size="15" fill="#374151" text-anchor="middle" direction="rtl">یک فرمان کوتاه، سه مهارت به ترتیب؛ عبور به مرحله‌ی بعد فقط با تأیید شما</text>
