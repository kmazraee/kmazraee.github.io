<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="نمودار آبشاری از درآمد تا سود خالص">
<rect width="800" height="380" fill="#faf7f0"/>
<text x="400" y="36" text-anchor="middle" font-size="22" fill="#2b2b2b" font-weight="bold">مسیر پول در صورت سود و زیان (مثال، میلیون)</text><rect x="690" y="80" width="70" height="220" rx="5" fill="#4a6fb5"/><text x="725.0" y="72.0" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold">۱٬۰۰۰</text><text x="725.0" y="322" text-anchor="middle" font-size="12" fill="#3d3d3d">درآمد</text><rect x="602" y="80" width="70" height="132" rx="5" fill="#c0583d"/><text x="637.0" y="72.0" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold">−۶۰۰</text><text x="637.0" y="322" text-anchor="middle" font-size="12" fill="#3d3d3d">بهای تمام‌شده</text><rect x="514" y="212" width="70" height="88" rx="5" fill="#5a9a6b"/><text x="549.0" y="204.0" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold">۴۰۰</text><text x="549.0" y="322" text-anchor="middle" font-size="12" fill="#3d3d3d">سود ناخالص</text><rect x="426" y="212" width="70" height="55" rx="5" fill="#c0583d"/><text x="461.0" y="204.0" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold">−۲۵۰</text><text x="461.0" y="322" text-anchor="middle" font-size="12" fill="#3d3d3d">هزینه عملیاتی</text><rect x="338" y="267" width="70" height="33" rx="5" fill="#5a9a6b"/><text x="373.0" y="259.0" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold">۱۵۰</text><text x="373.0" y="322" text-anchor="middle" font-size="12" fill="#3d3d3d">سود عملیاتی</text><rect x="250" y="267" width="70" height="7" rx="5" fill="#c0583d"/><text x="285.0" y="259.0" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold">−۳۰</text><text x="285.0" y="322" text-anchor="middle" font-size="12" fill="#3d3d3d">بهره</text><rect x="162" y="274" width="70" height="7" rx="5" fill="#c0583d"/><text x="197.0" y="265.6" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold">−۳۰</text><text x="197.0" y="322" text-anchor="middle" font-size="12" fill="#3d3d3d">مالیات</text><rect x="74" y="280" width="70" height="20" rx="5" fill="#2f7d4a"/><text x="109.0" y="272.2" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold">۹۰</text><text x="109.0" y="322" text-anchor="middle" font-size="12" fill="#3d3d3d">سود خالص</text><line x1="30" y1="300" x2="770" y2="300" stroke="#bbb" stroke-width="1"/><text x="400" y="358" text-anchor="middle" font-size="15" fill="#3d3d3d">سود هر سهم = سود خالص ÷ تعداد سهام (مثلاً ۹۰ ÷ ۴۵ = ۲)</text>
</svg>
