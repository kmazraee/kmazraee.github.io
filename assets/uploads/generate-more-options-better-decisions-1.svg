<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 224" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="چهار گام تولید گزینه‌های بیشتر پیش از تصمیم">
<rect width="800" height="224" fill="#faf7f0"/>
<text x="400" y="38" text-anchor="middle" font-size="21" fill="#2b2b2b" font-weight="bold">گزینه‌های بیشتر، تصمیم بهتر</text>
<rect x="597.0" y="62" width="179.0" height="138" rx="12" fill="#e3eaf7" stroke="#4a6fb5" stroke-width="2"/>
<text x="686.5" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">۱. اولین ایده</text>
<text x="686.5" y="124" text-anchor="middle" font-size="13" fill="#3d3d3d">معمولاً همان که</text>
<text x="686.5" y="150" text-anchor="middle" font-size="13" fill="#3d3d3d">اکثر اتاق</text>
<text x="686.5" y="176" text-anchor="middle" font-size="13" fill="#3d3d3d">می‌پسندد</text>
<rect x="406.0" y="62" width="179.0" height="138" rx="12" fill="#e3f0e6" stroke="#5a9a6b" stroke-width="2"/>
<text x="495.5" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">۲. پنج تا ده گزینه</text>
<text x="495.5" y="124" text-anchor="middle" font-size="13" fill="#3d3d3d">بنویسید، حتی</text>
<text x="495.5" y="150" text-anchor="middle" font-size="13" fill="#3d3d3d">گزینه‌های</text>
<text x="495.5" y="176" text-anchor="middle" font-size="13" fill="#3d3d3d">عجیب</text>
<rect x="215.0" y="62" width="179.0" height="138" rx="12" fill="#fbeee0" stroke="#c98a3a" stroke-width="2"/>
<text x="304.5" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">۳. گزینه‌های آخر</text>
<text x="304.5" y="124" text-anchor="middle" font-size="13" fill="#3d3d3d">اغلب خلاق‌تر</text>
<text x="304.5" y="150" text-anchor="middle" font-size="13" fill="#3d3d3d">از اولین</text>
<text x="304.5" y="176" text-anchor="middle" font-size="13" fill="#3d3d3d">هستند</text>
<rect x="24.0" y="62" width="179.0" height="138" rx="12" fill="#f1e4f2" stroke="#9a5aa8" stroke-width="2"/>
<text x="113.5" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">۴. ارزیابی</text>
<text x="113.5" y="124" text-anchor="middle" font-size="13" fill="#3d3d3d">حالا گزینه‌ها</text>
<text x="113.5" y="150" text-anchor="middle" font-size="13" fill="#3d3d3d">را مقایسه</text>
<text x="113.5" y="176" text-anchor="middle" font-size="13" fill="#3d3d3d">کنید</text>
</svg>
