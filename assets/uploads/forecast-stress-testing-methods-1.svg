<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 436" font-family="Vazirmatn, Tahoma, Arial, sans-serif">
<rect width="800" height="436" rx="14" fill="#f7f5ef"/>
<text x="400.0" y="48" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2a37">نه روش آزمون استرس پیش‌بینی</text>
<line x1="300" y1="64" x2="500" y2="64" stroke="#b08d57" stroke-width="3"/>
<rect x="537" y="84" width="243" height="96" rx="10" fill="#ffffff" stroke="#d9d2c0"/>
<circle cx="756" cy="108" r="14" fill="#1f4e5f"/>
<text x="756" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
<text x="732" y="114" text-anchor="end" font-size="16" font-weight="700" fill="#1f2a37">تحلیل سناریو</text>
<text x="766" y="146" text-anchor="end" font-size="13" fill="#4b5563">چند سناریو برای متغیرهای کلیدی</text>
<rect x="279" y="84" width="243" height="96" rx="10" fill="#ffffff" stroke="#d9d2c0"/>
<circle cx="497" cy="108" r="14" fill="#1f4e5f"/>
<text x="497" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>
<text x="473" y="114" text-anchor="end" font-size="16" font-weight="700" fill="#1f2a37">تحلیل حساسیت</text>
<text x="507" y="146" text-anchor="end" font-size="13" fill="#4b5563">مهم‌ترین فرض‌ها را پیدا کنید</text>
<rect x="20" y="84" width="243" height="96" rx="10" fill="#ffffff" stroke="#d9d2c0"/>
<circle cx="239" cy="108" r="14" fill="#1f4e5f"/>
<text x="239" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3</text>
<text x="215" y="114" text-anchor="end" font-size="16" font-weight="700" fill="#1f2a37">رکود تاریخی</text>
<text x="249" y="146" text-anchor="end" font-size="13" fill="#4b5563">شرایط بحران گذشته را اعمال کنید</text>
<rect x="537" y="196" width="243" height="96" rx="10" fill="#ffffff" stroke="#d9d2c0"/>
<circle cx="756" cy="220" r="14" fill="#1f4e5f"/>
<text x="756" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">4</text>
<text x="732" y="226" text-anchor="end" font-size="16" font-weight="700" fill="#1f2a37">شبیه‌سازی مونت‌کارلو</text>
<text x="766" y="258" text-anchor="end" font-size="13" fill="#4b5563">توزیع نتایج ممکن</text>
<rect x="279" y="196" width="243" height="96" rx="10" fill="#ffffff" stroke="#d9d2c0"/>
<circle cx="497" cy="220" r="14" fill="#1f4e5f"/>
<text x="497" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">5</text>
<text x="473" y="226" text-anchor="end" font-size="16" font-weight="700" fill="#1f2a37">نقطه‌ی سربه‌سر</text>
<text x="507" y="258" text-anchor="end" font-size="13" fill="#4b5563">مرز زیان‌ده‌شدن</text>
<rect x="20" y="196" width="243" height="96" rx="10" fill="#ffffff" stroke="#d9d2c0"/>
<circle cx="239" cy="220" r="14" fill="#1f4e5f"/>
<text x="239" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">6</text>
<text x="215" y="226" text-anchor="end" font-size="16" font-weight="700" fill="#1f2a37">ریسک بیرونی</text>
<text x="249" y="258" text-anchor="end" font-size="13" fill="#4b5563">رویدادهای ژئوپلیتیک و بازار</text>
<rect x="537" y="308" width="243" height="96" rx="10" fill="#ffffff" stroke="#d9d2c0"/>
<circle cx="756" cy="332" r="14" fill="#1f4e5f"/>
<text x="756" y="338" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">7</text>
<text x="732" y="338" text-anchor="end" font-size="16" font-weight="700" fill="#1f2a37">مقایسه با همتایان</text>
<text x="766" y="370" text-anchor="end" font-size="13" fill="#4b5563">محک واقعیت</text>
<rect x="279" y="308" width="243" height="96" rx="10" fill="#ffffff" stroke="#d9d2c0"/>
<circle cx="497" cy="332" r="14" fill="#1f4e5f"/>
<text x="497" y="338" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">8</text>
<text x="473" y="338" text-anchor="end" font-size="16" font-weight="700" fill="#1f2a37">آزمون معکوس</text>
<text x="507" y="370" text-anchor="end" font-size="13" fill="#4b5563">از سناریوی شکست عقب بروید</text>
<rect x="20" y="308" width="243" height="96" rx="10" fill="#ffffff" stroke="#d9d2c0"/>
<circle cx="239" cy="332" r="14" fill="#1f4e5f"/>
<text x="239" y="338" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">9</text>
<text x="215" y="338" text-anchor="end" font-size="16" font-weight="700" fill="#1f2a37">ترکیب روش‌ها</text>
<text x="249" y="370" text-anchor="end" font-size="13" fill="#4b5563">اختلاف نتایج را بررسی کنید</text>
</svg>