<circle cx="730" cy="393" r="15" fill="#2563eb"/><text x="730" y="399" font-size="16" fill="#fff" text-anchor="middle">۶</text>
<text x="700" y="399" font-size="18" text-anchor="start" direction="rtl" fill="#111827">ساخت اسلاید با قالب سازمانی</text>
<text x="60" y="399" font-size="14" text-anchor="end" direction="rtl" fill="#2563eb">قطعی: قفل با فرمول، کد یا اتوماسیون</text>
<rect x="40" y="428" width="720" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<circle cx="730" cy="451" r="15" fill="#2563eb"/><text x="730" y="457" font-size="16" fill="#fff" text-anchor="middle">۷</text>
<text x="700" y="457" font-size="18" text-anchor="start" direction="rtl" fill="#111827">تطبیق اعداد اسلاید با سیستم</text>
<text x="60" y="457" font-size="14" text-anchor="end" direction="rtl" fill="#2563eb">قطعی: قفل با فرمول، کد یا اتوماسیون</text>
<rect x="560" y="496" width="22" height="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="550" y="513" font-size="16" text-anchor="start" direction="rtl" fill="#1f2937">۵ مرحله‌ی قطعی</text>
