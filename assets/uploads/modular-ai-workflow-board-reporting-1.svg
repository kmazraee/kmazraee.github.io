<circle cx="730" cy="335" r="15" fill="#d97706"/><text x="730" y="341" font-size="16" fill="#fff" text-anchor="middle">۵</text>
<text x="700" y="341" font-size="18" text-anchor="start" direction="rtl" fill="#111827">یافتن صورت‌جلسه‌ها و ایمیل‌های مرتبط</text>
<text x="60" y="341" font-size="14" text-anchor="end" direction="rtl" fill="#d97706">قضاوتی: قواعد فکر کردن به مدل</text>
