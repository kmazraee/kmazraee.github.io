<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 264" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="سه سوگیری شناختی و راه مقابله">
<rect width="800" height="264" fill="#faf7f0"/>
<text x="400" y="38" text-anchor="middle" font-size="21" fill="#2b2b2b" font-weight="bold">سه دام تصمیم‌گیری و پادزهر آن‌ها</text>
<rect x="536" y="70" width="240" height="118" rx="12" fill="#e3eaf7" stroke="#4a6fb5" stroke-width="2"/>
<text x="656" y="100" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold">مغالطه‌ی روایت</text>
<text x="656" y="128" text-anchor="middle" font-size="13" fill="#3d3d3d">هر داستانی علت نیست</text>
<text x="656" y="152" text-anchor="middle" font-size="13" fill="#3d3d3d">پادزهر: داده با سازوکار</text>
<rect x="280" y="70" width="240" height="118" rx="12" fill="#e3f0e6" stroke="#5a9a6b" stroke-width="2"/>
<text x="400" y="100" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold">سوگیری تأییدی</text>
<text x="400" y="128" text-anchor="middle" font-size="13" fill="#3d3d3d">فقط شواهد موافق را می‌بینیم</text>
<text x="400" y="152" text-anchor="middle" font-size="13" fill="#3d3d3d">پادزهر: نقش مخالف</text>
<rect x="24" y="70" width="240" height="118" rx="12" fill="#fbeee0" stroke="#c98a3a" stroke-width="2"/>
<text x="144" y="100" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold">دانینگ-کروگر</text>
<text x="144" y="128" text-anchor="middle" font-size="13" fill="#3d3d3d">اطمینان زیاد در حوزه‌ی تازه</text>
<text x="144" y="152" text-anchor="middle" font-size="13" fill="#3d3d3d">پادزهر: تکیه بر داده</text>
<rect x="100" y="204" width="600" height="44" rx="12" fill="#fff" stroke="#2b2b2b" stroke-width="2"/>
<text x="400" y="232" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">قبل از تصمیم بزرگ، پنج دقیقه سؤال بنویسید</text>
</svg>