<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 342" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="چهار نکته‌ی نوشتن روشن: زبان ساده، ویرایش با ابزار، خواندن با صدای بلند و انتشار منظم">
<rect width="800" height="342" fill="#ffffff"/>
<text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">چهار نکته‌ی نوشتن روشن</text>
<rect x="80" y="70" width="640" height="48" rx="10" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400.0" y="101" text-anchor="middle" font-size="18" fill="#1f2937">۱. ساده و کوتاه بنویسید</text>
<rect x="80" y="132" width="640" height="48" rx="10" fill="#e6f6ec" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400.0" y="163" text-anchor="middle" font-size="18" fill="#1f2937">۲. با ابزار ویرایش، خطاها را بگیرید</text>
<rect x="80" y="194" width="640" height="48" rx="10" fill="#fff4e0" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400.0" y="225" text-anchor="middle" font-size="18" fill="#1f2937">۳. متن را با صدای بلند بخوانید</text>
<rect x="80" y="256" width="640" height="48" rx="10" fill="#f3e8fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400.0" y="287" text-anchor="middle" font-size="18" fill="#1f2937">۴. منظم منتشر کنید و بازخورد بگیرید</text>
</svg>
