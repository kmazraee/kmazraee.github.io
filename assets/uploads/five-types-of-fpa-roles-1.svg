<text x="740" y="242" font-size="18" fill="#1e293b" font-weight="700" text-anchor="start" direction="rtl">پروژه‌محور</text>
<text x="545" y="242" font-size="14" fill="#475569" font-weight="400" text-anchor="start" direction="rtl">مثلاً تحول دیجیتال</text>
<rect x="60" y="265" width="700" height="42" rx="8" fill="#ede9fe" stroke="#64748b" stroke-width="1.5"/>
<text x="740" y="292" font-size="18" fill="#1e293b" font-weight="700" text-anchor="start" direction="rtl">کل سود و زیان</text>
<text x="545" y="292" font-size="14" fill="#475569" font-weight="400" text-anchor="start" direction="rtl">رایج در شرکت‌های کوچک</text>
