<text x="545" y="142" font-size="14" fill="#475569" font-weight="400" text-anchor="start" direction="rtl">خلاصه‌سازی برای واحدهای متعدد</text>
<rect x="60" y="165" width="700" height="42" rx="8" fill="#fef3c7" stroke="#64748b" stroke-width="1.5"/>
<text x="740" y="192" font-size="18" fill="#1e293b" font-weight="700" text-anchor="start" direction="rtl">مرکز تخصص</text>
<text x="545" y="192" font-size="14" fill="#475569" font-weight="400" text-anchor="start" direction="rtl">تمرکز عمیق روی یک فعالیت</text>
