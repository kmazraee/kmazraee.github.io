<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-label="پنج نوع نقش FP&amp;A" direction="rtl" font-family="Vazirmatn, Tahoma, 'Noto Naskh Arabic', sans-serif">
<rect width="820" height="330" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="410.0" y="38" font-size="22" fill="#1e293b" font-weight="700" text-anchor="middle" direction="rtl">پنج نوع نقش FP&amp;A</text>
<rect x="60" y="65" width="700" height="42" rx="8" fill="#dbeafe" stroke="#64748b" stroke-width="1.5"/>
<text x="740" y="92" font-size="18" fill="#1e293b" font-weight="700" text-anchor="start" direction="rtl">بخش‌محور</text>
<text x="545" y="92" font-size="14" fill="#475569" font-weight="400" text-anchor="start" direction="rtl">همه‌فن‌حریف؛ رایج در شرکت‌های متوسط و بزرگ</text>
<rect x="60" y="115" width="700" height="42" rx="8" fill="#dcfce7" stroke="#64748b" stroke-width="1.5"/>
