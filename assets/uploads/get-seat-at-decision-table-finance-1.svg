<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 278" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="شش راه رسیدن تیم مالی به میز تصمیم‌گیری">
<rect width="800" height="278" fill="#faf7f0"/>
<text x="400" y="38" text-anchor="middle" font-size="21" fill="#2b2b2b" font-weight="bold">شش راه رسیدن به میز تصمیم</text>
<rect x="536" y="62" width="240" height="138" rx="12" fill="#e3eaf7" stroke="#4a6fb5" stroke-width="2"/>
<text x="656" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">آسان</text>
<text x="656" y="120" text-anchor="middle" font-size="13" fill="#3d3d3d">۱. سابقه عملکرد</text>
<text x="656" y="146" text-anchor="middle" font-size="13" fill="#3d3d3d">۲. تحلیل حساسیت</text>
<rect x="280" y="62" width="240" height="138" rx="12" fill="#e3f0e6" stroke="#5a9a6b" stroke-width="2"/>
<text x="400" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">متوسط</text>
<text x="400" y="120" text-anchor="middle" font-size="13" fill="#3d3d3d">۳. حاشیه محصول</text>
<text x="400" y="146" text-anchor="middle" font-size="13" fill="#3d3d3d">۴. تحلیل رقبا</text>
<text x="400" y="172" text-anchor="middle" font-size="13" fill="#3d3d3d">۵. SWOT</text>
<rect x="24" y="62" width="240" height="138" rx="12" fill="#fbeee0" stroke="#c98a3a" stroke-width="2"/>
<text x="144" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">دشوار</text>
<text x="144" y="120" text-anchor="middle" font-size="13" fill="#3d3d3d">۶. برنامه‌ریزی</text>
<text x="144" y="146" text-anchor="middle" font-size="13" fill="#3d3d3d">سناریو</text>
<rect x="100" y="216" width="600" height="42" rx="12" fill="#fff" stroke="#2b2b2b" stroke-width="2"/>
<text x="400" y="243" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">هر تحلیل مفید، دعوت بعدی را می‌سازد</text>
</svg>
