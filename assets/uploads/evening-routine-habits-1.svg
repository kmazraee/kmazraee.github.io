<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 658" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="نه عادت شبانه شامل برنامه‌ی فردا، آیین پایان کار، ثبت لحظه‌ی زیبا، آماده‌سازی وسایل، شارژ گوشی دور از دسترس و تنفس">
<rect width="800" height="658" fill="#ffffff"/>
<text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">نه عادت شبانه برای روزی بهتر</text>
<rect x="80" y="70" width="640" height="50" rx="10" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="102" text-anchor="middle" font-size="18" fill="#1f2937">۱. برنامه‌ی ۳:۳:۳ فردا را بنویسید</text>
<rect x="80" y="132" width="640" height="50" rx="10" fill="#e6f6ec" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="164" text-anchor="middle" font-size="18" fill="#1f2937">۲. روز کاری را با آیین پایان ببندید</text>
<rect x="80" y="194" width="640" height="50" rx="10" fill="#fff4e0" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="226" text-anchor="middle" font-size="18" fill="#1f2937">۳. یک لحظه‌ی زیبا را یادداشت کنید</text>
<rect x="80" y="256" width="640" height="50" rx="10" fill="#f3e8fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="288" text-anchor="middle" font-size="18" fill="#1f2937">۴. لباس و وسایل فردا را آماده کنید</text>
<rect x="80" y="318" width="640" height="50" rx="10" fill="#fde8e8" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="350" text-anchor="middle" font-size="18" fill="#1f2937">۵. میان‌وعده‌ی سالم بگذارید</text>
<rect x="80" y="380" width="640" height="50" rx="10" fill="#e6f6f6" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="412" text-anchor="middle" font-size="18" fill="#1f2937">۶. گوشی را دور از دسترس شارژ کنید</text>
<rect x="80" y="442" width="640" height="50" rx="10" fill="#fdf2e0" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="474" text-anchor="middle" font-size="18" fill="#1f2937">۷. ظرف‌ها را بشویید</text>
<rect x="80" y="504" width="640" height="50" rx="10" fill="#eef0fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="536" text-anchor="middle" font-size="18" fill="#1f2937">۸. تنفس ۴-۷-۸ را تمرین کنید</text>
<rect x="80" y="566" width="640" height="50" rx="10" fill="#e9f7e0" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="598" text-anchor="middle" font-size="18" fill="#1f2937">۹. یک مسئله را به ذهنتان بسپارید</text>
</svg>
