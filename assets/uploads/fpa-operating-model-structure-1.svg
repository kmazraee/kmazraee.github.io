<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 594" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="لایه‌های مدل مالی عملیاتی از داده‌ی خام تا پنل کنترل">
<rect width="800" height="594" fill="#faf7f0"/>
<text x="400" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b2b2b">هفت لایه‌ی مدل مالی عملیاتی</text>
<rect x="40" y="64" width="720" height="60" rx="12" fill="#fff" stroke="#3d7a8c" stroke-width="2"/>
<circle cx="725" cy="94" r="18" fill="#3d7a8c"/><text x="725" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">۱</text>
<text x="690" y="91" text-anchor="start" font-size="17" font-weight="bold" fill="#3d7a8c">داده‌ی خام</text>
<text x="690" y="112" text-anchor="start" font-size="13.5" fill="#444">خروجی ماهانه‌ی حسابداری بدون دست‌کاری</text>
<rect x="40" y="134" width="720" height="60" rx="12" fill="#fff" stroke="#c98a3d" stroke-width="2"/>
<circle cx="725" cy="164" r="18" fill="#c98a3d"/><text x="725" y="170" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">۲</text>
<text x="690" y="161" text-anchor="start" font-size="17" font-weight="bold" fill="#c98a3d">زیربرنامه‌ها</text>
<text x="690" y="182" text-anchor="start" font-size="13.5" fill="#444">درآمد، کارکنان، مخارج سرمایه‌ای</text>
<rect x="40" y="204" width="720" height="60" rx="12" fill="#fff" stroke="#6a8f4e" stroke-width="2"/>
<circle cx="725" cy="234" r="18" fill="#6a8f4e"/><text x="725" y="240" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">۳</text>
<text x="690" y="231" text-anchor="start" font-size="17" font-weight="bold" fill="#6a8f4e">سود و زیان بخش‌ها</text>
<text x="690" y="252" text-anchor="start" font-size="13.5" fill="#444">بودجه‌ی هر واحد سازمانی</text>
<rect x="40" y="274" width="720" height="60" rx="12" fill="#fff" stroke="#8a5a8c" stroke-width="2"/>
<circle cx="725" cy="304" r="18" fill="#8a5a8c"/><text x="725" y="310" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">۴</text>
<text x="690" y="301" text-anchor="start" font-size="17" font-weight="bold" fill="#8a5a8c">سود و زیان تجمیعی</text>
<text x="690" y="322" text-anchor="start" font-size="13.5" fill="#444">بودجه · واقعی · غلتان · انحراف</text>
<rect x="40" y="344" width="720" height="60" rx="12" fill="#fff" stroke="#b4533c" stroke-width="2"/>
<circle cx="725" cy="374" r="18" fill="#b4533c"/><text x="725" y="380" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">۵</text>
<text x="690" y="371" text-anchor="start" font-size="17" font-weight="bold" fill="#b4533c">مدل سه‌صورته</text>
<text x="690" y="392" text-anchor="start" font-size="13.5" fill="#444">پیش‌بینی نقدینگی و ترازنامه</text>
<rect x="40" y="414" width="720" height="60" rx="12" fill="#fff" stroke="#4a6fa5" stroke-width="2"/>
<circle cx="725" cy="444" r="18" fill="#4a6fa5"/><text x="725" y="450" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">۶</text>
<text x="690" y="441" text-anchor="start" font-size="17" font-weight="bold" fill="#4a6fa5">خلاصه‌های مدیریتی</text>
<text x="690" y="462" text-anchor="start" font-size="13.5" fill="#444">یک‌صفحه‌ای و قابل‌چاپ</text>
<rect x="40" y="484" width="720" height="60" rx="12" fill="#fff" stroke="#7a7a3a" stroke-width="2"/>
<circle cx="725" cy="514" r="18" fill="#7a7a3a"/><text x="725" y="520" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">۷</text>
<text x="690" y="511" text-anchor="start" font-size="17" font-weight="bold" fill="#7a7a3a">پنل کنترل</text>
<text x="690" y="532" text-anchor="start" font-size="13.5" fill="#444">کنترل خطا و تاریخ آخرین واقعی</text>
<text x="400" y="582" text-anchor="middle" font-size="14" fill="#555">جریان اطلاعات: از داده‌ی خام به سمت خلاصه‌ها</text>
</svg>
