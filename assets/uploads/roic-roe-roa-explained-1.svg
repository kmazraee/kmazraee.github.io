<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="مقایسه‌ی ROIC، ROE و ROA: صورت و مخرج هر نسبت و کاربرد آن">
<rect width="800" height="330" fill="#faf7f0"/>
<text x="400" y="36" text-anchor="middle" font-size="22" fill="#2b2b2b" font-weight="bold">سه نسبت بازده در یک نگاه</text>
<rect x="545" y="60" width="235" height="240" rx="14" fill="#fff" stroke="#3d7a8c" stroke-width="2"/><text x="662" y="95" text-anchor="middle" font-size="22" fill="#3d7a8c" font-weight="bold">ROIC</text><text x="662" y="130" text-anchor="middle" font-size="14" fill="#2b2b2b">سود عملیاتی پس از مالیات</text><line x1="570" y1="142" x2="755" y2="142" stroke="#888"/><text x="662" y="165" text-anchor="middle" font-size="14" fill="#2b2b2b">سرمایه‌ی به‌کاررفته</text><text x="662" y="215" text-anchor="middle" font-size="13" fill="#555">کیفیت تخصیص سرمایه</text><text x="662" y="240" text-anchor="middle" font-size="13" fill="#555">مقایسه با WACC</text>
<rect x="283" y="60" width="235" height="240" rx="14" fill="#fff" stroke="#c98a3d" stroke-width="2"/><text x="400" y="95" text-anchor="middle" font-size="22" fill="#c98a3d" font-weight="bold">ROE</text><text x="400" y="130" text-anchor="middle" font-size="14" fill="#2b2b2b">سود خالص</text><line x1="308" y1="142" x2="493" y2="142" stroke="#888"/><text x="400" y="165" text-anchor="middle" font-size="14" fill="#2b2b2b">حقوق صاحبان سهام</text><text x="400" y="215" text-anchor="middle" font-size="13" fill="#555">دید سهام‌دار</text><text x="400" y="240" text-anchor="middle" font-size="13" fill="#555">مراقب بازخرید و بدهی</text>
<rect x="21" y="60" width="235" height="240" rx="14" fill="#fff" stroke="#5a9a6b" stroke-width="2"/><text x="138" y="95" text-anchor="middle" font-size="22" fill="#5a9a6b" font-weight="bold">ROA</text><text x="138" y="130" text-anchor="middle" font-size="14" fill="#2b2b2b">سود (NOPAT)</text><line x1="46" y1="142" x2="231" y2="142" stroke="#888"/><text x="138" y="165" text-anchor="middle" font-size="14" fill="#2b2b2b">کل دارایی‌ها</text><text x="138" y="215" text-anchor="middle" font-size="13" fill="#555">کارایی دارایی‌ها</text><text x="138" y="240" text-anchor="middle" font-size="13" fill="#555">مقایسه با هم‌صنعت‌ها</text>
</svg>
