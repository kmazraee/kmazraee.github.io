<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="نمودار مفهومی: چند سهم برنده بیشترین سهم بازده سبد را می‌سازند و باقی سهم‌ها بازده کمی دارند">
<rect width="800" height="320" fill="#faf7f0"/>
<text x="400" y="36" text-anchor="middle" font-size="21" fill="#2b2b2b" font-weight="bold">چند برنده‌ی بزرگ، بیشتر بازده را می‌سازند</text><line x1="60" y1="260" x2="740" y2="260" stroke="#2b2b2b" stroke-width="2"/><rect x="700" y="246.0" width="34" height="14.0" fill="#b7c2d9" rx="3"/><rect x="648" y="240.4" width="34" height="19.599999999999998" fill="#b7c2d9" rx="3"/><rect x="596" y="248.8" width="34" height="11.2" fill="#b7c2d9" rx="3"/><rect x="544" y="243.2" width="34" height="16.799999999999997" fill="#b7c2d9" rx="3"/><rect x="492" y="232.0" width="34" height="28.0" fill="#b7c2d9" rx="3"/><rect x="440" y="247.4" width="34" height="12.6" fill="#b7c2d9" rx="3"/><rect x="388" y="60" width="34" height="200" fill="#5a9a6b" rx="3"/><rect x="336" y="244.6" width="34" height="15.399999999999999" fill="#b7c2d9" rx="3"/><rect x="284" y="237.6" width="34" height="22.4" fill="#b7c2d9" rx="3"/><rect x="232" y="250.2" width="34" height="9.799999999999999" fill="#b7c2d9" rx="3"/><rect x="180" y="120.0" width="34" height="140.0" fill="#5a9a6b" rx="3"/><rect x="128" y="241.8" width="34" height="18.2" fill="#b7c2d9" rx="3"/><text x="400" y="290" text-anchor="middle" font-size="13" fill="#2b2b2b">هر ستون یک سهم در سبد (مثال مفهومی، نه داده‌ی واقعی)</text><text x="560" y="82" text-anchor="middle" font-size="15" fill="#5a9a6b" font-weight="bold">دو برنده‌ی بزرگ</text>
</svg>
