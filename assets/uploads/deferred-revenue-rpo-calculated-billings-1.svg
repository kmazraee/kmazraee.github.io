<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="sans-serif">
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="36" direction="rtl" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">جدول آبشاری درآمد معوق (میلیون دلار)</text>
  <line x1="60" y1="360" x2="740" y2="360" stroke="#9ca3af" stroke-width="1.5"/>
  <!-- start -->
  <rect x="600" y="312" width="110" height="48" fill="#64748b"/>
  <text x="655" y="302" direction="rtl" text-anchor="middle" font-size="18" fill="#1f2937">۶</text>
  <text x="655" y="388" direction="rtl" text-anchor="middle" font-size="16" fill="#374151">مانده‌ی اول سال</text>
  <!-- billed -->
  <line x1="710" y1="312" x2="540" y2="312" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <rect x="430" y="72" width="110" height="240" fill="#16a34a"/>
  <text x="485" y="62" direction="rtl" text-anchor="middle" font-size="18" fill="#1f2937">&#x2066;+۳۰&#x2069;</text>
  <text x="485" y="388" direction="rtl" text-anchor="middle" font-size="16" fill="#374151">صورتحساب سال</text>
  <!-- recognized -->
  <line x1="540" y1="72" x2="370" y2="72" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <rect x="260" y="72" width="110" height="192" fill="#dc2626"/>
  <text x="315" y="290" direction="rtl" text-anchor="middle" font-size="18" fill="#1f2937">&#x2066;−۲۴&#x2069;</text>
  <text x="315" y="388" direction="rtl" text-anchor="middle" font-size="16" fill="#374151">شناسایی درآمد</text>
  <!-- end -->
  <line x1="370" y1="264" x2="200" y2="264" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <rect x="90" y="264" width="110" height="96" fill="#2563eb"/>
  <text x="145" y="254" direction="rtl" text-anchor="middle" font-size="18" fill="#1f2937">۱۲</text>
  <text x="145" y="388" direction="rtl" text-anchor="middle" font-size="16" fill="#374151">مانده‌ی پایان سال</text>
  <text x="400" y="430" direction="rtl" text-anchor="middle" font-size="15" fill="#4b5563">صورتحساب محاسبه‌شده: درآمد ۲۴ به‌علاوه‌ی افزایش ۶ در درآمد معوق، برابر ۳۰</text>
</svg>
