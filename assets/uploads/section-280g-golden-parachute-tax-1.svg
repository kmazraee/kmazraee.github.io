<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" font-family="sans-serif">
  <rect width="800" height="420" fill="#ffffff"/>
  <text x="400" y="38" text-anchor="middle" direction="rtl" font-size="22" font-weight="bold" fill="#1f2937">پرداخت‌های چتر نجات در برابر آستانه‌ی ۲۸۰G (هزار دلار)</text>
  <!-- axis: x from 80 (0) to 740 (2400) => 0.275 px per K -->
  <line x1="80" y1="300" x2="740" y2="300" stroke="#9ca3af"/>
  <g font-size="14" fill="#6b7280" text-anchor="middle">
    <text x="80" y="322">۰</text><text x="245" y="322">۶۰۰</text><text x="410" y="322">۱٬۲۰۰</text><text x="575" y="322">۱٬۸۰۰</text><text x="740" y="322">۲٬۴۰۰</text>
  </g>
  <!-- row 1: base -->
  <text x="740" y="88" text-anchor="start" direction="rtl" font-size="16" fill="#1f2937">مبلغ پایه (میانگین پنج‌ساله)</text>
  <rect x="80" y="98" width="110" height="34" fill="#3b82f6" rx="3"/>
  <text x="200" y="121" font-size="15" fill="#1f2937">۴۰۰</text>
  <!-- row 2: total payments stacked -->
  <text x="740" y="172" text-anchor="start" direction="rtl" font-size="16" fill="#1f2937">جمع پرداخت‌های وابسته به معامله</text>
  <rect x="80" y="182" width="110" height="40" fill="#3b82f6" rx="3"/>
  <rect x="190" y="182" width="550" height="40" fill="#ef4444" rx="3"/>
  <text x="580" y="208" text-anchor="middle" direction="rtl" font-size="15" fill="#ffffff" font-weight="bold">مازاد مشمول ۲۰٪: ۲٬۰۰۰ ← مالیات ۴۰۰</text>
  <text x="135" y="208" text-anchor="middle" font-size="14" fill="#ffffff">۴۰۰</text>
  <!-- threshold line -->
  <line x1="410" y1="70" x2="410" y2="300" stroke="#111827" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="420" y="262" text-anchor="end" direction="rtl" font-size="15" fill="#111827">آستانه = ۳ × مبلغ پایه = ۱٬۲۰۰</text>
  <!-- legend -->
  <rect x="560" y="352" width="16" height="16" fill="#3b82f6"/>
  <text x="550" y="365" text-anchor="start" direction="rtl" font-size="14" fill="#374151">یک برابر مبلغ پایه (معاف)</text>
  <rect x="300" y="352" width="16" height="16" fill="#ef4444"/>
  <text x="290" y="365" text-anchor="start" direction="rtl" font-size="14" fill="#374151">پرداخت مازاد</text>
  <text x="400" y="400" text-anchor="middle" direction="rtl" font-size="13" fill="#6b7280">با عبور از آستانه، مازاد نسبت به یک برابر مبلغ پایه سنجیده می‌شود، نه سه برابر</text>
</svg>
