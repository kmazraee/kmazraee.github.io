<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-label="شش گام کاهش تعارض فروش و مالی" direction="rtl" font-family="Vazirmatn, Tahoma, 'Noto Naskh Arabic', sans-serif">
<rect width="820" height="330" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="410" y="38" font-size="22" fill="#1e293b" font-weight="700" text-anchor="middle" direction="rtl">شش گام کاهش تعارض فروش و مالی</text>
<rect x="60" y="55" width="700" height="38" rx="8" fill="#dbeafe" stroke="#64748b"/>
<text x="742" y="80" font-size="17" fill="#1e293b" font-weight="700" text-anchor="start" direction="rtl">۱</text>
<text x="710" y="80" font-size="16" fill="#1e293b" font-weight="700" text-anchor="start" direction="rtl">نقشه‌ی تعارض</text>
<text x="540" y="80" font-size="13" fill="#475569" font-weight="400" text-anchor="start" direction="rtl">فهرست نقاط اصطکاک و امتیاز شدت</text>
<rect x="60" y="99" width="700" height="38" rx="8" fill="#dcfce7" stroke="#64748b"/>
<text x="742" y="124" font-size="17" fill="#1e293b" font-weight="700" text-anchor="start" direction="rtl">۲</text>
<text x="710" y="124" font-size="16" fill="#1e293b" font-weight="700" text-anchor="start" direction="rtl">شاخص‌های مشترک</text>
<text x="540" y="124" font-size="13" fill="#475569" font-weight="400" text-anchor="start" direction="rtl">تعریف مشترک معامله‌ی خوب</text>
<rect x="60" y="143" width="700" height="38" rx="8" fill="#fef3c7" stroke="#64748b"/>
<text x="742" y="168" font-size="17" fill="#1e293b" font-weight="700" text-anchor="start" direction="rtl">۳</text>
<text x="710" y="168" font-size="16" fill="#1e293b" font-weight="700" text-anchor="start" direction="rtl">سقف اعتبار</text>
<text x="540" y="168" font-size="13" fill="#475569" font-weight="400" text-anchor="start" direction="rtl">امتیازدهی ریسک به‌جای چانه‌زنی</text>
<rect x="60" y="187" width="700" height="38" rx="8" fill="#fee2e2" stroke="#64748b"/>
<text x="742" y="212" font-size="17" fill="#1e293b" font-weight="700" text-anchor="start" direction="rtl">۴</text>
<text x="710" y="212" font-size="16" fill="#1e293b" font-weight="700" text-anchor="start" direction="rtl">شرایط پرداخت</text>
<text x="540" y="212" font-size="13" fill="#475569" font-weight="400" text-anchor="start" direction="rtl">قیمت‌گذاری هزینه‌ی هر انحراف</text>
<rect x="60" y="231" width="700" height="38" rx="8" fill="#ede9fe" stroke="#64748b"/>
<text x="742" y="256" font-size="17" fill="#1e293b" font-weight="700" text-anchor="start" direction="rtl">۵</text>
<text x="710" y="256" font-size="16" fill="#1e293b" font-weight="700" text-anchor="start" direction="rtl">پاداش وزن‌دار</text>
<text x="540" y="256" font-size="13" fill="#475569" font-weight="400" text-anchor="start" direction="rtl">حجم، حاشیه، وصول نقد و رعایت قواعد</text>
<rect x="60" y="275" width="700" height="38" rx="8" fill="#e2e8f0" stroke="#64748b"/>
<text x="742" y="300" font-size="17" fill="#1e293b" font-weight="700" text-anchor="start" direction="rtl">۶</text>
<text x="710" y="300" font-size="16" fill="#1e293b" font-weight="700" text-anchor="start" direction="rtl">برنامه‌ی اجرایی</text>
<text x="540" y="300" font-size="13" fill="#475569" font-weight="400" text-anchor="start" direction="rtl">مالک، تاریخ و ترتیب اجرا</text>
</svg>
