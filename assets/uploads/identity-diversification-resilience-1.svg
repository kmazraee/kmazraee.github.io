<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="هویت تک‌بعدی در برابر هویت چندبعدی">
<rect width="800" height="400" fill="#ffffff"/>
<text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">هویت تک‌بعدی در برابر هویت چندبعدی</text>
<rect x="80" y="70" width="640" height="50" rx="10" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="102" text-anchor="middle" font-size="18" fill="#1f2937">هویت تک‌بعدی: همه‌چیز روی یک نقش، شکننده</text>
<rect x="80" y="132" width="640" height="50" rx="10" fill="#e6f6ec" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="164" text-anchor="middle" font-size="18" fill="#1f2937">هویت چندبعدی: شغل، خانواده، سرگرمی، جامعه</text>
<rect x="80" y="194" width="640" height="50" rx="10" fill="#fff4e0" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="226" text-anchor="middle" font-size="18" fill="#1f2937">گام ۱: ابزار بنویسید</text>
<rect x="80" y="256" width="640" height="50" rx="10" fill="#f3e8fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="288" text-anchor="middle" font-size="18" fill="#1f2937">گام ۲: خودشناسی با پرسش‌های راهنما</text>
<rect x="80" y="318" width="640" height="50" rx="10" fill="#fde8e8" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="350" text-anchor="middle" font-size="18" fill="#1f2937">گام ۳: قدم‌های کوچک و بازبینی دوره‌ای</text>
</svg>
