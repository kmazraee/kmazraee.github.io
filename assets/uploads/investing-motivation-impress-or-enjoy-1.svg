<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="دو انگیزه‌ی متفاوت برای مسیر استقلال مالی">
  <rect width="800" height="340" fill="#faf7f0"/>
  <text x="400" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#2b2b2b">یک مسیر، دو انگیزه‌ی متفاوت</text>
  <rect x="420" y="70" width="340" height="205" rx="14" fill="#fbe9e7" stroke="#c0675b" stroke-width="2"/>
  <text x="590" y="106" text-anchor="middle" font-size="21" font-weight="bold" fill="#7a2a20">انگیزه‌ی بیرونی: تأیید دیگران</text>
  <text x="590" y="146" text-anchor="middle" font-size="16" fill="#3d3d3d">مقایسه‌ی دائمی با اطرافیان</text>
  <text x="590" y="176" text-anchor="middle" font-size="16" fill="#3d3d3d">هدف مدام جابه‌جا می‌شود</text>
  <text x="590" y="206" text-anchor="middle" font-size="16" fill="#3d3d3d">ترس از دیده‌شدن اشتباه‌ها</text>
  <text x="590" y="250" text-anchor="middle" font-size="15" fill="#7a2a20">تجربه‌ی درونی: خسته‌کننده</text>
  <rect x="40" y="70" width="340" height="205" rx="14" fill="#e3f0e6" stroke="#5a9a6b" stroke-width="2"/>
  <text x="210" y="106" text-anchor="middle" font-size="21" font-weight="bold" fill="#2b4a33">انگیزه‌ی درونی: لذت زندگی</text>
  <text x="210" y="146" text-anchor="middle" font-size="16" fill="#3d3d3d">آزادی انتخاب و زمان با عزیزان</text>
  <text x="210" y="176" text-anchor="middle" font-size="16" fill="#3d3d3d">لذت یادگیری و تصمیم خوب</text>
  <text x="210" y="206" text-anchor="middle" font-size="16" fill="#3d3d3d">مقایسه با «خودِ پارسال»</text>
  <text x="210" y="250" text-anchor="middle" font-size="15" fill="#2b4a33">تجربه‌ی درونی: پرمعنا</text>
  <text x="400" y="312" text-anchor="middle" font-size="16" fill="#6a5a3a">از بیرون یکسان‌اند؛ از درون کاملاً متفاوت.</text>
</svg>
