<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 224" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="سه کار برای افزایش ایمنی روانی و بهبود دقت پیش‌بینی">
<rect width="800" height="224" fill="#faf7f0"/>
<text x="400" y="38" text-anchor="middle" font-size="21" fill="#2b2b2b" font-weight="bold">ایمنی روانی و دقت پیش‌بینی</text>
<rect x="533.3" y="62" width="242.7" height="138" rx="12" fill="#e3eaf7" stroke="#4a6fb5" stroke-width="2"/>
<text x="654.7" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">۱. فرایند را ببینید</text>
<text x="654.7" y="124" text-anchor="middle" font-size="13" fill="#3d3d3d">به‌جای مقصریابی</text>
<text x="654.7" y="150" text-anchor="middle" font-size="13" fill="#3d3d3d">علت ریشه‌ای را</text>
<text x="654.7" y="176" text-anchor="middle" font-size="13" fill="#3d3d3d">بیابید</text>
<rect x="278.7" y="62" width="242.7" height="138" rx="12" fill="#e3f0e6" stroke="#5a9a6b" stroke-width="2"/>
<text x="400.0" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">۲. اشتباه را جشن بگیرید</text>
<text x="400.0" y="124" text-anchor="middle" font-size="13" fill="#3d3d3d">اشتراک خطا</text>
<text x="400.0" y="150" text-anchor="middle" font-size="13" fill="#3d3d3d">باید پاداش</text>
<text x="400.0" y="176" text-anchor="middle" font-size="13" fill="#3d3d3d">داشته باشد</text>
<rect x="24.0" y="62" width="242.7" height="138" rx="12" fill="#fbeee0" stroke="#c98a3a" stroke-width="2"/>
<text x="145.3" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">۳. اشتباه خودتان</text>
<text x="145.3" y="124" text-anchor="middle" font-size="13" fill="#3d3d3d">را علنی بپذیرید</text>
<text x="145.3" y="150" text-anchor="middle" font-size="13" fill="#3d3d3d">و ذهنیت رشد</text>
<text x="145.3" y="176" text-anchor="middle" font-size="13" fill="#3d3d3d">نشان دهید</text>
</svg>
