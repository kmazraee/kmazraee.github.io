<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="ارتباط سه صورت مالی">
<rect width="800" height="310" fill="#faf7f0"/>
<text x="400" y="38" text-anchor="middle" font-size="22" fill="#2b2b2b" font-weight="bold">سه صورت مالی چطور به هم وصل‌اند؟</text><rect x="560" y="80" width="220" height="150" rx="12" fill="#fbeedd" stroke="#c98a3d" stroke-width="2"/><text x="670" y="118" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold">صورت سود و زیان</text><text x="670" y="150" text-anchor="middle" font-size="15" fill="#3d3d3d">فیلم یک دوره</text><text x="670" y="188" text-anchor="middle" font-size="13" fill="#555">پایین: سود خالص</text><path d="M548 155 L520 155 M520 155 l10 -8 M520 155 l10 8" stroke="#2b2b2b" stroke-width="3" fill="none"/><rect x="300" y="80" width="220" height="150" rx="12" fill="#e3eaf7" stroke="#4a6fb5" stroke-width="2"/><text x="410" y="118" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold">صورت جریان نقد</text><text x="410" y="150" text-anchor="middle" font-size="15" fill="#3d3d3d">حساب بانکی شرکت</text><text x="410" y="188" text-anchor="middle" font-size="13" fill="#555">شروع از سود خالص، پایان با نقد</text><path d="M288 155 L260 155 M260 155 l10 -8 M260 155 l10 8" stroke="#2b2b2b" stroke-width="3" fill="none"/><rect x="40" y="80" width="220" height="150" rx="12" fill="#e3f0e6" stroke="#5a9a6b" stroke-width="2"/><text x="150" y="118" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold">ترازنامه</text><text x="150" y="150" text-anchor="middle" font-size="15" fill="#3d3d3d">عکس فوری ثروت</text><text x="150" y="188" text-anchor="middle" font-size="13" fill="#555">بالا: نقد و معادل نقد</text><text x="400" y="275" text-anchor="middle" font-size="15" fill="#3d3d3d">سود خالص ← جریان نقد عملیاتی ← نقد پایان دوره ← ردیف نقد در ترازنامه</text>
</svg>
