<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="نُه عادت مناطق آبی">
<rect width="800" height="400" fill="#ffffff"/>
<text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">نُه عادت مناطق آبی</text>
<rect x="529" y="70" width="231" height="91" rx="10" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="644.5" y="121.5" text-anchor="middle" font-size="16" fill="#1f2937">طبیعی حرکت کنید</text>
<rect x="285" y="70" width="231" height="91" rx="10" fill="#e6f6ec" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400.5" y="121.5" text-anchor="middle" font-size="16" fill="#1f2937">هدف داشته باشید</text>
<rect x="40" y="70" width="231" height="91" rx="10" fill="#fff4e0" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="155.5" y="121.5" text-anchor="middle" font-size="16" fill="#1f2937">هر روز آرام شوید</text>
<rect x="529" y="175" width="231" height="91" rx="10" fill="#f3e8fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="644.5" y="226.5" text-anchor="middle" font-size="16" fill="#1f2937">قاعده‌ی ۸۰ درصد سیری</text>
<rect x="285" y="175" width="231" height="91" rx="10" fill="#fde8e8" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400.5" y="226.5" text-anchor="middle" font-size="16" fill="#1f2937">بیشتر گیاه بخورید</text>
<rect x="40" y="175" width="231" height="91" rx="10" fill="#e0f4f4" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="155.5" y="226.5" text-anchor="middle" font-size="16" fill="#1f2937">اعتدال در نوشیدنی و غذا</text>
<rect x="529" y="279" width="231" height="91" rx="10" fill="#fef9e0" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="644.5" y="330.5" text-anchor="middle" font-size="16" fill="#1f2937">به جمعی تعلق داشته باشید</text>
<rect x="285" y="279" width="231" height="91" rx="10" fill="#eaeaf8" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400.5" y="330.5" text-anchor="middle" font-size="16" fill="#1f2937">خانواده در اولویت</text>
<rect x="40" y="279" width="231" height="91" rx="10" fill="#f1e6e0" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="155.5" y="330.5" text-anchor="middle" font-size="16" fill="#1f2937">قبیله‌ی سالم بسازید</text>
</svg>
