<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" direction="rtl" font-family="Vazirmatn, Tahoma, 'DejaVu Sans', sans-serif" role="img" aria-label="سه گروه هزینه نرم‌افزار: کوچک، میانی و زیرساختی">
<rect width="800" height="420" rx="18" fill="#ffffff"/>
<rect x="8" y="8" width="784" height="404" rx="14" fill="none" stroke="#d5dee8" stroke-width="2"/>
<text x="400" y="74" text-anchor="middle" font-size="28" font-weight="700" fill="#16324f">کدام قرارداد نرم‌افزاری اول بررسی می‌شود؟</text>
<line x1="260" y1="94" x2="540" y2="94" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round"/>
<rect x="552" y="130" width="212" height="210" rx="14" fill="#e9f7ef" stroke="#2f855a" stroke-width="2"/>
<text x="658" y="178" text-anchor="middle" font-size="20" font-weight="700" fill="#16324f">قراردادهای کوچک</text>
<text x="658" y="212" text-anchor="middle" font-size="15" fill="#3d566e">چند هزار دلار در سال</text>
<text x="658" y="262" text-anchor="middle" font-size="15" fill="#3d566e">اثر کم بر سود و زیان</text>
<text x="658" y="292" text-anchor="middle" font-size="15" font-weight="700" fill="#2f855a">معمولاً می‌مانند</text>
<rect x="294" y="130" width="212" height="210" rx="14" fill="#fff4e0" stroke="#c27803" stroke-width="2"/>
<text x="400" y="178" text-anchor="middle" font-size="20" font-weight="700" fill="#16324f">قراردادهای میانی</text>
<text x="400" y="212" text-anchor="middle" font-size="15" fill="#3d566e">ده‌ها هزار دلار در سال</text>
<text x="400" y="262" text-anchor="middle" font-size="15" fill="#3d566e">اثر محسوس، آسیب کم</text>
<text x="400" y="292" text-anchor="middle" font-size="15" font-weight="700" fill="#c27803">هدف اصلی کاهش</text>
<rect x="36" y="130" width="212" height="210" rx="14" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="2"/>
<text x="142" y="178" text-anchor="middle" font-size="20" font-weight="700" fill="#16324f">زیرساخت اصلی</text>
<text x="142" y="212" text-anchor="middle" font-size="15" fill="#3d566e">صدها هزار دلار در سال</text>
<text x="142" y="262" text-anchor="middle" font-size="15" fill="#3d566e">جایگزینی پرهزینه و پرریسک</text>
<text x="142" y="292" text-anchor="middle" font-size="15" font-weight="700" fill="#2b6cb0">دست‌نخورده می‌مانند</text>
<text x="400" y="382" text-anchor="middle" font-size="14" fill="#718096">ارقام نمونه و تقریبی برای توضیح منطق‌اند</text>
</svg>
