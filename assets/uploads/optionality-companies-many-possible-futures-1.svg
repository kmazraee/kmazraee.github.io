<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 246" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="شکست‌های پرهزینه در برابر برد بزرگ">
<rect width="880" height="246" fill="#faf7f0"/>
<text x="440.0" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b2b2b">آپشن‌پذیری: ریسک و پاداش</text>
<rect x="589" y="70" width="267" height="150" rx="12" fill="#fff" stroke="#b5524a" stroke-width="2"/>
<rect x="589" y="70" width="267" height="38" rx="12" fill="#b5524a"/><rect x="589" y="96" width="267" height="12" fill="#b5524a"/>
<text x="723" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">شکست پرهزینه</text>
<text x="723" y="138" text-anchor="middle" font-size="14" fill="#2b2b2b">یک بخش جانبی: بیش از</text>
<text x="723" y="164" text-anchor="middle" font-size="14" fill="#2b2b2b">۳۰ میلیارد دلار ضرر</text>
<text x="723" y="190" text-anchor="middle" font-size="14" fill="#2b2b2b">در شش سال</text>
<rect x="307" y="70" width="267" height="150" rx="12" fill="#fff" stroke="#c98a3d" stroke-width="2"/>
<rect x="307" y="70" width="267" height="38" rx="12" fill="#c98a3d"/><rect x="307" y="96" width="267" height="12" fill="#c98a3d"/>
<text x="440" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">پروژه‌ی لغوشده</text>
<text x="440" y="138" text-anchor="middle" font-size="14" fill="#2b2b2b">گوشی هوشمند (۲۰۱۴)</text>
<text x="440" y="164" text-anchor="middle" font-size="14" fill="#2b2b2b">پروژه‌ی خودرو (۲۰۲۴)</text>
<text x="440" y="190" text-anchor="middle" font-size="14" fill="#2b2b2b">هزینه‌ی سال‌ها تحقیق</text>
<rect x="24" y="70" width="267" height="150" rx="12" fill="#fff" stroke="#5a9a6b" stroke-width="2"/>
<rect x="24" y="70" width="267" height="38" rx="12" fill="#5a9a6b"/><rect x="24" y="96" width="267" height="12" fill="#5a9a6b"/>
<text x="157" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">برد بزرگ</text>
<text x="157" y="138" text-anchor="middle" font-size="14" fill="#2b2b2b">رایانش ابری: حدود دو سوم</text>
<text x="157" y="164" text-anchor="middle" font-size="14" fill="#2b2b2b">سود عملیاتی شرکت مادر</text>
<text x="157" y="190" text-anchor="middle" font-size="14" fill="#2b2b2b">از تیمی ۵۷ نفره شروع شد</text>
</svg>