<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="چهار دلیل موجه و دو بهانه‌ی غلط برای فروش سهم">
<rect width="880" height="372" fill="#faf7f0"/>
<text x="440.0" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b2b2b">چه زمانی سهم را بفروشیم؟</text>
<rect x="589" y="70" width="267" height="130" rx="12" fill="#fff" stroke="#5a9a6b" stroke-width="2"/>
<rect x="589" y="70" width="267" height="38" rx="12" fill="#5a9a6b"/><rect x="589" y="96" width="267" height="12" fill="#5a9a6b"/>
<text x="723" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">فرضیه غلط بود</text>
<text x="723" y="138" text-anchor="middle" font-size="14" fill="#2b2b2b">اشتباه کرده‌اید</text>
<text x="723" y="164" text-anchor="middle" font-size="14" fill="#2b2b2b">و واقعیت نمی‌خواند</text>
<rect x="307" y="70" width="267" height="130" rx="12" fill="#fff" stroke="#5a9a6b" stroke-width="2"/>
<rect x="307" y="70" width="267" height="38" rx="12" fill="#5a9a6b"/><rect x="307" y="96" width="267" height="12" fill="#5a9a6b"/>
<text x="440" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">شرایط عوض شد</text>
<text x="440" y="138" text-anchor="middle" font-size="14" fill="#2b2b2b">فناوری یا بازار</text>
<text x="440" y="164" text-anchor="middle" font-size="14" fill="#2b2b2b">فرضیه را منسوخ کرد</text>
<rect x="24" y="70" width="267" height="130" rx="12" fill="#fff" stroke="#5a9a6b" stroke-width="2"/>
<rect x="24" y="70" width="267" height="38" rx="12" fill="#5a9a6b"/><rect x="24" y="96" width="267" height="12" fill="#5a9a6b"/>
<text x="157" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">فرصت بهتر</text>
<text x="157" y="138" text-anchor="middle" font-size="14" fill="#2b2b2b">دو تصمیم درست لازم است</text>
<text x="157" y="164" text-anchor="middle" font-size="14" fill="#2b2b2b">فروش تدریجی بهتر است</text>
<rect x="589" y="216" width="267" height="130" rx="12" fill="#fff" stroke="#5a9a6b" stroke-width="2"/>
<rect x="589" y="216" width="267" height="38" rx="12" fill="#5a9a6b"/><rect x="589" y="242" width="267" height="12" fill="#5a9a6b"/>
<text x="723" y="241" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">نیاز به پول</text>
<text x="723" y="284" text-anchor="middle" font-size="14" fill="#2b2b2b">رویدادهای زندگی</text>
<text x="723" y="310" text-anchor="middle" font-size="14" fill="#2b2b2b">دلیل خوبی هستند</text>
<rect x="307" y="216" width="267" height="130" rx="12" fill="#fff" stroke="#b5524a" stroke-width="2"/>
<rect x="307" y="216" width="267" height="38" rx="12" fill="#b5524a"/><rect x="307" y="242" width="267" height="12" fill="#b5524a"/>
<text x="440" y="241" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">بهانه: بازار اصلاح می‌شود</text>
<text x="440" y="284" text-anchor="middle" font-size="14" fill="#2b2b2b">پیش‌بینی‌ناپذیر است</text>
<text x="440" y="310" text-anchor="middle" font-size="14" fill="#2b2b2b">و مالیات هم دارد</text>
<rect x="24" y="216" width="267" height="130" rx="12" fill="#fff" stroke="#b5524a" stroke-width="2"/>
<rect x="24" y="216" width="267" height="38" rx="12" fill="#b5524a"/><rect x="24" y="242" width="267" height="12" fill="#b5524a"/>
<text x="157" y="241" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">بهانه: خیلی بالا رفته</text>
<text x="157" y="284" text-anchor="middle" font-size="14" fill="#2b2b2b">برنده‌ها معمولاً</text>
<text x="157" y="310" text-anchor="middle" font-size="14" fill="#2b2b2b">به برنده‌شدن ادامه می‌دهند</text>
</svg>