<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 286" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="سه مدل ذهنی منگر برای تصمیم‌گیری: اصل پارتو، مغالطه‌ی هزینه‌ی هدررفته و قانون پارکینسون">
<rect width="800" height="286" fill="#ffffff"/>
<text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">سه مدل ذهنی برای تصمیم بهتر</text>
<rect x="80" y="70" width="640" height="50" rx="10" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="102" text-anchor="middle" font-size="18" fill="#1f2937">۱. اصل پارتو: ۲۰٪ علت، ۸۰٪ نتیجه</text>
<rect x="80" y="132" width="640" height="50" rx="10" fill="#e6f6ec" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="164" text-anchor="middle" font-size="18" fill="#1f2937">۲. مغالطه‌ی هزینه‌ی هدررفته: به آینده نگاه کنید</text>
<rect x="80" y="194" width="640" height="50" rx="10" fill="#fff4e0" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400" y="226" text-anchor="middle" font-size="18" fill="#1f2937">۳. قانون پارکینسون: کار با زمان متورم می‌شود</text>
</svg>
