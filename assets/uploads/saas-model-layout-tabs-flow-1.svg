<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="جریان اطلاعات در مدل مالی SaaS میان تب خلاصه و مفروضات و تب‌های محاسباتی">
