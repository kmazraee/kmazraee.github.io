<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-label="دو مرحله‌ی ثروت و دو صندوق" direction="rtl" font-family="Vazirmatn, Tahoma, 'Noto Naskh Arabic', sans-serif">
<rect width="820" height="330" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="410.0" y="38" font-size="22" fill="#1e293b" font-weight="700" text-anchor="middle" direction="rtl">دو مرحله، دو صندوق</text>
<rect x="60" y="65" width="700" height="52" rx="8" fill="#dcfce7" stroke="#64748b" stroke-width="1.5"/>
<text x="740" y="88" font-size="18" fill="#1e293b" font-weight="700" text-anchor="start" direction="rtl">مرحله‌ی ثروت‌سازی</text>
<text x="740" y="108" font-size="14" fill="#475569" text-anchor="start" direction="rtl">تمرکز بر رشد؛ سهم بیشتر برای صندوق شاخصی سهام</text>
<rect x="60" y="127" width="700" height="52" rx="8" fill="#dbeafe" stroke="#64748b" stroke-width="1.5"/>
<text x="740" y="150" font-size="18" fill="#1e293b" font-weight="700" text-anchor="start" direction="rtl">مرحله‌ی حفظ ثروت</text>
<text x="740" y="170" font-size="14" fill="#475569" text-anchor="start" direction="rtl">تمرکز بر ثبات؛ سهم بیشتر برای صندوق اوراق بدهی</text>
<rect x="60" y="189" width="700" height="52" rx="8" fill="#fef3c7" stroke="#64748b" stroke-width="1.5"/>
<text x="740" y="212" font-size="18" fill="#1e293b" font-weight="700" text-anchor="start" direction="rtl">ترکیب دو مرحله</text>
<text x="740" y="232" font-size="14" fill="#475569" text-anchor="start" direction="rtl">نسبت را با تلاش مورد نظر و تحمل ریسک تنظیم کنید</text>
</svg>
