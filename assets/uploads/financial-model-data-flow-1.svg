<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" direction="rtl" role="img"><rect width="900" height="420" fill="#ffffff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#44546a"/></marker></defs><text x="450" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#1b2a3a" font-family="Vazirmatn, Tahoma, Arial, sans-serif">جریان داده در مدل مالی: ورودی ← محاسبه ← خروجی</text><rect x="650" y="90" width="220" height="130" rx="12" fill="#e8f0fe" stroke="#4a74c9" stroke-width="2"/><text x="760.0" y="135.3" text-anchor="middle" font-size="18" font-weight="700" fill="#1b2a3a" font-family="Vazirmatn, Tahoma, Arial, sans-serif">ورودی</text><text x="760.0" y="161.3" text-anchor="middle" font-size="18" font-weight="400" fill="#1b2a3a" font-family="Vazirmatn, Tahoma, Arial, sans-serif">داده‌های واقعی</text><text x="760.0" y="187.3" text-anchor="middle" font-size="18" font-weight="400" fill="#1b2a3a" font-family="Vazirmatn, Tahoma, Arial, sans-serif">(سابقه‌ی دوره‌های گذشته)</text><rect x="340" y="90" width="220" height="130" rx="12" fill="#fff7d6" stroke="#c9a227" stroke-width="2"/><text x="450.0" y="135.3" text-anchor="middle" font-size="18" font-weight="700" fill="#1b2a3a" font-family="Vazirmatn, Tahoma, Arial, sans-serif">محاسبه</text><text x="450.0" y="161.3" text-anchor="middle" font-size="18" font-weight="400" fill="#1b2a3a" font-family="Vazirmatn, Tahoma, Arial, sans-serif">برنامه‌های پشتیبان</text><text x="450.0" y="187.3" text-anchor="middle" font-size="18" font-weight="400" fill="#1b2a3a" font-family="Vazirmatn, Tahoma, Arial, sans-serif">و مدل سه صورت مالی</text><rect x="30" y="90" width="220" height="130" rx="12" fill="#e3f6e8" stroke="#3f9b5a" stroke-width="2"/><text x="140.0" y="135.3" text-anchor="middle" font-size="18" font-weight="700" fill="#1b2a3a" font-family="Vazirmatn, Tahoma, Arial, sans-serif">خروجی</text><text x="140.0" y="161.3