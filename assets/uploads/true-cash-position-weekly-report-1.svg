<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" width="720" height="390" direction="rtl" font-family="Tahoma, sans-serif">
<rect width="720" height="390" fill="#ffffff"/>
<text x="700" y="30" text-anchor="start" font-size="18" font-weight="bold" fill="#1f2937">از مانده‌ی بانک تا موجودی نقد واقعی (واحد پولی)</text>
<g transform="translate(0,30)">
<line x1="40" y1="300" x2="700" y2="300" stroke="#9ca3af"/>
<!-- scale: 0.5 px per unit; base y=300 -->
<rect x="590" y="50" width="90" height="250" fill="#2563eb"/>
<text x="635" y="42" text-anchor="middle" font-size="14" fill="#1f2937">۵۰۰</text>
<text x="635" y="322" text-anchor="middle" font-size="13" fill="#1f2937">مانده بانک</text>
<rect x="480" y="50" width="90" height="140" fill="#dc2626"/>
<text x="525" y="42" text-anchor="middle" font-size="14" fill="#1f2937">۲۸۰−</text>
<text x="525" y="322" text-anchor="middle" font-size="13" fill="#1f2937">حقوق</text>
<rect x="370" y="190" width="90" height="30" fill="#dc2626"/>
<text x="415" y="182" text-anchor="middle" font-size="14" fill="#1f2937">۶۰−</text>
<text x="415" y="322" text-anchor="middle" font-size="13" fill="#1f2937">مالیات</text>
<rect x="260" y="220" width="90" height="35" fill="#dc2626"/>
<text x="305" y="212" text-anchor="middle" font-size="14" fill="#1f2937">۷۰−</text>
<text x="305" y="322" text-anchor="middle" font-size="13" fill="#1f2937">تأمین‌کنندگان</text>
<rect x="150" y="255" width="90" height="20" fill="#dc2626"/>
<text x="195" y="247" text-anchor="middle" font-size="14" fill="#1f2937">۴۰−</text>
<text x="195" y="322" text-anchor="middle" font-size="13" fill="#1f2937">اجاره و بیمه</text>
<rect x="40" y="275" width="90" height="25" fill="#16a34a"/>
<text x="85" y="267" text-anchor="middle" font-size="14" fill="#1f2937">۵۰</text>
<text x="85" y="322" text-anchor="middle" font-size="13" fill="#1f2937">نقد واقعی</text>
</g>
</svg>
