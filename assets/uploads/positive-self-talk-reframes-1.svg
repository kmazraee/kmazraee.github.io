<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 286" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="نمونه‌هایی از جایگزینی واژه‌های منفی">
<rect width="800" height="286" fill="#ffffff"/>
<text x="400.0" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">نمونه‌ی بازتعریف واژه‌ها</text>
<rect x="597" y="75" width="173" height="130" rx="12" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="684" y="117" text-anchor="middle" font-size="26" font-weight="700" fill="#2b6cb0">۱</text>
<text x="684" y="153" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">شکست</text>
<text x="684" y="181" text-anchor="middle" font-size="13" fill="#374151">یادگیری</text>
<rect x="408" y="75" width="173" height="130" rx="12" fill="#e6f6ec" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="494" y="117" text-anchor="middle" font-size="26" font-weight="700" fill="#2b6cb0">۲</text>
<text x="494" y="153" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">بلد نیستم</text>
<text x="494" y="181" text-anchor="middle" font-size="13" fill="#374151">هنوز بلد نیستم</text>
<rect x="219" y="75" width="173" height="130" rx="12" fill="#fff4e0" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="306" y="117" text-anchor="middle" font-size="26" font-weight="700" fill="#2b6cb0">۳</text>
<text x="306" y="153" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">خسته‌ام</text>
<text x="306" y="181" text-anchor="middle" font-size="13" fill="#374151">در وقت اضافه‌ام</text>
<rect x="30" y="75" width="173" height="130" rx="12" fill="#f3e8fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="116" y="117" text-anchor="middle" font-size="26" font-weight="700" fill="#2b6cb0">۴</text>
<text x="116" y="153" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">باید</text>
<text x="116" y="181" text-anchor="middle" font-size="13" fill="#374151">می‌توانم</text>
<text x="400.0" y="268" text-anchor="middle" font-size="15" fill="#374151">واژه را عوض کنید، شدت احساس کم می‌شود</text>
</svg>
