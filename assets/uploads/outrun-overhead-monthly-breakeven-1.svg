<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" direction="rtl" font-family="Vazirmatn, Tahoma, 'DejaVu Sans', sans-serif" role="img" aria-label="سود و زیان هفتگی در سطوح مختلف ویزیت نسبت به نقطه سربه‌سر ۱۱۰۰ ویزیت">
<rect width="800" height="420" rx="18" fill="#ffffff"/>
<rect x="8" y="8" width="784" height="404" rx="14" fill="none" stroke="#d5dee8" stroke-width="2"/>
<text x="400" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#16324f">سود هفتگی در برابر تعداد ویزیت</text>
<line x1="270" y1="70" x2="530" y2="70" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round"/>
<line x1="80" y1="250" x2="720" y2="250" stroke="#718096" stroke-width="2"/>
<rect x="540" y="250" width="120" height="80" rx="6" fill="#c53030"/>
<text x="600" y="352" text-anchor="middle" font-size="18" font-weight="700" fill="#c53030">۸٬۰۰۰− زیان</text>
<text x="600" y="376" text-anchor="middle" font-size="15" fill="#3d566e">۹۰۰ ویزیت</text>
<rect x="380" y="248" width="120" height="4" fill="#c27803"/>
<text x="440" y="216" text-anchor="middle" font-size="18" font-weight="700" fill="#c27803">صفر</text>
<text x="440" y="376" text-anchor="middle" font-size="15" fill="#3d566e">۱٬۱۰۰ سربه‌سر</text>
<rect x="220" y="170" width="120" height="80" rx="6" fill="#2f855a"/>
<text x="280" y="152" text-anchor="middle" font-size="18" font-weight="700" fill="#2f855a">۴٬۰۰۰ سود</text>
<text x="280" y="376" text-anchor="middle" font-size="15" fill="#3d566e">۱٬۲۰۰ ویزیت</text>
<rect x="60" y="100" width="120" height="150" rx="6" fill="#2f855a"/>
<text x="120" y="92" text-anchor="middle" font-size="18" font-weight="700" fill="#2f855a">۱۲٬۰۰۰ سود</text>
<text x="120" y="376" text-anchor="middle" font-size="15" fill="#3d566e">۱٬۴۰۰ ویزیت</text>
<text x="400" y="402" text-anchor="middle" font-size="13" fill="#718096">مثال فرضی: حاشیه مشارکت هر ویزیت ۴۰ و هزینه ثابت هفتگی ۴۴٬۰۰۰</text>
</svg>
