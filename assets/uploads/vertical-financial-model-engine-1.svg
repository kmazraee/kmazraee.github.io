<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" direction="rtl" role="img"><rect width="900" height="520" fill="#ffffff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#44546a"/></marker></defs><text x="450" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#1b2a3a" font-family="Vazirmatn, Tahoma, Arial, sans-serif">موتور عمودی و برگه‌های پشتیبان</text><rect x="300" y="70" width="560" height="400" rx="14" fill="#f7faff" stroke="#4a74c9" stroke-width="2"/><text x="580" y="100" text-anchor="middle" font-size="18" font-weight="700" fill="#2b4a8a" font-family="Vazirmatn, Tahoma, Arial, sans-serif">مدل عمودی (موتور): یک محور زمانی برای همه</text><rect x="320" y="115" width="520" height="44" rx="12" fill="#d8e5ff" stroke="#4a74c9" stroke-width="2"/><text x="580.0" y="142.6" text-anchor="middle" font-size="16" font-weight="400" fill="#1b2a3a" font-family="Vazirmatn, Tahoma, Arial, sans-serif">محور زمانی مشترک: ماه ۱ … ماه n</text><rect x="320" y="170" width="520" height="70" rx="12" fill="#ffe6d2" stroke="#d9731f" stroke-width="2"/><text x="580.0" y="198.6" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2a3a" font-family="Vazirmatn, Tahoma, Arial, sans-serif">برنامه‌های اصلی</text><text x="580.0" y="222.6" text-anchor="middle" font-size="16" font-weight="400" fill="#1b2a3a" font-family="Vazirmatn, Tahoma, Arial, sans-serif">سه صورت مالی، شاخص‌ها، تعهدات وام، بازده</text><rect x="320" y="250" width="520" height="200" rx="12" fill="#fff7d6" stroke="#c9a227" stroke-width="2"/><text x="580.0" y="331.6" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2a3a" font-family="Vazirmatn, Tahoma, Arial, sans-serif">برنامه‌های پشتیبان</text><text x="580.0" y="355.6" text-anchor="middle" font-size="16" font-weight="400" fill="#1b2a3a" font-family="Vazirmatn, Tahoma, Arial, sans-serif">سرمایه در گردش • ذخایر • مخارج سرمایه‌ای</text><text x="580.0" y="379.6" text-anchor="middle" font-size="16" font-weight="400" fill="#1b2a3a" font-family="Vazirmatn, Tahoma, Arial, sans-serif">استهلاک • بدهی</text><rect x="30" y="150" width="220" height="70" rx="12" fill="#e3f6e8" stroke="#3f9b5a" stroke-width="2"/><text x="140.0" y="190.6" text-anchor="middle" font-size="16" font-weight="400" fill="#1b2a3a" font-family="Vazirmatn, Tahoma, Arial, sans-serif">برگه‌ی واقعی‌ها</text><rect x="30" y="250" width="220" height="70" rx="12" fill="#e3f6e8" stroke="#3f9b5a" stroke-width="2"/><text x="140.0" y="290.6" text-anchor="middle" font-size="16" font-weight="400" fill="#1b2a3a" font-family="Vazirmatn, Tahoma, Arial, sans-serif">برگه‌ی نیروی انسانی</text><rect x="30" y="350" width="220" height="70" rx="12" fill="#e3f6e8" stroke="#3f9b5a" stroke-width="2"/><text x="140.0" y="390.6" text-anchor="middle" font-size="16" font-weight="400" fill="#1b2a3a" font-family="Vazirmatn, Tahoma, Arial, sans-serif">جزئیات درآمد و هزینه</text><line x1="252" y1="185" x2="298" y2="185" stroke="#44546a" stroke-width="3" marker-end="url(#a)"/><line x1="252" y1="285" x2="298" y2="285" stroke="#44546a" stroke-width="3" marker-end="url(#a)"/><line x1="252" y1="385" x2="298" y2="385" stroke="#44546a" stroke-width="3" marker-end="url(#a)"/><text x="140" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#44546a" font-family="Vazirmatn, Tahoma, Arial, sans-serif">پشتیبان‌های افقی</text><text x="450" y="500" text-anchor="middle" font-size="15" fill="#44546a" font-family="Vazirmatn, Tahoma, Arial, sans-serif">خلاصه‌ها فقط از موتور خوانده می‌شوند، نه از برگه‌های پشتیبان</text></svg>