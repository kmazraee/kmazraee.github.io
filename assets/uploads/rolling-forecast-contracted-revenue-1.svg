<text x="780" y="185" font-size="15" fill="#1e293b" font-weight="700" text-anchor="start" direction="rtl">سناریوی بدترین</text>
<rect x="432.5874125874126" y="195" width="347.4125874125874" height="44" rx="6" fill="#60a5fa" stroke="none"/>
<text x="606.2937062937062" y="223" font-size="14" fill="#0f172a" font-weight="700" text-anchor="middle" direction="rtl">قراردادی ۸۲۸ هزار</text>
<text x="780" y="285" font-size="14" fill="#475569" font-weight="400" text-anchor="start" direction="rtl">بهترین: ۱٫۴۳ میلیون درآمد، ۵۸٪ امضاشده | بدترین: ۸۲۸ هزار، ۱۰۰٪ امضاشده</text>
