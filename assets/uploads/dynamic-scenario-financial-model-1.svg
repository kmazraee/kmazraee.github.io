<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="معماری مدل سناریومحور: بلوک‌های سناریو، بخش زنده، مدل و مقایسه">
<rect width="800" height="400" fill="#faf7f0"/>
<text x="400" y="32" text-anchor="middle" font-size="21" fill="#2b2b2b" font-weight="bold">معماری مدل سناریومحور</text>
<rect x="60" y="60" width="200" height="86" rx="10" fill="#e3eaf7" stroke="#777" stroke-width="1.5"/>
<text x="160" y="96" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold">سناریوی ۱</text>
<text x="160" y="122" text-anchor="middle" font-size="14" fill="#555">پایه</text>
<rect x="300" y="60" width="200" height="86" rx="10" fill="#e3f0e6" stroke="#777" stroke-width="1.5"/>
<text x="400" y="96" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold">سناریوی ۲</text>
<text x="400" y="122" text-anchor="middle" font-size="14" fill="#555">خوش‌بینانه</text>
<rect x="540" y="60" width="200" height="86" rx="10" fill="#f7e3d4" stroke="#777" stroke-width="1.5"/>
<text x="640" y="96" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold">سناریوی ۳</text>
<text x="640" y="122" text-anchor="middle" font-size="14" fill="#555">بدبینانه</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<line x1="160" y1="146" x2="400" y2="196" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="400" y1="146" x2="400" y2="196" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="640" y1="146" x2="400" y2="196" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="300" y="160" width="200" height="20" fill="#faf7f0"/><text x="400" y="175" text-anchor="middle" font-size="13" fill="#555">انتخاب بر اساس «سناریوی جاری»</text>
<rect x="250" y="198" width="300" height="62" rx="12" fill="#fbe9c9" stroke="#c98a1f" stroke-width="2"/>
<text x="400" y="236" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold">بخش زنده (تنها ورودی مدل)</text>
<line x1="400" y1="260" x2="400" y2="290" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="250" y="292" width="300" height="52" rx="12" fill="#e3f0e6" stroke="#5a9a6b" stroke-width="2"/>
<text x="400" y="325" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold">مدل ماهانه و خروجی‌ها</text>
<rect x="590" y="198" width="180" height="62" rx="12" fill="#fff" stroke="#2b2b2b" stroke-width="2"/>
<text x="680" y="226" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold">حالت کنترل</text>
<text x="680" y="246" text-anchor="middle" font-size="13" fill="#555">نسخه‌ی منجمد</text>
<line x1="550" y1="318" x2="640" y2="318" stroke="#555" stroke-width="2"/>
<line x1="640" y1="318" x2="640" y2="262" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="400" y="380" text-anchor="middle" font-size="15" fill="#555">واریانس = بخش زنده − حالت کنترل</text>
</svg>