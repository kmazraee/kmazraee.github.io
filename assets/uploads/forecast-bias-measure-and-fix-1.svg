<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 278" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="سه گام کاهش سوگیری پیش‌بینی: سنجش، بررسی و اصلاح">
<rect width="800" height="278" fill="#faf7f0"/>
<text x="400" y="38" text-anchor="middle" font-size="21" fill="#2b2b2b" font-weight="bold">سه گام کاهش سوگیری پیش‌بینی</text>
<rect x="536" y="62" width="240" height="138" rx="12" fill="#e3eaf7" stroke="#4a6fb5" stroke-width="2"/>
<text x="656" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">۱. سنجش</text>
<text x="656" y="120" text-anchor="middle" font-size="13" fill="#3d3d3d">خطای علامت‌دار</text>
<text x="656" y="146" text-anchor="middle" font-size="13" fill="#3d3d3d">۶ تا ۱۲ دوره</text>
<text x="656" y="172" text-anchor="middle" font-size="13" fill="#3d3d3d">جهت سوگیری</text>
<rect x="280" y="62" width="240" height="138" rx="12" fill="#e3f0e6" stroke="#5a9a6b" stroke-width="2"/>
<text x="400" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">۲. بررسی</text>
<text x="400" y="120" text-anchor="middle" font-size="13" fill="#3d3d3d">روش و منبع داده</text>
<text x="400" y="146" text-anchor="middle" font-size="13" fill="#3d3d3d">فرض‌ها و انگیزه‌ها</text>
<text x="400" y="172" text-anchor="middle" font-size="13" fill="#3d3d3d">سؤال‌های باز</text>
<rect x="24" y="62" width="240" height="138" rx="12" fill="#fbeee0" stroke="#c98a3a" stroke-width="2"/>
<text x="144" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">۳. اصلاح</text>
<text x="144" y="120" text-anchor="middle" font-size="13" fill="#3d3d3d">گفت‌وگوی دونفره</text>
<text x="144" y="146" text-anchor="middle" font-size="13" fill="#3d3d3d">پیش‌بینی ≠ هدف</text>
<text x="144" y="172" text-anchor="middle" font-size="13" fill="#3d3d3d">ایمنی روانی</text>
<rect x="100" y="216" width="600" height="42" rx="12" fill="#fff" stroke="#2b2b2b" stroke-width="2"/>
<text x="400" y="243" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">هدف: پیش‌بینی واقعاً ۵۰/۵۰</text>
</svg>
