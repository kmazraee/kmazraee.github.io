<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="آزمون سد رقابتی: اگر یک میلیارد دلار برای گرفتن سهم بازار رهبر صنعت داشتید، می‌توانستید موفق شوید؟">
<rect width="800" height="320" fill="#faf7f0"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/></marker></defs><text x="400" y="38" text-anchor="middle" font-size="22" fill="#2b2b2b" font-weight="bold">آزمون سد رقابتی</text><rect x="280" y="60" width="240" height="70" rx="12" fill="#fff" stroke="#4a6fb5" stroke-width="2"/><text x="400" y="90" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold">یک میلیارد دلار بودجه</text><text x="400" y="114" text-anchor="middle" font-size="14" fill="#2b2b2b">برای گرفتن سهم بازار رهبر</text><line x1="400" y1="132" x2="400" y2="160" stroke="#2b2b2b" stroke-width="2.5" marker-end="url(#a)"/><text x="400" y="182" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold">آیا موفق می‌شوید؟</text><line x1="340" y1="192" x2="200" y2="225" stroke="#2b2b2b" stroke-width="2.5" marker-end="url(#a)"/><line x1="460" y1="192" x2="600" y2="225" stroke="#2b2b2b" stroke-width="2.5" marker-end="url(#a)"/><rect x="60" y="230" width="280" height="70" rx="12" fill="#fff" stroke="#b5524a" stroke-width="2"/><text x="200" y="260" text-anchor="middle" font-size="17" fill="#b5524a" font-weight="bold">بله، می‌شود</text><text x="200" y="284" text-anchor="middle" font-size="14" fill="#2b2b2b">سد رقابتی ضعیف است</text><rect x="460" y="230" width="280" height="70" rx="12" fill="#fff" stroke="#5a9a6b" stroke-width="2"/><text x="600" y="260" text-anchor="middle" font-size="16" fill="#5a9a6b" font-weight="bold">نه، هیچ مبلغی کافی نیست</text><text x="600" y="284" text-anchor="middle" font-size="14" fill="#2b2b2b">نشانه‌ی سد رقابتی قوی</text>
</svg>
