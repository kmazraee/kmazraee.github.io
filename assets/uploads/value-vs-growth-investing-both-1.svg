<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="مقایسه‌ی سرمایه‌گذاری ارزشی و رشدی و نقطه‌ی مشترک آن‌ها: رشد بخشی از محاسبه‌ی ارزش است">
<rect width="800" height="320" fill="#faf7f0"/>
<text x="400" y="36" text-anchor="middle" font-size="22" fill="#2b2b2b" font-weight="bold">ارزشی و رشدی: دو مکتب، یک محاسبه</text><rect x="450" y="60" width="310" height="170" rx="12" fill="#fff" stroke="#4a6fb5" stroke-width="2"/><text x="605" y="90" text-anchor="middle" font-size="18" fill="#4a6fb5" font-weight="bold">سرمایه‌گذاری ارزشی</text><text x="605" y="125" text-anchor="middle" font-size="14" fill="#2b2b2b">خرید اسکناس یک‌دلاری با ۵۰ سنت</text><text x="605" y="155" text-anchor="middle" font-size="14" fill="#2b2b2b">تمرکز بر حاشیه‌ی ایمنی</text><text x="605" y="185" text-anchor="middle" font-size="14" fill="#2b2b2b">ابزار: DCF و ضریب‌ها</text><rect x="40" y="60" width="310" height="170" rx="12" fill="#fff" stroke="#c98a3d" stroke-width="2"/><text x="195" y="90" text-anchor="middle" font-size="18" fill="#c98a3d" font-weight="bold">سرمایه‌گذاری رشدی</text><text x="195" y="125" text-anchor="middle" font-size="14" fill="#2b2b2b">پرداخت قیمت بالا برای رشد آینده</text><text x="195" y="155" text-anchor="middle" font-size="14" fill="#2b2b2b">تمرکز بر پتانسیل صعود</text><text x="195" y="185" text-anchor="middle" font-size="14" fill="#2b2b2b">پذیرش زیان‌های متعدد</text><rect x="150" y="250" width="500" height="48" rx="12" fill="#fff" stroke="#5a9a6b" stroke-width="2"/><text x="400" y="281" text-anchor="middle" font-size="16" fill="#5a9a6b" font-weight="bold">رشد همیشه جزئی از محاسبه‌ی ارزش است</text>
</svg>
