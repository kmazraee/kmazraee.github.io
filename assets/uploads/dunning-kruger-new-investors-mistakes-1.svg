<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="منحنی اثر دانینگ-کروگر در سرمایه‌گذاری از قله‌ی نادانیِ مطمئن تا دره‌ی ناامیدی و تسلط">
<rect width="800" height="320" fill="#faf7f0"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/></marker></defs><text x="400" y="36" text-anchor="middle" font-size="22" fill="#2b2b2b" font-weight="bold">اثر دانینگ-کروگر در سرمایه‌گذاری</text><line x1="90" y1="270" x2="720" y2="270" stroke="#2b2b2b" stroke-width="2"/><line x1="720" y1="270" x2="720" y2="60" stroke="#2b2b2b" stroke-width="2"/><text x="400" y="302" text-anchor="middle" font-size="14" fill="#2b2b2b">دانش و تجربه ←</text><text x="742" y="170" text-anchor="middle" font-size="14" fill="#2b2b2b">اعتماد</text><path d="M700,250 C640,60 600,50 560,80 C520,110 500,235 440,235 C380,235 330,150 200,95" fill="none" stroke="#4a6fb5" stroke-width="4"/><text x="470" y="84" text-anchor="middle" font-size="15" fill="#b5524a" font-weight="bold">قله: نادانیِ مطمئن</text><text x="470" y="262" text-anchor="middle" font-size="15" fill="#b5524a" font-weight="bold">دره‌ی ناامیدی</text><text x="250" y="86" text-anchor="middle" font-size="15" fill="#5a9a6b" font-weight="bold">مسیر تسلط</text><text x="470" y="106" text-anchor="middle" font-size="13" fill="#2b2b2b">پس از چند سود شانسی</text>
</svg>
