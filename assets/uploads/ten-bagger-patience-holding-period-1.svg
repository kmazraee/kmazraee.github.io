<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="رسیدن به ده‌برابرشدن سهم: لحظه‌ی خرید کوتاه است و بخش اصلی مسیر سال‌ها نگهداری آرام و کسالت‌بار است">
<rect width="800" height="320" fill="#faf7f0"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/></marker></defs><text x="400" y="36" text-anchor="middle" font-size="22" fill="#2b2b2b" font-weight="bold">ده‌برابرشدن: خرید کوتاه، انتظار بلند</text><rect x="640" y="110" width="130" height="90" rx="12" fill="#fff" stroke="#4a6fb5" stroke-width="2"/><text x="705" y="150" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold">لحظه‌ی خرید</text><text x="705" y="175" text-anchor="middle" font-size="13" fill="#2b2b2b">هیجان کوتاه</text><rect x="250" y="110" width="350" height="90" rx="12" fill="#fff" stroke="#c98a3d" stroke-width="2"/><text x="425" y="145" text-anchor="middle" font-size="18" fill="#2b2b2b" font-weight="bold">سال‌ها نگهداری</text><text x="425" y="172" text-anchor="middle" font-size="14" fill="#2b2b2b">کسالت‌بار، بدون هیجان</text><rect x="30" y="110" width="170" height="90" rx="12" fill="#fff" stroke="#5a9a6b" stroke-width="2"/><text x="115" y="150" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold">ده‌برابرشدن</text><text x="115" y="175" text-anchor="middle" font-size="12" fill="#2b2b2b">میانگین بیش از ۱۶ سال</text><line x1="636" y1="155" x2="606" y2="155" stroke="#2b2b2b" stroke-width="2.5" marker-end="url(#a)"/><line x1="246" y1="155" x2="206" y2="155" stroke="#2b2b2b" stroke-width="2.5" marker-end="url(#a)"/><text x="400" y="260" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold">بازده بزرگ حاصل صبر است، نه فقط لحظه‌ی خرید</text>
</svg>
