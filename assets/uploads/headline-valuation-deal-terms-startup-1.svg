<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" direction="rtl" font-family="Vazirmatn, Tahoma, 'DejaVu Sans', sans-serif" role="img" aria-label="مقایسه سهم سهام‌داران عادی در دو پیشنهاد جذب سرمایه">
<rect width="800" height="420" rx="18" fill="#ffffff"/>
<rect x="8" y="8" width="784" height="404" rx="14" fill="none" stroke="#d5dee8" stroke-width="2"/>
<text x="400" y="62" text-anchor="middle" font-size="26" font-weight="700" fill="#16324f">فروش ۶۰ میلیونی: پول چطور تقسیم می‌شود؟</text>
<line x1="260" y1="80" x2="540" y2="80" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round"/>
<text x="400" y="120" text-anchor="middle" font-size="15" fill="#3d566e">ارزش‌گذاری بالاتر با ترجیح ۲ برابر، سهم عادی‌ها را نصف می‌کند</text>
<text x="330" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#16324f">پیشنهاد الف</text>
<text x="330" y="212" text-anchor="middle" font-size="13" fill="#3d566e">ارزش پیش از سرمایه ۶۰، ترجیح ۱ برابر</text>
<rect x="60" y="230" width="360" height="44" fill="#2b6cb0"/>
<rect x="420" y="230" width="180" height="44" fill="#2f855a"/>
<text x="240" y="259" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">بنیان‌گذاران و کارکنان: ۴۰</text>
<text x="510" y="259" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">سرمایه‌گذار: ۲۰</text>
<text x="330" y="320" text-anchor="middle" font-size="17" font-weight="700" fill="#16324f">پیشنهاد ب</text>
<text x="330" y="342" text-anchor="middle" font-size="13" fill="#3d566e">ارزش پیش از سرمایه ۱۰۰، ترجیح ۲ برابر</text>
<rect x="60" y="360" width="180" height="44" fill="#2b6cb0"/>
<rect x="240" y="360" width="360" height="44" fill="#c53030"/>
<text x="150" y="389" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">عادی‌ها: ۲۰</text>
<text x="420" y="389" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">سرمایه‌گذار: ۴۰</text>
</svg>