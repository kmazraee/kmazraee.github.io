<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" direction="rtl" font-family="Vazirmatn, Tahoma, 'DejaVu Sans', sans-serif" role="img" aria-label="مسیر ارزش‌گذاری: درآمد پایه، رشد، درآمد آتی، ضریب و ارزش سازمانی">
<rect width="800" height="380" rx="18" fill="#ffffff"/>
<rect x="8" y="8" width="784" height="364" rx="14" fill="none" stroke="#d5dee8" stroke-width="2"/>
<text x="400" y="56" text-anchor="middle" font-size="26" font-weight="700" fill="#16324f">از درآمد فعلی تا ارزش سازمانی (مثال فرضی)</text>
<rect x="600" y="100" width="160" height="90" rx="12" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="2"/>
<text x="680" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#16324f">درآمد پایه</text>
<text x="680" y="166" text-anchor="middle" font-size="15" fill="#3d566e">۶۸۰ میلیون</text>
<rect x="320" y="100" width="160" height="90" rx="12" fill="#e9f7ef" stroke="#2f855a" stroke-width="2"/>
<text x="400" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#16324f">رشد ۱۵ درصد</text>
<text x="400" y="166" text-anchor="middle" font-size="15" fill="#3d566e">درآمد آتی ۷۸۲</text>
<rect x="40" y="100" width="160" height="90" rx="12" fill="#fff4e0" stroke="#c27803" stroke-width="2"/>
<text x="120" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#16324f">ضریب ۶ تا ۸</text>
<text x="120" y="166" text-anchor="middle" font-size="15" fill="#3d566e">از شرکت‌های هم‌گروه</text>
<line x1="598" y1="145" x2="482" y2="145" stroke="#3d566e" stroke-width="3"/>
<line x1="318" y1="145" x2="202" y2="145" stroke="#3d566e" stroke-width="3"/>
<line x1="120" y1="192" x2="120" y2="240" stroke="#3d566e" stroke-width="3"/>
<rect x="40" y="244" width="720" height="92" rx="14" fill="#fdecef" stroke="#c53030" stroke-width="2"/>
<text x="400" y="282" text-anchor="middle" font-size="20" font-weight="700" fill="#16324f">ارزش سازمانی تقریبی: ۴٫۷ تا ۶٫۳ میلیارد دلار</text>
<text x="400" y="314" text-anchor="middle" font-size="15" fill="#3d566e">بازه، نه عدد قطعی؛ کیفیت درآمد جای شما را در بازه تعیین می‌کند</text>
</svg>
