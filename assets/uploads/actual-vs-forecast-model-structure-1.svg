<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" direction="rtl" font-family="Vazirmatn,Tahoma,Arial,sans-serif"><rect width="600" height="300" fill="#fafaf7"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs><text x="300" y="34" text-anchor="middle" font-size="20" font-weight="bold">یک تاریخ، کل مدل را به‌روز می‌کند</text><rect x="180" y="56" width="240" height="48" rx="8" fill="#fff4d6" stroke="#b7860b" stroke-width="1.5"/><text x="300.0" y="85.0" text-anchor="middle" font-size="16" fill="#1a1a1a">صفحه‌ی کنترل: آخرین ماه واقعی</text><line x1="300" y1="104" x2="300" y2="134" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="180" y="134" width="240" height="48" rx="8" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.5"/><text x="300.0" y="163.0" text-anchor="middle" font-size="16" fill="#1a1a1a">آیا ماه جاری «واقعی» است؟</text><line x1="380" y1="182" x2="470" y2="222" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="220" y1="182" x2="130" y2="222" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="380" y="222" width="190" height="48" rx="8" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.5"/><text x="475.0" y="251.0" text-anchor="middle" font-size="14" fill="#1a1a1a">بله: برداشت از داده‌ی واقعی</text><rect x="30" y="222" width="190" height="48" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="125.0" y="251.0" text-anchor="middle" font-size="14" fill="#1a1a1a">خیر: فرمول پیش‌بینی</text></svg>