<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif">
<rect width="800" height="360" fill="#ffffff"/>
<text x="400" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">تقویم چهارهفته‌ای FP&amp;A</text>
<g font-size="15" text-anchor="middle">
<rect x="570" y="65" width="200" height="260" rx="12" fill="#e8f1fb" stroke="#2b6cb0"/>
<text x="670" y="95" font-weight="700" fill="#1a365d">هفته‌ی اول</text>
<text x="670" y="125" fill="#1f2937">گزارش فلش</text>
<text x="670" y="155" fill="#1f2937">بستن ماه و BVA</text>
<text x="670" y="185" fill="#1f2937">بسته‌ی گزارش ماهانه</text>
<text x="670" y="215" fill="#1f2937">گزارش پایان فصل</text>
<rect x="360" y="65" width="200" height="260" rx="12" fill="#e9f7ef" stroke="#2f855a"/>
<text x="460" y="95" font-weight="700" fill="#1c4532">هفته‌ی دوم</text>
<text x="460" y="125" fill="#1f2937">پیش‌بینی اولیه</text>
<text x="460" y="155" fill="#1f2937">مرور با تیم‌ها و مدیر مالی</text>
<text x="460" y="185" fill="#1f2937">بارگذاری و قفل پیش‌بینی</text>
<text x="460" y="215" fill="#1f2937">جلسه‌های MBR و QBR</text>
<rect x="150" y="65" width="200" height="260" rx="12" fill="#fdf2e3" stroke="#c05621"/>
<text x="250" y="95" font-weight="700" fill="#7b341e">هفته‌ی سوم</text>
<text x="250" y="125" fill="#1f2937">تخصیص هزینه</text>
<text x="250" y="155" fill="#1f2937">تحلیل سودآوری</text>
<text x="250" y="185" fill="#1f2937">سرمایه در گردش</text>
<text x="250" y="215" fill="#1f2937">خودکارسازی و پروژه‌ها</text>
<rect x="10" y="65" width="130" height="260" rx="12" fill="#f3e8fb" stroke="#6b46c1"/>
<text x="75" y="95" font-weight="700" fill="#44337a">هفته‌ی چهارم</text>
<text x="75" y="125" font-size="13" fill="#1f2937">گزارش فلش</text>
<text x="75" y="155" font-size="13" fill="#1f2937">بستن درآمد</text>
<text x="75" y="185" font-size="13" fill="#1f2937">بستن پرداختنی‌ها</text>
<text x="75" y="215" font-size="13" fill="#1f2937">هزینه‌های معوق</text>
</g>
</svg>
