<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="چهار مرحله‌ی کاخ حافظه">
<rect width="800" height="400" fill="#ffffff"/>
<text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">چهار مرحله‌ی کاخ حافظه</text>
<rect x="80" y="70" width="640" height="63" rx="10" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400.0" y="107.5" text-anchor="middle" font-size="18" fill="#1f2937">۱. مکانی آشنا انتخاب کنید</text>
<rect x="80" y="147" width="640" height="63" rx="10" fill="#e6f6ec" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400.0" y="184.5" text-anchor="middle" font-size="18" fill="#1f2937">۲. مسیر ثابتی در آن تعریف کنید</text>
<rect x="80" y="224" width="640" height="63" rx="10" fill="#fff4e0" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400.0" y="261.5" text-anchor="middle" font-size="18" fill="#1f2937">۳. اطلاعات را به تصویر عجیب تبدیل کنید</text>
<rect x="80" y="301" width="640" height="63" rx="10" fill="#f3e8fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="400.0" y="338.5" text-anchor="middle" font-size="18" fill="#1f2937">۴. تصویرها را در نقطه‌های مسیر بگذارید</text>
</svg>
