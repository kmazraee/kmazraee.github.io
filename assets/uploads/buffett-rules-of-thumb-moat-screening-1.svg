<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 371" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="سه قاعده‌ی سرانگشتی صورت سود و زیان در برابر یک شرکت فرضی">
<rect width="800" height="371" fill="#faf7f0"/>
<text x="400" y="38" text-anchor="middle" font-size="22" fill="#2b2b2b" font-weight="bold">سه قاعده‌ی سرانگشتی در برابر یک شرکت فرضی</text><text x="780" y="96" text-anchor="start" font-size="17" fill="#2b2b2b" font-weight="bold">حاشیه سود ناخالص</text><text x="780" y="120" text-anchor="start" font-size="14" fill="#6b6b6b">آستانه: حداقل ۴۰٪</text><rect x="60" y="102" width="420" height="22" rx="6" fill="#ece6d8"/><rect x="60" y="102" width="175" height="22" rx="6" fill="#c0583d"/><line x1="340" y1="94" x2="340" y2="132" stroke="#2b2b2b" stroke-width="2" stroke-dasharray="4 3"/><text x="500" y="119" text-anchor="end" font-size="15" fill="#c0583d" font-weight="bold">۲۵٪ (مردود)</text><text x="780" y="181" text-anchor="start" font-size="17" fill="#2b2b2b" font-weight="bold">پژوهش و توسعه از سود ناخالص</text><text x="780" y="205" text-anchor="start" font-size="14" fill="#6b6b6b">آستانه: کمتر از ۳۰٪</text><rect x="60" y="187" width="420" height="22" rx="6" fill="#ece6d8"/><rect x="60" y="187" width="315" height="22" rx="6" fill="#c0583d"/><line x1="270" y1="179" x2="270" y2="217" stroke="#2b2b2b" stroke-width="2" stroke-dasharray="4 3"/><text x="500" y="204" text-anchor="end" font-size="15" fill="#c0583d" font-weight="bold">۴۵٪ (مردود)</text><text x="780" y="266" text-anchor="start" font-size="17" fill="#2b2b2b" font-weight="bold">فروش، عمومی و اداری از سود ناخالص</text><text x="780" y="290" text-anchor="start" font-size="14" fill="#6b6b6b">آستانه: کمتر از ۳۰٪</text><rect x="60" y="272" width="420" height="22" rx="6" fill="#ece6d8"/><rect x="60" y="272" width="140" height="22" rx="6" fill="#5a9a6b"/><line x1="270" y1="264" x2="270" y2="302" stroke="#2b2b2b" stroke-width="2" stroke-dasharray="4 3"/><text x="500" y="289" text-anchor="end" font-size="15" fill="#5a9a6b" font-weight="bold">۲۰٪ (قبول)</text><text x="400" y="345" text-anchor="middle" font-size="14" fill="#6b6b6b">مثال آموزشی با اعداد فرضی؛ قاعده‌ها فیلتر اولیه‌اند نه حکم نهایی</text>
</svg>
