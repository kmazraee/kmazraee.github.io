<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 212" font-family="Vazirmatn, Tahoma, Arial, sans-serif">
<rect width="800" height="212" rx="14" fill="#f7f5ef"/>
<text x="400.0" y="48" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2a37">بازگویی؛ مهارت کوچک شریک کاری خوب</text>
<line x1="300" y1="64" x2="500" y2="64" stroke="#b08d57" stroke-width="3"/>
<rect x="537" y="84" width="243" height="96" rx="10" fill="#ffffff" stroke="#d9d2c0"/>
<circle cx="756" cy="108" r="14" fill="#1f4e5f"/>
<text x="756" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
<text x="732" y="114" text-anchor="end" font-size="16" font-weight="700" fill="#1f2a37">گوش دادن عمیق</text>
<text x="766" y="146" text-anchor="end" font-size="13" fill="#4b5563">شریک کاری حس می‌کند شنیده شد</text>
<rect x="279" y="84" width="243" height="96" rx="10" fill="#ffffff" stroke="#d9d2c0"/>
<circle cx="497" cy="108" r="14" fill="#1f4e5f"/>
<text x="497" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>
<text x="473" y="114" text-anchor="end" font-size="16" font-weight="700" fill="#1f2a37">رفع سوءتفاهم</text>
<text x="507" y="146" text-anchor="end" font-size="13" fill="#4b5563">روشن‌بودن برای فرستنده، برای گیرنده نیست</text>
<rect x="20" y="84" width="243" height="96" rx="10" fill="#ffffff" stroke="#d9d2c0"/>
<circle cx="239" cy="108" r="14" fill="#1f4e5f"/>
<text x="239" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3</text>
<text x="215" y="114" text-anchor="end" font-size="16" font-weight="700" fill="#1f2a37">مهلت تفکر</text>
<text x="249" y="146" text-anchor="end" font-size="13" fill="#4b5563">چند ثانیه برای بازنگری</text>
</svg>