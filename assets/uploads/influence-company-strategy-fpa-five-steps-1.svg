<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 252" direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" role="img" aria-label="پنج مرحله‌ی تأثیرگذاری تیم مالی بر استراتژی شرکت">
<rect width="800" height="252" fill="#faf7f0"/>
<text x="400" y="38" text-anchor="middle" font-size="21" fill="#2b2b2b" font-weight="bold">پنج مرحله‌ی تأثیرگذاری بر استراتژی</text>
<rect x="638" y="62" width="138" height="112" rx="12" fill="#e3eaf7" stroke="#4a6fb5" stroke-width="2"/>
<text x="707" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">۱. شاخص مهم</text>
<text x="707" y="120" text-anchor="middle" font-size="13" fill="#3d3d3d">دو سه شاخص</text>
<text x="707" y="146" text-anchor="middle" font-size="13" fill="#3d3d3d">نه پانزده تا</text>
<rect x="485" y="62" width="138" height="112" rx="12" fill="#e3f0e6" stroke="#5a9a6b" stroke-width="2"/>
<text x="554" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">۲. پیوند</text>
<text x="554" y="120" text-anchor="middle" font-size="13" fill="#3d3d3d">شاخص را به</text>
<text x="554" y="146" text-anchor="middle" font-size="13" fill="#3d3d3d">استراتژی وصل کنید</text>
<rect x="331" y="62" width="138" height="112" rx="12" fill="#fbeee0" stroke="#c98a3a" stroke-width="2"/>
<text x="400" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">۳. ریشه</text>
<text x="400" y="120" text-anchor="middle" font-size="13" fill="#3d3d3d">چرا؟ نه فقط چه</text>
<text x="400" y="146" text-anchor="middle" font-size="13" fill="#3d3d3d">اقدام مشخص</text>
<rect x="178" y="62" width="138" height="112" rx="12" fill="#f3e6f3" stroke="#9a5a9a" stroke-width="2"/>
<text x="246" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">۴. نبرد</text>
<text x="246" y="120" text-anchor="middle" font-size="13" fill="#3d3d3d">ارزش فرصت در</text>
<text x="246" y="146" text-anchor="middle" font-size="13" fill="#3d3d3d">برابر هزینه رابطه</text>
<rect x="24" y="62" width="138" height="112" rx="12" fill="#e6f0f3" stroke="#3a8a9a" stroke-width="2"/>
<text x="93" y="92" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">۵. ائتلاف</text>
<text x="93" y="120" text-anchor="middle" font-size="13" fill="#3d3d3d">یک‌به‌یک متقاعد</text>
<text x="93" y="146" text-anchor="middle" font-size="13" fill="#3d3d3d">کنید</text>
<rect x="100" y="190" width="600" height="42" rx="12" fill="#fff" stroke="#2b2b2b" stroke-width="2"/>
<text x="400" y="217" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">از گزارش‌دهنده به مشاور استراتژیک</text>
</svg>
