# Pages CMS (https://pagescms.org) — web editor for this site
media:
  input: assets/uploads
  output: /assets/uploads
content:
  - name: posts
    label: یادداشت‌ها
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, category]
    fields:
      - { name: title, label: عنوان, type: string, required: true }
      - { name: date, label: تاریخ انتشار, type: date, required: true }
      - name: category
        label: موضوع
        type: select
        options:
          creatable: true
          values: [بودجه‌بندی, حسابرسی, مالیات و بیمه, سرمایه‌گذاری, سرمایه, گزارش مدیریتی, مدیریت, تحلیل مالی, مدل‌سازی مالی, صورت‌های مالی, ارزش‌گذاری, مسیر شغلی, بهره‌وری و عادت‌ها, رشد فردی, تصمیم‌گیری, ارتباطات, سبک زندگی]
      - { name: tags, label: برچسب‌ها, type: string, list: true }
      - { name: description, label: خلاصه‌ی یک‌خطی, type: text }
      - name: faq
        label: پرسش‌های متداول (برای داده‌ی ساختاریافته)
        type: object
        list: true
        fields:
          - { name: q, label: پرسش, type: string }
          - { name: a, label: پاسخ, type: text }
      - { name: published, label: منتشر شود (خاموش = پیش‌نویس), type: boolean, default: true }
      - { name: body, label: متن, type: rich-text }
  - name: settings
    label: تنظیمات سایت
    type: file
    path: _config.yml
    fields:
      - { name: title, label: نام سایت, type: string }
      - { name: tagline, label: زیرعنوان, type: string }
      - { name: description, label: توضیح سایت برای گوگل, type: text }
      - { name: email, label: ایمیل, type: string }
      - { name: phone, label: تلفن (خالی بماند تا نمایش داده نشود), type: string }
      - { name: linkedin, label: لینک لینکدین, type: string }
      - { name: telegram, label: لینک تلگرام, type: string }
