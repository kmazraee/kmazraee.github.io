---
layout: default
---
<header class="card page-head"><a class="kicker" href="{{ '/tools/' | relative_url }}" style="text-decoration:none">ابزارها</a><h1>{{ page.title }}</h1><p>{{ page.description }}</p>{% if page.download %}<div class="actions" style="margin-top:8px"><a class="btn btn-secondary" href="{{ page.download | relative_url }}" download>دانلود قالب اکسل</a></div>{% endif %}</header>
<div class="tool">
  {{ content }}
</div>
{% if page.method %}
<section class="card tool-method">
  <h2>چطور حساب می‌شود</h2>
  <div class="prose" style="font-size:16px;line-height:2">{{ page.method | markdownify }}</div>
</section>
{% endif %}
<script src="{{ '/assets/js/tools.js' | relative_url }}" defer></script>
