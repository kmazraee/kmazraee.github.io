<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
{% if site.photo != "" %}<meta property="og:image" content="{{ site.photo | absolute_url }}">{% endif %}
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Vazirmatn:wght@400;600;800&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
<div class="wrap">
{% include nav.html %}
<main>
{{ content }}
</main>
{% include footer.html %}
</div>
<script src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body>
</html>
