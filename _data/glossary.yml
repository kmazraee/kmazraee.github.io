# Persian finance glossary. id: anchor in the URL (latin, unique). en: English term.
- id: accrual
  fa: حسابداری تعهدی
  en: Accrual accounting
  def: ثبت درآمد و هزینه در دوره‌ای که اتفاق می‌افتد، نه زمانی که پول جابه‌جا می‌شود.
- id: balance-sheet
  fa: ترازنامه (صورت وضعیت مالی)
  en: Balance sheet
  def: تصویر دارایی‌ها، بدهی‌ها و حقوق صاحبان سهام شرکت در یک لحظه؛ همیشه دارایی برابر بدهی به‌علاوه‌ی حقوق صاحبان سهام است.
- id: beta
  fa: بتا
  en: Beta
  def: میزان حساسیت بازده یک سهم به نوسان کل بازار؛ بتای بیشتر از یک یعنی نوسان بیشتر از بازار.
- id: break-even
  fa: نقطه‌ی سربه‌سر
  en: Break-even point
  def: حجم فروشی که در آن درآمد دقیقاً هزینه‌های ثابت و متغیر را پوشش می‌دهد و سود صفر است.
- id: budget-variance
  fa: انحراف بودجه
  en: Budget variance
  def: تفاوت عدد واقعی با عدد بودجه‌شده؛ تحلیلش نشان می‌دهد کجا برنامه با واقعیت فاصله گرفته است.
- id: capex
  fa: مخارج سرمایه‌ای
  en: Capital expenditure (CapEx)
  def: پولی که صرف خرید یا نگهداری دارایی‌های بلندمدت مثل ماشین‌آلات و ساختمان می‌شود.
- id: capm
  fa: مدل قیمت‌گذاری دارایی‌های سرمایه‌ای
  en: CAPM
  def: روشی برای برآورد بازده مورد انتظار سهام از نرخ بدون ریسک، بتا و صرف ریسک بازار.
- id: cash-conversion-cycle
  fa: چرخه‌ی تبدیل وجه نقد
  en: Cash conversion cycle (CCC)
  def: تعداد روزهایی که پول در موجودی و مطالبات گیر می‌کند تا دوباره به نقد برگردد.
- id: cash-flow-statement
  fa: صورت جریان وجوه نقد
  en: Cash flow statement
  def: گزارش ورود و خروج واقعی پول در سه بخش عملیاتی، سرمایه‌گذاری و تأمین مالی.
- id: cogs
  fa: بهای تمام‌شده‌ی کالای فروش‌رفته
  en: Cost of goods sold (COGS)
  def: هزینه‌های مستقیم تولید یا خرید کالایی که در دوره فروخته شده است.
- id: covenant
  fa: تعهدات قرارداد وام
  en: Debt covenant
  def: شرط‌هایی که وام‌دهنده تعیین می‌کند، مثل سقف نسبت بدهی به سود عملیاتی، و نقضشان می‌تواند وام را سررسید کند.
- id: dcf
  fa: جریان نقد تنزیل‌شده
  en: Discounted cash flow (DCF)
  def: ارزش‌گذاری یک کسب‌وکار با پیش‌بینی جریان‌های نقد آینده و تنزیل آن‌ها به ارزش امروز.
- id: depreciation
  fa: استهلاک
  en: Depreciation
  def: تقسیم بهای یک دارایی ثابت بر سال‌های عمر مفیدش به‌عنوان هزینه؛ هزینه‌ای غیرنقدی است.
- id: dividend-yield
  fa: بازده سود نقدی
  en: Dividend yield
  def: سود نقدی سالانه‌ی هر سهم تقسیم بر قیمت سهم.
- id: dpo
  fa: دوره‌ی پرداخت بدهی‌ها
  en: Days payable outstanding (DPO)
  def: میانگین روزهایی که شرکت طول می‌کشد تا به تأمین‌کنندگانش پول بدهد.
- id: dso
  fa: دوره‌ی وصول مطالبات
  en: Days sales outstanding (DSO)
  def: میانگین روزهایی که طول می‌کشد پول فروش نسیه از مشتری وصول شود.
- id: dupont
  fa: تحلیل دوپونت
  en: DuPont analysis
  def: تجزیه‌ی بازده حقوق صاحبان سهام به سه جزء حاشیه‌ی سود، گردش دارایی و اهرم مالی.
- id: ebitda
  fa: سود قبل از بهره، مالیات و استهلاک
  en: EBITDA
  def: معیاری از سود عملیاتی پیش از اثر ساختار سرمایه، مالیات و هزینه‌های غیرنقدی استهلاک.
- id: enterprise-value
  fa: ارزش بنگاه
  en: Enterprise value (EV)
  def: ارزش کل کسب‌وکار برای همه‌ی تأمین‌کنندگان سرمایه؛ ارزش بازار سهام به‌علاوه‌ی بدهی منهای وجه نقد.
- id: equity
  fa: حقوق صاحبان سهام
  en: Shareholders' equity
  def: سهم مالکان از دارایی‌های شرکت پس از کسر همه‌ی بدهی‌ها.
- id: fcf
  fa: جریان نقد آزاد
  en: Free cash flow (FCF)
  def: پولی که پس از هزینه‌های عملیاتی و مخارج سرمایه‌ای باقی می‌ماند و می‌تواند به سهامداران و وام‌دهندگان برسد.
- id: gross-margin
  fa: حاشیه‌ی سود ناخالص
  en: Gross margin
  def: سود ناخالص تقسیم بر فروش؛ نشان می‌دهد از هر تومان فروش چقدر پس از بهای تمام‌شده می‌ماند.
- id: income-statement
  fa: صورت سود و زیان
  en: Income statement
  def: گزارش درآمدها، هزینه‌ها و سود یا زیان شرکت در یک دوره‌ی زمانی.
- id: irr
  fa: نرخ بازده داخلی
  en: Internal rate of return (IRR)
  def: نرخ تنزیلی که ارزش فعلی خالص یک پروژه را صفر می‌کند؛ بازده سالانه‌ی ضمنی سرمایه‌گذاری.
- id: lbo
  fa: خرید اهرمی
  en: Leveraged buyout (LBO)
  def: خرید یک شرکت که بخش بزرگی از بهای آن با وام تأمین می‌شود و وام از جریان نقد خود شرکت بازپرداخت می‌شود.
- id: leverage
  fa: اهرم مالی
  en: Financial leverage
  def: استفاده از بدهی برای تأمین مالی؛ بازده را در شرایط خوب بزرگ‌تر و زیان را در شرایط بد عمیق‌تر می‌کند.
- id: liquidity
  fa: نقدشوندگی
  en: Liquidity
  def: توانایی شرکت در پرداخت تعهدات کوتاه‌مدت با دارایی‌هایی که سریع به پول تبدیل می‌شوند.
- id: moat
  fa: مزیت رقابتی پایدار
  en: Economic moat
  def: ویژگی‌ای که از سود یک کسب‌وکار در برابر رقبا برای سال‌ها محافظت می‌کند، مثل برند یا هزینه‌ی جابه‌جایی مشتری.
- id: net-income
  fa: سود خالص
  en: Net income
  def: آنچه از درآمد پس از کسر همه‌ی هزینه‌ها، بهره و مالیات می‌ماند.
- id: npv
  fa: ارزش فعلی خالص
  en: Net present value (NPV)
  def: ارزش امروز همه‌ی جریان‌های نقد آینده‌ی یک پروژه منهای سرمایه‌ی اولیه؛ مثبت بودنش یعنی پروژه ارزش می‌آفریند.
- id: operating-leverage
  fa: اهرم عملیاتی
  en: Operating leverage
  def: میزان حساسیت سود عملیاتی به تغییر فروش؛ هرچه سهم هزینه‌های ثابت بیشتر باشد، اهرم عملیاتی بالاتر است.
- id: pe
  fa: نسبت قیمت به سود
  en: Price-to-earnings (P/E)
  def: قیمت هر سهم تقسیم بر سود هر سهم؛ نشان می‌دهد بازار برای هر تومان سود چقدر می‌پردازد.
- id: real-return
  fa: بازده واقعی
  en: Real return
  def: بازده یک سرمایه‌گذاری پس از کسر اثر تورم؛ قدرت خرید واقعی‌ای که به دست آمده است.
- id: roe
  fa: بازده حقوق صاحبان سهام
  en: Return on equity (ROE)
  def: سود خالص تقسیم بر حقوق صاحبان سهام؛ بازدهی که شرکت روی پول مالکان به دست آورده است.
- id: roi
  fa: بازده سرمایه‌گذاری
  en: Return on investment (ROI)
  def: سود خالص یک سرمایه‌گذاری تقسیم بر هزینه‌ی آن؛ ساده است اما زمان و ریسک را نمی‌بیند.
- id: roic
  fa: بازده سرمایه‌ی به‌کاررفته
  en: Return on invested capital (ROIC)
  def: سود عملیاتی پس از مالیات تقسیم بر کل سرمایه‌ای که در کسب‌وکار به کار رفته است.
- id: scenario-analysis
  fa: تحلیل سناریو
  en: Scenario analysis
  def: بررسی نتیجه‌ی مدل در چند وضعیت ممکن مثل خوش‌بینانه، پایه و بدبینانه.
- id: sensitivity-analysis
  fa: تحلیل حساسیت
  en: Sensitivity analysis
  def: تغییر یک فرض در هر بار و دیدن اثرش بر نتیجه، تا معلوم شود مدل به کدام فرض حساس‌تر است.
- id: terminal-value
  fa: ارزش پایانی
  en: Terminal value
  def: ارزش همه‌ی جریان‌های نقد پس از دوره‌ی پیش‌بینی در مدل DCF؛ معمولاً بخش بزرگی از کل ارزش است.
- id: wacc
  fa: میانگین موزون هزینه‌ی سرمایه
  en: Weighted average cost of capital (WACC)
  def: میانگین هزینه‌ی تأمین مالی از سهامداران و وام‌دهندگان به نسبت سهم هرکدام؛ نرخ تنزیل رایج در DCF.
- id: working-capital
  fa: سرمایه‌ی در گردش
  en: Working capital
  def: دارایی‌های جاری منهای بدهی‌های جاری؛ پولی که برای چرخاندن کار روزانه لازم است.
- id: ebit
  fa: سود قبل از بهره و مالیات
  en: EBIT
  def: سود عملیاتی شرکت پس از کسر استهلاک و پیش از کسر بهره و مالیات؛ نشان می‌دهد فعالیت اصلی چقدر سود می‌سازد.
- id: operating-margin
  fa: حاشیه‌ی سود عملیاتی
  en: Operating margin
  def: سود عملیاتی تقسیم بر فروش؛ سهمی از هر ریال فروش که پس از هزینه‌های عملیاتی باقی می‌ماند.
- id: net-margin
  fa: حاشیه‌ی سود خالص
  en: Net profit margin
  def: سود خالص تقسیم بر فروش؛ سهم نهایی سود از هر ریال فروش پس از همه‌ی هزینه‌ها، بهره و مالیات.
- id: contribution-margin
  fa: حاشیه‌ی مشارکت
  en: Contribution margin
  def: قیمت فروش منهای هزینه‌ی متغیر هر واحد؛ مقداری که هر واحد فروش برای پوشش هزینه‌های ثابت و سود فراهم می‌کند.
- id: fixed-cost
  fa: هزینه‌ی ثابت
  en: Fixed cost
  def: هزینه‌ای که در محدوده‌ی معمول فعالیت با تغییر حجم تولید یا فروش تغییر نمی‌کند، مانند اجاره یا حقوق ثابت.
- id: variable-cost
  fa: هزینه‌ی متغیر
  en: Variable cost
  def: هزینه‌ای که تقریباً متناسب با حجم تولید یا فروش بالا و پایین می‌رود، مانند مواد اولیه.
- id: current-ratio
  fa: نسبت جاری
  en: Current ratio
  def: دارایی‌های جاری تقسیم بر بدهی‌های جاری؛ توان شرکت در پرداخت تعهدات کوتاه‌مدت از محل دارایی‌های کوتاه‌مدت.
- id: quick-ratio
  fa: نسبت آنی
  en: Quick ratio
  def: دارایی‌های جاری منهای موجودی کالا تقسیم بر بدهی‌های جاری؛ معیار سخت‌گیرانه‌تر نقدینگی چون موجودی را نمی‌شمارد.
- id: debt-to-equity
  fa: نسبت بدهی به حقوق صاحبان سهام
  en: Debt-to-equity ratio
  def: کل بدهی تقسیم بر حقوق صاحبان سهام؛ نشان می‌دهد شرکت چقدر با پول قرضی کار می‌کند.
- id: interest-coverage
  fa: نسبت پوشش بهره
  en: Interest coverage ratio
  def: سود قبل از بهره و مالیات تقسیم بر هزینه‌ی بهره؛ تعداد دفعاتی که سود عملیاتی بهره را پوشش می‌دهد.
- id: dscr
  fa: نسبت پوشش خدمت بدهی
  en: Debt service coverage ratio (DSCR)
  def: جریان نقد در دسترس برای بدهی تقسیم بر مجموع اصل و بهره‌ی سررسیدشده؛ وام‌دهندگان معمولاً حداقلی بالاتر از یک می‌خواهند.
- id: net-debt
  fa: بدهی خالص
  en: Net debt
  def: کل بدهی‌های بهره‌دار منهای وجه نقد و معادل نقد؛ مبنای محاسبه‌ی ارزش حقوق صاحبان سهام از ارزش بنگاه.
- id: market-cap
  fa: ارزش بازار شرکت
  en: Market capitalization
  def: قیمت هر سهم ضرب‌در تعداد سهام منتشرشده؛ ارزشی که بازار در حال حاضر برای حقوق صاحبان سهام قائل است.
- id: ev-ebitda
  fa: ضریب ارزش بنگاه به EBITDA
  en: EV/EBITDA
  def: ارزش بنگاه تقسیم بر EBITDA؛ ضریب رایج برای مقایسه‌ی شرکت‌ها بدون اثر ساختار سرمایه و استهلاک.
- id: price-to-book
  fa: نسبت قیمت به ارزش دفتری
  en: Price-to-book (P/B)
  def: ارزش بازار تقسیم بر ارزش دفتری حقوق صاحبان سهام؛ نسبت پایین‌تر از یک می‌تواند ارزان‌بودن یا مشکل در شرکت را نشان دهد.
- id: eps
  fa: سود هر سهم
  en: Earnings per share (EPS)
  def: سود خالص قابل‌تخصیص به سهامداران عادی تقسیم بر تعداد سهام؛ مبنای محاسبه‌ی نسبت قیمت به سود.
- id: dividend-payout
  fa: نسبت تقسیم سود
  en: Dividend payout ratio
  def: سهمی از سود خالص که به‌صورت سود نقدی بین سهامداران تقسیم می‌شود.
- id: ddm
  fa: مدل تنزیل سود نقدی
  en: Dividend discount model (DDM)
  def: ارزش سهم را برابر ارزش فعلی سودهای نقدی آینده می‌داند؛ شکل ساده‌ی آن مدل رشد گوردون است.
- id: gordon-growth
  fa: مدل رشد گوردون
  en: Gordon growth model
  def: ارزش یک جریان با رشد ثابت همیشگی برابر است با جریان سال بعد تقسیم بر تفاوت نرخ تنزیل و رشد.
- id: discount-rate
  fa: نرخ تنزیل
  en: Discount rate
  def: نرخی که با آن جریان‌های نقد آینده به ارزش امروز تبدیل می‌شوند؛ بازتاب ارزش زمانی پول و ریسک.
- id: time-value-of-money
  fa: ارزش زمانی پول
  en: Time value of money
  def: اصل بنیادین مالی که می‌گوید یک ریال امروز بیشتر از یک ریال در آینده می‌ارزد، چون می‌توان آن را سرمایه‌گذاری کرد.
- id: compound-interest
  fa: بهره‌ی مرکب
  en: Compound interest
  def: بهره‌ای که بر اصل و بر بهره‌ی قبلاً انباشته‌شده محاسبه می‌شود؛ ریشه‌ی رشد نمایی سرمایه در بلندمدت.
- id: cagr
  fa: نرخ رشد مرکب سالانه
  en: CAGR
  def: نرخ ثابت سالانه‌ای که ارزش اولیه را در طول چند سال به ارزش پایانی می‌رساند؛ معیار هموارشده‌ی رشد.
- id: rule-of-72
  fa: قاعده‌ی ۷۲
  en: Rule of 72
  def: برآورد سریع با تقسیم عدد ۷۲ بر نرخ بازده سالانه (درصد) تقریباً تعداد سال‌های لازم برای دوبرابرشدن پول است.
- id: inflation
  fa: تورم
  en: Inflation
  def: افزایش عمومی سطح قیمت‌ها که قدرت خرید پول را در طول زمان کاهش می‌دهد.
- id: nominal-rate
  fa: نرخ اسمی
  en: Nominal rate
  def: نرخ اعلام‌شده‌ی بازده یا بهره، بدون در نظر گرفتن تورم؛ برای قدرت خرید باید به نرخ واقعی تبدیل شود.
- id: effective-annual-rate
  fa: نرخ مؤثر سالانه
  en: Effective annual rate (EAR)
  def: نرخ واقعی سالانه پس از اثر مرکب‌شدن بهره در دوره‌های کوتاه‌تر مثل ماهانه.
- id: ytm
  fa: بازده تا سررسید
  en: Yield to maturity (YTM)
  def: نرخ بازده سالانه‌ای که خریدار اوراق با نگهداری تا سررسید و دریافت همه‌ی کوپن‌ها و اصل به دست می‌آورد.
- id: coupon
  fa: کوپن (سود دوره‌ای اوراق)
  en: Coupon
  def: سود دوره‌ای که ناشر اوراق بدهی در فواصل مشخص به دارنده می‌پردازد، معمولاً درصدی از ارزش اسمی.
- id: duration
  fa: دیرش (مدت زمان مؤثر اوراق)
  en: Duration
  def: معیاری از حساسیت قیمت اوراق به تغییر نرخ بهره؛ دیرش بیشتر یعنی افت قیمت بیشتر با افزایش نرخ.
- id: eoq
  fa: اندازه‌ی اقتصادی سفارش
  en: Economic order quantity (EOQ)
  def: مقدار سفارشی که مجموع هزینه‌ی سفارش‌دهی و نگهداری موجودی را کمینه می‌کند.
- id: inventory-turnover
  fa: گردش موجودی کالا
  en: Inventory turnover
  def: بهای تمام‌شده‌ی کالای فروش‌رفته تقسیم بر میانگین موجودی؛ نشان می‌دهد موجودی در سال چند بار فروخته و جایگزین می‌شود.
- id: dio
  fa: دوره‌ی نگهداری موجودی
  en: Days inventory outstanding (DIO)
  def: تعداد روزهایی که به‌طور میانگین کالا پیش از فروش در انبار می‌ماند.
- id: burn-rate
  fa: نرخ سوزاندن نقد
  en: Burn rate
  def: مقدار خالص نقدی که شرکت (معمولاً نوپا و زیان‌ده) در هر ماه مصرف می‌کند.
- id: runway
  fa: افق بقای نقد
  en: Cash runway
  def: تعداد ماه‌هایی که با نرخ سوزاندن فعلی و موجودی نقد، شرکت می‌تواند به کار ادامه دهد.
- id: days-cash-on-hand
  fa: روزهای نقد در دسترس
  en: Days cash on hand
  def: موجودی نقد تقسیم بر هزینه‌ی نقدی عملیاتی روزانه؛ تعداد روزهایی که شرکت بدون درآمد جدید دوام می‌آورد.
- id: free-cash-flow-to-equity
  fa: جریان نقد آزاد سهامداران
  en: Free cash flow to equity (FCFE)
  def: نقدی که پس از پرداخت هزینه‌ها، سرمایه‌گذاری لازم و خدمت بدهی برای سهامداران باقی می‌ماند.
- id: cost-of-equity
  fa: هزینه‌ی حقوق صاحبان سهام
  en: Cost of equity
  def: بازدهی که سهامداران برای پذیرش ریسک شرکت انتظار دارند؛ معمولاً با CAPM برآورد می‌شود.
- id: cost-of-debt
  fa: هزینه‌ی بدهی
  en: Cost of debt
  def: نرخ بهره‌ای که شرکت برای قرض‌گرفتن می‌پردازد؛ پس از اثر سپر مالیاتی بهره، هزینه‌ی مؤثر کمتر می‌شود.
- id: tax-shield
  fa: سپر مالیاتی
  en: Tax shield
  def: کاهش مالیات به‌دلیل قابل‌کسربودن هزینه‌هایی مانند بهره‌ی وام و استهلاک.
- id: capital-structure
  fa: ساختار سرمایه
  en: Capital structure
  def: ترکیب بدهی و حقوق صاحبان سهام که شرکت برای تأمین مالی دارایی‌هایش به کار می‌برد.
- id: risk-premium
  fa: صرف ریسک بازار
  en: Market risk premium
  def: بازده اضافی که سرمایه‌گذاران نسبت به نرخ بدون ریسک برای سرمایه‌گذاری در سهام بازار انتظار دارند.
- id: risk-free-rate
  fa: نرخ بدون ریسک
  en: Risk-free rate
  def: بازده سرمایه‌گذاری فرضاً بدون ریسک نکول، معمولاً بازده اوراق بدهی دولتی؛ مبنای نرخ‌های تنزیل.
- id: diversification
  fa: تنوع‌بخشی
  en: Diversification
  def: توزیع سرمایه میان دارایی‌های مختلف برای کاهش ریسک ویژه‌ی هر دارایی بدون لزوماً کاهش بازده مورد انتظار.
- id: standard-deviation
  fa: انحراف معیار
  en: Standard deviation
  def: معیار پراکندگی بازده حول میانگین؛ در مالی اغلب به‌عنوان اندازه‌ی نوسان و ریسک به کار می‌رود.
- id: sharpe-ratio
  fa: نسبت شارپ
  en: Sharpe ratio
  def: بازده اضافی نسبت به نرخ بدون ریسک تقسیم بر انحراف معیار؛ بازده به‌ازای هر واحد ریسک.
- id: forecast
  fa: پیش‌بینی مالی
  en: Forecast
  def: برآورد به‌روز از نتایج آینده بر پایه‌ی اطلاعات جدید؛ برخلاف بودجه که هدف و تعهد است.
- id: zero-based-budgeting
  fa: بودجه‌ریزی مبتنی بر صفر
  en: Zero-based budgeting
  def: روشی که هر دوره بودجه را از صفر و با توجیه هر هزینه می‌سازد، نه با تعدیل درصدی سال قبل.
- id: driver-based-planning
  fa: برنامه‌ریزی مبتنی بر محرک‌ها
  en: Driver-based planning
  def: ساختن بودجه و پیش‌بینی از محرک‌های عملیاتی مثل تعداد مشتری و قیمت، به‌جای تعدیل اعداد سال قبل.
- id: rolling-forecast
  fa: پیش‌بینی غلتان
  en: Rolling forecast
  def: پیش‌بینی که با گذشت هر دوره به‌روز و یک دوره به آینده کشیده می‌شود تا همیشه افق ثابتی داشته باشد.
- id: fpa
  fa: برنامه‌ریزی و تحلیل مالی
  en: FP&A
  def: واحدی در مالی شرکتی که بودجه، پیش‌بینی، گزارشگری مدیریتی و تحلیل تصمیم‌ها را بر عهده دارد.
- id: kpi
  fa: شاخص کلیدی عملکرد
  en: KPI
  def: معیار عددی منتخب که میزان پیشرفت به‌سوی هدف مشخص کسب‌وکار را نشان می‌دهد.
- id: accounts-receivable
  fa: حساب‌های دریافتنی
  en: Accounts receivable
  def: مبالغی که مشتریان بابت فروش اعتباری هنوز نپرداخته‌اند؛ دارایی جاری شرکت.
- id: accounts-payable
  fa: حساب‌های پرداختنی
  en: Accounts payable
  def: مبالغی که شرکت بابت خرید اعتباری به تأمین‌کنندگان بدهکار است؛ بدهی جاری.
- id: goodwill
  fa: سرقفلی (حسن شهرت)
  en: Goodwill
  def: مازاد بهای خرید یک شرکت نسبت به ارزش منصفانه‌ی خالص دارایی‌های شناسایی‌پذیر آن؛ در ترازنامه ثبت می‌شود.
- id: impairment
  fa: کاهش ارزش دارایی
  en: Impairment
  def: شناسایی زیان وقتی ارزش بازیافتنی دارایی از ارزش دفتری آن کمتر می‌شود.
- id: matching-principle
  fa: اصل تطابق
  en: Matching principle
  def: هزینه‌ها باید در همان دوره‌ای ثبت شوند که درآمد مرتبط با آن‌ها شناسایی می‌شود.
- id: retained-earnings
  fa: سود انباشته
  en: Retained earnings
  def: بخشی از سودهای گذشته که تقسیم نشده و در شرکت نگه داشته شده است.
- id: due-diligence
  fa: بررسی دقیق (احراز مالی و حقوقی)
  en: Due diligence
  def: بررسی تفصیلی صورت‌های مالی، قراردادها و ریسک‌های یک شرکت پیش از خرید یا سرمایه‌گذاری.
- id: dilution
  fa: رقیق‌شدن سهام
  en: Dilution
  def: کاهش درصد مالکیت سهامداران موجود هنگام انتشار سهام جدید.
- id: pre-money-valuation
  fa: ارزش پیش از سرمایه‌گذاری
  en: Pre-money valuation
  def: ارزش شرکت قبل از ورود پول جدید؛ ارزش پس از سرمایه‌گذاری برابر آن به‌علاوه‌ی مبلغ جذب‌شده است.
- id: moic
  fa: چند برابر شدن سرمایه
  en: MOIC
  def: ارزش خروج سرمایه‌گذاری تقسیم بر مبلغ سرمایه‌گذاری اولیه، بدون توجه به زمان.
- id: ltv-cac
  fa: ارزش طول عمر مشتری به هزینه‌ی جذب
  en: LTV/CAC
  def: نسبت ارزش کل سودی که یک مشتری می‌سازد به هزینه‌ی جذب او؛ شاخص اقتصاد واحد کسب‌وکار.
- id: churn
  fa: نرخ ریزش مشتری
  en: Churn rate
  def: درصد مشتریان یا درآمدی که در یک دوره از دست می‌رود.
- id: price-elasticity
  fa: کشش قیمتی تقاضا
  en: Price elasticity of demand
  def: درصد تغییر مقدار تقاضا نسبت به یک درصد تغییر قیمت؛ مقدار بزرگ‌تر از یک یعنی تقاضا حساس به قیمت است.
